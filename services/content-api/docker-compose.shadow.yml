services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igropoisk}
      POSTGRES_USER: ${POSTGRES_USER:-igropoisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadow-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - news_shadow_postgres:/var/lib/postgresql/data

  content-api:
    build:
      context: ../..
      dockerfile: services/content-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-igropoisk}:${POSTGRES_PASSWORD:-shadow-local-only}@postgres:5432/${POSTGRES_DB:-igropoisk}
      CONTENT_RUNTIME_MODE: shadow
      CONTENT_READ_SOURCE: object_storage
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://nkuchenov-hash.github.io}
      SERVICE_VERSION: ${SERVICE_VERSION:-local-shadow}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTENT_API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  news_shadow_postgres:
