<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игропоиск — каталог игр</title>
<meta name="description" content="Каталог Игропоиска: страницы игр, рейтинги, материалы и медиа.">
<style>
:root{--bg:#071017;--panel:#0d171f;--panel2:#111d26;--text:#f5f7f8;--muted:#91a0aa;--line:#1b2a35;--accent:#a7d433;--purple:#a55cff}html[data-theme=light]{--bg:#f4f5f7;--panel:#fff;--panel2:#f8f9fb;--text:#12171b;--muted:#69737b;--line:#dfe3e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:32px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);z-index:10}.logo{font-size:24px;font-weight:950}.nav{display:flex;gap:24px}.nav a{padding:23px 0}.nav a.active{border-bottom:2px solid var(--purple)}.theme{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;width:40px;height:40px;font-size:18px}.hero{border-bottom:1px solid var(--line);padding:72px 28px 58px;background:radial-gradient(circle at 80% 20%,rgba(165,92,255,.18),transparent 32%),linear-gradient(135deg,#0d171f,#071017)}.hero-inner{max-width:1480px;margin:auto}.hero h1{font:700 clamp(44px,7vw,82px)/.95 Georgia,serif;letter-spacing:-3px;margin:0 0 18px;max-width:850px}.hero p{font-size:18px;color:#cbd4da;max-width:650px;line-height:1.55}.wrap{max-width:1480px;margin:auto;padding:34px 28px 70px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.search{flex:1;min-width:260px;height:46px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:0 14px}.count{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.game{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;transition:.18s}.game:hover{transform:translateY(-3px);border-color:#52616b}.cover{aspect-ratio:2/3;background:linear-gradient(145deg,var(--panel2),#182834);display:flex;align-items:flex-end;padding:18px;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(167,212,51,.16),transparent 34%),linear-gradient(0deg,rgba(0,0,0,.75),transparent 65%)}.cover span{position:relative;font:700 24px/1.02 Georgia,serif;letter-spacing:-1px}.info{padding:13px}.info h2{font-size:15px;margin:0 0 6px}.info p{margin:0;color:var(--muted)}.empty{padding:40px;border:1px dashed var(--line);color:var(--muted);border-radius:9px;grid-column:1/-1}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.nav{display:none}}@media(max-width:540px){.header,.hero,.wrap{padding-left:16px;padding-right:16px}.grid{grid-template-columns:repeat(2,1fr)}.cover span{font-size:19px}}
</style>
</head>
<body>
<header class="header"><a class="logo" href="./">ИГРОПОИСК</a><nav class="nav"><a class="active" href="./">Главное</a><a href="#catalog">Все игры</a></nav><button class="theme" id="theme">☀</button></header>
<section class="hero"><div class="hero-inner"><h1>Игры, в которые стоит играть</h1><p>Полный каталог страниц Игропоиска. Здесь отображаются исходные 50 игр и дополнительно серия Mafia.</p></div></section>
<main class="wrap" id="catalog"><div class="toolbar"><input class="search" id="search" placeholder="Найти игру по названию или году"><span class="count" id="count">Загрузка каталога…</span></div><div class="grid" id="grid"></div></main>
<script>
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count');let games=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=search.value.trim().toLowerCase(),rows=games.filter(g=>!q||g.title.toLowerCase().includes(q)||String(g.year).includes(q));count.textContent=`Показано: ${rows.length} из ${games.length}`;grid.innerHTML=rows.map(g=>`<a class="game" href="game/${g.slug}/"><div class="cover"><span>${esc(g.title)}</span></div><div class="info"><h2>${esc(g.title)}</h2><p>${g.year}</p></div></a>`).join('')||'<div class="empty">Игры не найдены.</div>'}
fetch('data/catalog-visible.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(x=>{games=x;render()}).catch(()=>{count.textContent='Не удалось загрузить каталог';grid.innerHTML='<div class="empty">Ошибка загрузки списка игр.</div>'});search.addEventListener('input',render);theme.onclick=()=>{const light=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=light?'dark':'light';theme.textContent=light?'☀':'☾';localStorage.setItem('igroTheme',light?'dark':'light')};const saved=localStorage.getItem('igroTheme');if(saved){document.documentElement.dataset.theme=saved;theme.textContent=saved==='light'?'☾':'☀'}
</script>
</body></html>
