<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Материал готовится — Игропоиск</title>
  <link rel="stylesheet" href="../../assets/design-system.css?v=20260818-1">
  <link rel="stylesheet" href="/Igropoisk/assets/site-header.css?v=20260803-2" data-ig-shared-header="style">
  <style>
    body{margin:0;background:var(--ig-bg,#0b0d10);color:var(--ig-text,#f5f7f8);font-family:Inter,Arial,sans-serif}
    .pending-shell{min-height:100vh;display:grid;place-items:center;padding:32px}
    .pending-content{width:min(720px,100%);padding:36px;border:1px solid var(--ig-line,#2a2d33);border-radius:18px;background:var(--ig-surface,#14171c);box-shadow:0 18px 60px rgba(0,0,0,.24)}
    .pending-kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ig-rating,#b7ff55);margin-bottom:12px}
    h1{font-size:clamp(32px,6vw,54px);line-height:1.04;margin:0 0 18px}
    p{font-size:18px;line-height:1.55;margin:0 0 24px;color:var(--ig-muted,#a9afb7)}
    .pending-actions{display:flex;flex-wrap:wrap;gap:12px}
    .pending-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;text-decoration:none;font-weight:800}
    .pending-primary{background:var(--ig-rating,#b7ff55);color:#10130c}
    .pending-secondary{border:1px solid var(--ig-line,#2a2d33);color:inherit}
  </style>
  <link rel="stylesheet" href="/Igropoisk/assets/layout-contract.css?v=20260803-1" data-ig-layout-contract="style">
</head>
<body>
  <main class="pending-shell">
    <section class="pending-content" aria-live="polite">
      <div class="pending-kicker">Игропоиск</div>
      <h1 id="gameTitle">Материал готовится</h1>
      <p>Страница игры уже поставлена в очередь на сборку. Новости доступны сразу, а полная страница появится здесь автоматически после завершения сборки.</p>
      <div class="pending-actions">
        <a class="pending-primary" href="../../?page=news">Вернуться к новостям</a>
        <a class="pending-secondary" href="../../">На главную</a>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const slug = String(params.get('slug') || '').trim().toLowerCase();
      const title = String(params.get('title') || '').trim();
      if (title) {
        document.querySelector('#gameTitle').textContent = title;
        document.title = `${title} — материал готовится — Игропоиск`;
      }
      if (!slug || slug === 'pending' || !/^[a-z0-9][a-z0-9-]*$/.test(slug)) return;
      const target = new URL(`../${encodeURIComponent(slug)}/`, location.href);
      const check = async () => {
        try {
          const response = await fetch(target.href, { cache: 'no-store' });
          if (response.ok) location.replace(target.href);
        } catch {}
      };
      check();
      setInterval(check, 30000);
    })();
  </script>
  <script src="/Igropoisk/assets/site-header.js?v=20260803-2" data-ig-shared-header="script" defer></script>
  <script src="/Igropoisk/assets/layout-contract.js?v=20260803-1" data-ig-layout-contract="script" defer></script>
</body>
</html>
