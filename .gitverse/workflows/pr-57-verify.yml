name: GitVerse PR 57 independent validation
run-name: Validate PR 57 snapshot ${{ gitverse.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - gitverse-ci/pr-57

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify immutable source and branch boundaries
        run: |
          node scripts/verify-deployment-source.mjs
          node scripts/validate-production-boundaries.mjs
          test -z "$(git status --porcelain)"

      - name: Check JavaScript and regression tests
        run: |
          find assets scripts features -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
          node scripts/test-automation-publish-guard.mjs
          node scripts/test-home-feed-quality.mjs

      - name: Check news, feeds and module contracts
        run: |
          node scripts/test-news-content-api.mjs
          node scripts/test-news-storage-content-api.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/validate-news-pipeline.mjs
          node scripts/validate-news-module.mjs
          node scripts/validate-home-feeds.mjs

      - name: Check Python, page generation and layout contract
        run: |
          python3 -m py_compile parser/build_pages_safe.py
          python3 -m py_compile scripts/test_safe_game_page_builder.py
          python3 scripts/test_safe_game_page_builder.py
          python3 -m py_compile scripts/enforce_layout_contract.py
          python3 scripts/enforce_layout_contract.py --check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Check JSON integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          errors = []
          for root in (Path('config'), Path('data')):
              if not root.exists():
                  continue
              for file in root.rglob('*.json'):
                  try:
                      json.loads(file.read_text(encoding='utf-8'))
                  except Exception as error:
                      errors.append(f'{file}: {error}')
          if errors:
              raise SystemExit('Invalid JSON files:\n' + '\n'.join(errors))
          print('All JSON files are valid.')
          PY

      - name: Check publication gates and patch integrity
        run: |
          node scripts/validate-game-v3.mjs
          node scripts/validate-editorial-pipeline.mjs
          git diff --check
          test -z "$(git status --porcelain)"

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser client
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Ensure Chrome or Chromium is available
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1 || \
             command -v google-chrome >/dev/null 2>&1 || \
             command -v chromium >/dev/null 2>&1 || \
             command -v chromium-browser >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser

      - name: Verify news and home feeds locally
        run: |
          node scripts/smoke-news-browser.mjs
          node scripts/smoke-home-feeds-browser.mjs

  prepare-pages:
    needs:
      - validate
      - browser-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated snapshot
        uses: actions/checkout@v4

      - name: Build static preview directory
        run: |
          rm -rf _site
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .gitverse \
            ! -name _site \
            -exec cp -a {} _site/ \;
          test -f _site/index.html

      - name: Upload GitVerse Pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: _site
          retention-days: 3

  deploy-preview:
    needs: prepare-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy temporary GitVerse Pages preview
        uses: gitverse/deploy-pages@v1.0.0
