<body class="ig-site-page">
<header class="ig-site-header" aria-label="Основная навигация"></header>
<main class="ig-container release-page ig-page-shell">
  <nav class="release-breadcrumb" aria-label="Хлебные крошки"><a href="../index.html">Главная</a><span>›</span><span>Календарь релизов</span></nav>
  <section class="release-intro">
    <div><div class="release-kicker">Отобрано редакцией</div><h1>Календарь релизов</h1></div>
    <div class="release-intro__stats" aria-label="Статистика календаря"><div><strong id="releaseMonthTotal">—</strong><span>игр в месяце</span></div><div><strong id="releaseMonthExact">—</strong><span>с точной датой</span></div><div><strong id="releaseMonthExpansions">—</strong><span>крупных дополнений</span></div></div>
  </section>
  <section class="release-command-bar" aria-label="Управление календарём">
    <div class="release-view-tabs ig-tabs" role="tablist" aria-label="Режим отображения"><button class="ig-action active" type="button" data-view="calendar" role="tab" aria-selected="true">Календарь</button><button class="ig-action" type="button" data-view="list" role="tab" aria-selected="false">Список</button><button class="ig-action" type="button" data-view="feed" role="tab" aria-selected="false">Лента</button></div>
    <div class="release-quick-filters"><label><span>Платформа</span><select class="ig-input" id="releasePlatform"><option value="">Все платформы</option></select></label><label><span>Жанр</span><select class="ig-input" id="releaseGenre"><option value="">Все жанры</option></select></label><label><span>Точность</span><select class="ig-input" id="releasePrecision"><option value="">Любая подтверждённая дата</option><option value="exact">Точная дата</option><option value="month">Месяц</option><option value="quarter">Квартал</option><option value="year">Год</option></select></label></div>
  </section>
  <div class="release-layout">
    <section class="release-main" aria-label="Релизы"><header class="release-period-bar"><div class="release-period-nav"><button class="ig-button release-icon-button" id="releasePrev" type="button" aria-label="Предыдущий месяц">‹</button><h2 id="releasePeriodTitle">—</h2><button class="ig-button release-icon-button" id="releaseNext" type="button" aria-label="Следующий месяц">›</button><button class="ig-button" id="releaseToday" type="button">Сегодня</button></div><div class="release-result-count" id="releaseResultCount">Загрузка…</div></header><div id="releaseView" aria-live="polite"></div></section>
    <aside class="release-rail"><section class="ig-card release-rail-card"><div class="release-rail-head"><h2>Скоро выйдут</h2><a href="#releaseView">Смотреть все</a></div><div class="release-upcoming" id="releaseUpcoming"></div></section><section class="ig-card release-rail-card"><div class="release-rail-head"><h2>Изменения дат</h2></div><div class="release-changes" id="releaseChanges"></div></section><section class="ig-card release-rail-card release-rail-note"><span class="release-source-dot"></span><div><strong>Steam подтверждает только PC</strong><p>Консольные даты допускаются из официальных магазинов, сайтов издателей и официальных анонсов.</p></div></section></aside>
