name: Publish short-description benchmark stand

on:
  push:
    branches: [benchmark/publish-short-descriptions-20260904]
    paths:
      - '.github/workflows/publish-short-description-benchmark.yml'
      - 'scripts/build-short-description-live-stand.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark/publish-short-descriptions-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download completed short-description artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: nkuchenov-hash/Igropoisk
          run-id: 33867909647
          pattern: short-result-*
          path: short-artifacts
          merge-multiple: false
      - name: Build live benchmark pages
        run: node scripts/build-short-description-live-stand.mjs
      - name: Validate central design system
        run: node scripts/validate-central-design-system.mjs
      - name: Validate shared layout contract
        run: python scripts/enforce_layout_contract.py --check
      - name: Commit generated benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/five-games-short-descriptions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish five-game short-description benchmark"
          git push origin HEAD:benchmark/publish-short-descriptions-20260904
