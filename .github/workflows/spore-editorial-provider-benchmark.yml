name: Spore editorial provider benchmark

on:
  workflow_dispatch:
  push:
    branches: [fix/game-page-module-contract-20260902]
    paths:
      - '.github/workflows/spore-editorial-provider-benchmark.yml'
      - 'scripts/benchmark-spore-editorial-provider.mjs'
      - 'scripts/lib/free-editorial-ai.mjs'

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        provider: [openrouter, gigachat, gemini, groq]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore identical accepted Spore evidence corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/spore-benchmark-base
          mkdir -p /tmp/spore-benchmark-base
          mkdir -p data/parser-output data/drafts data/game-sources data/ratings
          gh run download 33793623719 -n spore-full-pr-acceptance-33793623719-1 -D /tmp/spore-benchmark-base
          cp /tmp/spore-benchmark-base/data/parser-output/spore.json data/parser-output/spore.json
          cp /tmp/spore-benchmark-base/data/drafts/spore.json data/drafts/spore.json
          cp /tmp/spore-benchmark-base/data/game-sources/spore.json data/game-sources/spore.json
          cp /tmp/spore-benchmark-base/data/ratings/spore.json data/ratings/spore.json
      - name: Install GigaChat trusted root certificate
        if: matrix.provider == 'gigachat'
        run: curl -fsSLk https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/russian_trusted_root_ca_pem.crt
      - name: Generate Spore editorial with ${{ matrix.provider }} only
        env:
          EDITORIAL_AI_PROVIDER_ORDER: ${{ matrix.provider }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GIGACHAT_SCOPE: GIGACHAT_API_PERS
        run: |
          if [ "${{ matrix.provider }}" = "gigachat" ]; then
            export NODE_EXTRA_CA_CERTS=/tmp/russian_trusted_root_ca_pem.crt
          fi
          node scripts/benchmark-spore-editorial-provider.mjs "${{ matrix.provider }}"
      - name: Upload ${{ matrix.provider }} result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-editorial-benchmark-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/benchmarks/spore-${{ matrix.provider }}.json
          if-no-files-found: warn
          retention-days: 7
