name: Temporary Japan public localization migration

on:
  push:
    branches:
      - fix/japan-public-localization-2026-08-12
    paths:
      - scripts/migrate-japan-public-localization.mjs
      - .github/workflows/temp-japan-public-localization.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/japan-public-localization-2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact localization migration
        run: node scripts/migrate-japan-public-localization.mjs
      - name: Validate shared game runtime
        run: |
          node --check game/_shared/game-page-v3.js
          node scripts/validate-game-pages.mjs
          git diff --check
      - name: Commit runtime change
        run: |
          set -euo pipefail
          git config user.name "igropoisk-migration[bot]"
          git config user.email "igropoisk-migration[bot]@users.noreply.github.com"
          git add game/_shared/game-page-v3.js
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "Localize Japan Stigmatized Property 3 public game data"
          git push origin HEAD:fix/japan-public-localization-2026-08-12
