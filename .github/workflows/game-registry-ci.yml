name: Game Registry CI
on:
  push:
    branches: ['feat/unified-game-registry-lifecycle']
  pull_request:
    paths:
      - 'scripts/lib/game-registry*.mjs'
      - 'scripts/lib/system-game-registry-adapter.mjs'
      - 'scripts/migrate-game-registry.mjs'
      - 'scripts/canonicalize-system-game-identity.mjs'
      - 'scripts/validate-system-game-registry-integration.mjs'
      - 'scripts/build-game-page-from-registry.mjs'
      - 'scripts/validate-game-registry-pages.mjs'
      - 'scripts/orchestrate-content.mjs'
      - 'scripts/run-content-pipeline.mjs'
      - 'tests/game-registry*.test.mjs'
      - 'tests/system-game-registry-integration.test.mjs'
      - 'data/catalog-visible.json'
      - 'data/popular/current.json'
      - 'data/popular/published.json'
      - 'game/**/index.html'
      - 'index.html'
      - 'assets/site-shell.js'
      - 'assets/what-to-play.js'
      - 'config/game-registry.json'
      - 'admin/games/**'
      - 'docs/game-registry-architecture.md'
      - '.github/workflows/game-registry-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and migration tests
        run: node --test tests/game-registry.test.mjs tests/game-registry-migration.test.mjs tests/system-game-registry-integration.test.mjs
      - name: Verify system integration code
        run: |
          node --check scripts/lib/system-game-registry-adapter.mjs
          node --check scripts/canonicalize-system-game-identity.mjs
          node --check scripts/validate-system-game-registry-integration.mjs
          node --check scripts/build-game-page-from-registry.mjs
          node --check assets/site-shell.js
      - name: Existing safe publisher tests
        run: |
          python3 scripts/test_safe_game_page_builder.py
          node scripts/test-automation-publish-guard.mjs
      - name: All game pages use the shared runtime
        run: node scripts/validate-game-registry-pages.mjs
      - name: Repository migration dry run
        run: node scripts/migrate-game-registry.mjs --root . --write --registry-out /tmp/game-registry.json --report-out /tmp/game-registry-report.json --base-commit "$GITHUB_SHA"
      - name: Verify protected runtime unchanged
        run: git diff --exit-code -- game/_shared
      - name: Verify migration does not modify source catalog
        run: git diff --exit-code -- data/catalog-visible.json data/public data/content-pipeline data/game-content data/drafts data/parser-output content game
      - name: Canonicalize public identity contracts
        run: node scripts/canonicalize-system-game-identity.mjs --write
      - name: System-wide canonical identity gate
        run: node scripts/validate-system-game-registry-integration.mjs
      - name: Verify source-owned catalog projection is committed
        run: git diff --exit-code -- data/catalog-visible.json
      - name: Migration summary
        run: cat /tmp/game-registry-report.json
      - name: Preserve canonicalized snapshots for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-registry-system-projection
          path: |
            data/catalog-visible.json
            data/popular/current.json
            data/popular/published.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-registry-migration-report
          path: /tmp/game-registry-report.json
