name: Build Игропоиск review

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Exact game slug
        required: true
  push:
    branches: [staging]
    paths:
      - 'data/review-build-requests/*.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-staging-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LOCAL_TEXT_MODEL: qwen3:4b
      LOCAL_EDITORIAL_MODEL: qwen3:4b
      LOCAL_WRITER_MODEL: qwen3:0.6b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve requested game slug
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ inputs.slug }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            REQUEST_FILE="$(git diff --name-only "$BEFORE" "$AFTER" -- 'data/review-build-requests/*.json' | tail -n 1)"
            if [ -z "$REQUEST_FILE" ]; then REQUEST_FILE="$(git log -1 --format= --name-only "$AFTER" -- 'data/review-build-requests/*.json' | sed '/^$/d' | tail -n 1)"; fi
            if [ -z "$REQUEST_FILE" ] || [ ! -f "$REQUEST_FILE" ]; then echo "Could not resolve review request from triggering commit $AFTER" >&2; exit 2; fi
            SLUG=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!d.slug)process.exit(2);process.stdout.write(d.slug)" "$REQUEST_FILE")
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Checking editorial review requirement for $SLUG"

      - name: Validate unified commercial review tooling
        run: |
          node --check scripts/sync-review-policy.mjs
          node --check scripts/enforce-commercial-game-media.mjs
          node --check scripts/build-review-article-corpus.mjs
          node --check scripts/build-review-article-corpus-resilient.mjs
          node --check scripts/classify-review-importance.mjs
          node --check scripts/lib/review-importance.mjs
          node --check scripts/run-commercial-review-contract.mjs
          node --check scripts/synthesize-commercial-review-resilient.mjs
          node --check scripts/synthesize-commercial-review-resilient-wrapper.mjs
          node --check scripts/enrich-commercial-review-media-resilient.mjs
          node --check scripts/validate-commercial-review-v2.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/canonicalize-editorial-game-id.mjs
          node --check scripts/publish-game-post-create-overlay.mjs
          node --check scripts/lib/local-editorial-model.mjs
          node scripts/test-review-importance-gate.mjs
          node scripts/test-commercial-review-contract-v2.mjs

      - name: Synchronize legacy policy mirrors from commercial contract
        run: node scripts/sync-review-policy.mjs

      - name: Determine whether the full editorial review is required
        id: importance
        run: node scripts/classify-review-importance.mjs "${{ steps.target.outputs.slug }}"

      - name: Publish review-importance decision
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: review-importance
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Stop cleanly when a full review is not required
        if: steps.importance.outputs.full_upgrade != 'true'
        run: echo 'This game does not meet the editorial full-review gate. No long review will be generated unless force_full_review=true is explicitly recorded.'

      - name: Restore local commercial model cache
        id: ollama_cache
        if: steps.importance.outputs.full_upgrade == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-commercial-local-v2-${{ runner.os }}
          restore-keys: |
            ollama-commercial-local-v2-

      - name: Start local commercial model service
        if: steps.importance.outputs.full_upgrade == 'true'
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          nohup ollama serve >/tmp/ollama-commercial.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama-commercial.log || true
          exit 1

      - name: Ensure required local commercial models
        id: local_models
        if: steps.importance.outputs.full_upgrade == 'true'
        run: |
          set -euo pipefail
          for MODEL in "$LOCAL_TEXT_MODEL" "$LOCAL_WRITER_MODEL"; do
            READY=false
            for attempt in 1 2 3 4 5; do
              if ollama list | grep -Fq "$MODEL"; then READY=true; break; fi
              if ollama pull "$MODEL"; then READY=true; break; fi
              sleep $((attempt * 5))
            done
            if [ "$READY" != true ]; then
              echo "::error::Required local model $MODEL is unavailable in this worker cycle."
              exit 75
            fi
          done

      - name: Save local commercial model cache before generation
        if: steps.importance.outputs.full_upgrade == 'true' && steps.ollama_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-commercial-local-v2-${{ runner.os }}

      - name: Run the one local commercial review contract
        id: commercial
        if: steps.importance.outputs.full_upgrade == 'true'
        continue-on-error: true
        run: node scripts/run-commercial-review-contract.mjs "${{ steps.target.outputs.slug }}"

      - name: Persist retryable review research
        if: steps.importance.outputs.full_upgrade == 'true' && steps.commercial.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: commercial-retry
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Fail after retry state is safely persisted
        if: steps.importance.outputs.full_upgrade == 'true' && steps.commercial.outcome == 'failure'
        run: |
          echo 'Required commercial review is incomplete; persistent needs_search/needs_revision state was written to staging for automatic page-worker continuation.' >&2
          exit 75

      - name: Publish full commercial review through the shared production path
        if: steps.importance.outputs.full_upgrade == 'true' && steps.commercial.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: commercial-review
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Verify commercial review on production Pages
        if: steps.importance.outputs.full_upgrade == 'true' && steps.commercial.outcome == 'success'
        env:
          REVIEW_SMOKE_ATTEMPTS: '48'
          REVIEW_SMOKE_DELAY_MS: '5000'
        run: node scripts/smoke-published-review-pages.mjs "${{ steps.target.outputs.slug }}"
