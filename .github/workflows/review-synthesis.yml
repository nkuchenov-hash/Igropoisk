name: Synthesize Игропоиск review

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Game slug
        required: true

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/synthesize-review.mjs "${{ inputs.slug }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      - name: Commit article
        run: |
          git config user.name "igropoisk-editor"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles data/parser-runs/review-synthesis.json
          git diff --cached --quiet || git commit -m "Synthesize review for ${{ inputs.slug }}"
          git push
