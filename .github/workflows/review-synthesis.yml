name: Build Игропоиск review

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Exact game slug
        required: true
  push:
    branches: [staging]
    paths:
      - 'data/review-build-requests/*.json'

permissions:
  contents: write

concurrency:
  group: review-staging-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve requested game slug
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ inputs.slug }}"
          else
            REQUEST_FILE=$(ls -t data/review-build-requests/*.json | head -n 1)
            SLUG=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!d.slug)process.exit(2);process.stdout.write(d.slug)" "$REQUEST_FILE")
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Building review for $SLUG"
      - name: Validate JavaScript
        run: |
          node --check scripts/sync-review-policy.mjs
          node --check scripts/prepare-review-research.mjs
          node --check scripts/discover-review-media.mjs
          node --check scripts/synthesize-review.mjs
          node --check scripts/enrich-review-media.mjs
          node --check scripts/validate-review-output.mjs
          node --check scripts/render-review-pages.mjs
          node --check article/_shared/review-carousel.js
      - name: Synchronize text, media and layout gates
        run: node scripts/sync-review-policy.mjs
      - name: Discover and validate professional sources
        run: node scripts/prepare-review-research.mjs "${{ steps.target.outputs.slug }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
      - name: Discover a broad screenshot corpus
        run: node scripts/discover-review-media.mjs "${{ steps.target.outputs.slug }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
      - name: Plan, write and audit full article
        run: node scripts/synthesize-review.mjs "${{ steps.target.outputs.slug }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5' }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-5' }}
      - name: Measure, deduplicate and build screenshot carousels
        run: node scripts/enrich-review-media.mjs "${{ steps.target.outputs.slug }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5' }}
      - name: Enforce article depth, dimensions and zero duplicates
        run: node scripts/validate-review-output.mjs "${{ steps.target.outputs.slug }}"
      - name: Render static pages for every published review
        run: node scripts/render-review-pages.mjs
      - name: Commit research, candidates, articles and generated pages to staging
        run: |
          git config user.name "igropoisk-editor[bot]"
          git config user.email "igropoisk-editor[bot]@users.noreply.github.com"
          git add config/parsers/review-synthesis.json data/research data/reviews data/media-candidates data/articles data/article-drafts data/article-media data/parser-runs data/drafts article
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build audited review for ${{ steps.target.outputs.slug }}"
          git pull --rebase origin staging
          git push origin HEAD:staging
