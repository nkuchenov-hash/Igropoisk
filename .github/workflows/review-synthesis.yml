name: Build Игропоиск review

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Exact game slug
        required: true
  push:
    branches: [staging]
    paths:
      - 'data/review-build-requests/*.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-staging-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || vars.OPENAI_MODEL || 'gpt-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve requested game slug
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ inputs.slug }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            REQUEST_FILE="$(git diff --name-only "$BEFORE" "$AFTER" -- 'data/review-build-requests/*.json' | tail -n 1)"
            if [ -z "$REQUEST_FILE" ]; then
              REQUEST_FILE="$(git log -1 --format= --name-only "$AFTER" -- 'data/review-build-requests/*.json' | sed '/^$/d' | tail -n 1)"
            fi
            if [ -z "$REQUEST_FILE" ] || [ ! -f "$REQUEST_FILE" ]; then
              echo "Could not resolve review request from triggering commit $AFTER" >&2
              exit 2
            fi
            SLUG=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!d.slug)process.exit(2);process.stdout.write(d.slug)" "$REQUEST_FILE")
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Building commercial v2 review for $SLUG"
      - name: Validate unified commercial review tooling
        run: |
          node --check scripts/sync-review-policy.mjs
          node --check scripts/enforce-commercial-game-media.mjs
          node --check scripts/build-review-article-corpus.mjs
          node --check scripts/synthesize-commercial-review-openai.mjs
          node --check scripts/enrich-commercial-review-media-openai.mjs
          node --check scripts/validate-commercial-review-v2.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/canonicalize-editorial-game-id.mjs
          node --check article/_shared/review-carousel.js
      - name: Synchronize legacy policy mirrors from commercial contract
        run: node scripts/sync-review-policy.mjs
      - name: Build verified screenshot and artwork pools
        run: node scripts/enforce-commercial-game-media.mjs "${{ steps.target.outputs.slug }}"
      - name: Read full professional reviews and build article corpus
        run: node scripts/build-review-article-corpus.mjs "${{ steps.target.outputs.slug }}"
      - name: Write long dossier-grounded review
        run: node scripts/synthesize-commercial-review-openai.mjs "${{ steps.target.outputs.slug }}"
      - name: Bind article to canonical Game Registry identity
        run: node scripts/canonicalize-editorial-game-id.mjs "${{ steps.target.outputs.slug }}"
      - name: Build mandatory screenshot carousels
        run: node scripts/enrich-commercial-review-media-openai.mjs "${{ steps.target.outputs.slug }}"
      - name: Enforce unified commercial review contract
        run: node scripts/validate-commercial-review-v2.mjs "${{ steps.target.outputs.slug }}"
      - name: Render audited long review
        run: node scripts/render-review-pages.mjs "${{ steps.target.outputs.slug }}"
      - name: Publish audited review through isolated PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.target.outputs.slug }}"
          git add config/parsers/review-synthesis.json config/parsers/review-media-policy.json config/game-page-quality-v2.json data/review-article-corpus data/articles data/article-drafts data/article-media data/parser-runs data/drafts article
          if git diff --cached --quiet; then
            echo "No audited review changes to publish."
            exit 0
          fi
          git diff --cached --check
          branch="automation/review-${slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "igropoisk-editor[bot]"
          git config user.email "igropoisk-editor[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Build commercial v2 review for ${slug}"
          git push origin "$branch"
          pr_url="$(gh pr create --base staging --head "$branch" --title "Commercial review: ${slug}" --body "Built through the same Review Commercial Contract used by Game Creator: full-text professional article corpus, 3000+ word editorial gate, separated artwork/screenshots, 15+ unique screenshots, mandatory carousels, duplicate rejection and final contract validation.")"
          gh pr merge "$pr_url" --merge --delete-branch
