name: Wolfenstein 3D all remote models parallel

on:
  push:
    branches: [benchmark/wolf3d-all-free-models-20260904]
    paths:
      - '.github/workflows/wolf3d-parallel-all-remote.yml'
      - 'scripts/run-wolf3d-one-remote.mjs'
      - 'benchmarks/wolfenstein-3d-1992/source-pack.json'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
          - id: gigachat-3-ultra
            label: GigaChat 3 Ultra
            provider: gigachat
            model: GigaChat-3-Ultra
          - id: gemini-3-8-flash
            label: Gemini 3.8 Flash
            provider: gemini
            model: gemini-3.8-flash
          - id: gemini-3-7-flash
            label: Gemini 3.7 Flash
            provider: gemini
            model: gemini-3.7-flash
          - id: qwen3-8-27b
            label: Qwen 3.8 27B
            provider: groq
            model: qwen/qwen3.8-27b
          - id: qwen3-6-27b
            label: Qwen 3.6 27B
            provider: groq
            model: qwen/qwen3.6-27b
          - id: gpt-oss-120b
            label: GPT-OSS 120B
            provider: groq
            model: openai/gpt-oss-120b
          - id: gpt-oss-20b
            label: GPT-OSS 20B
            provider: groq
            model: openai/gpt-oss-20b
          - id: glm-5-2-free
            label: GLM 5.2 Free
            provider: openrouter
            model: z-ai/glm-5.2:free
          - id: nemotron-3-ultra-free
            label: Nemotron 3 Ultra Free
            provider: openrouter
            model: nvidia/nemotron-3-ultra-550b-a55b:free
          - id: nemotron-3-super-free
            label: Nemotron 3 Super Free
            provider: openrouter
            model: nvidia/nemotron-3-super-120b-a12b:free
          - id: minimax-m2-7-free
            label: MiniMax M2.7 Free
            provider: openrouter
            model: minimax/minimax-m2.7:free
          - id: minimax-m3-free
            label: MiniMax M3 Free
            provider: openrouter
            model: minimax/minimax-m3:free
          - id: dots3-note-free
            label: Dots3-Note Preview Free
            provider: openrouter
            model: dots-studio/dots-3-note-preview:free
          - id: gemma-4-31b-free
            label: Gemma 4 31B Free
            provider: openrouter
            model: google/gemma-4-31b-it:free
          - id: gemma-4-26b-a4b-free
            label: Gemma 4 26B A4B Free
            provider: openrouter
            model: google/gemma-4-26b-a4b-it:free
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate ${{ matrix.label }} independently
        env:
          BENCH_ID: ${{ matrix.id }}
          BENCH_LABEL: ${{ matrix.label }}
          BENCH_PROVIDER: ${{ matrix.provider }}
          BENCH_MODEL: ${{ matrix.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
        run: node scripts/run-wolf3d-one-remote.mjs
      - name: Preserve exact raw model result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf3d-one-${{ matrix.id }}-${{ github.run_id }}
          path: benchmark-one
          if-no-files-found: warn
          retention-days: 14
