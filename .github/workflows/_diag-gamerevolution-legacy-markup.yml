name: Inspect legacy GameRevolution score markup
on:
  push:
    branches: [diag/review-readiness-20260814]
    paths: [.github/workflows/_diag-gamerevolution-legacy-markup.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect two legacy review pages
        run: |
          node - <<'NODE'
          const urls={mgsv:'https://www.gamerevolution.com/review/68894-metal-gear-solid-v-the-phantom-pain-review',ds3:'https://www.gamerevolution.com/review/70185-dark-souls-iii-review'};
          for(const [name,url] of Object.entries(urls)){
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 (compatible; IgropoiskScoreDiagnostic/1.0)'}});const h=await r.text();console.log(`\n=== ${name} ${r.status} ${h.length} ===`);
            for(const rx of [/class=["'][^"']*(?:score|rating|review)[^"']*["'][^>]*>[\s\S]{0,300}/ig,/(?:score|rating|verdict)[^<>]{0,100}[0-9](?:\.[0-9])?/ig,/reviewRating[\s\S]{0,400}/ig]){let n=0;for(const m of h.matchAll(rx)){const i=m.index||0;console.log(h.slice(Math.max(0,i-400),Math.min(h.length,i+900)).replace(/\s+/g,' '));if(++n>=12)break;}}
            for(const m of h.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)){if(/rating|review/i.test(m[1]))console.log('JSONLD',m[1].slice(0,5000).replace(/\s+/g,' '));}
          }
          NODE
