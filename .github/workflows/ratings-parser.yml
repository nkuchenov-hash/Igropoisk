name: Parse critic ratings

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Game slug
        required: true
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug:
          - the-witcher-3-wild-hunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve slug
        id: game
        run: echo "slug=${{ inputs.slug || matrix.slug }}" >> "$GITHUB_OUTPUT"
      - run: node scripts/parse-ratings.mjs "${{ steps.game.outputs.slug }}"
      - name: Commit parser output
        run: |
          git config user.name "igropoisk-parser"
          git config user.email "actions@users.noreply.github.com"
          git add data/ratings data/parser-runs/ratings.json
          git diff --cached --quiet || git commit -m "Parse ratings for ${{ steps.game.outputs.slug }}"
          git push
