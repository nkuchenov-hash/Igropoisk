name: Rerun Fallout 2 review discovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-review-research.mjs'
      - '.github/workflows/rerun-fallout-2-review-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fallout-2-review-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secret
        run: test -n "$OPENAI_API_KEY"
      - name: Run broad Fallout 2 review discovery
        run: node scripts/prepare-review-research.mjs fallout-2
      - name: Commit regenerated review corpus
        run: |
          git config user.name "igropoisk-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reviews/fallout-2.json data/research/fallout-2-source-matrix.json data/parser-runs/review-research-fallout-2.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Fallout 2 review discovery"
          git pull --rebase origin main
          git push origin HEAD:main
