name: News module check

on:
  push:
    branches: [feature/news-content-storage]
  pull_request:
    branches: [staging, main]
    paths:
      - 'features/news/**'
      - 'admin/index.html'
      - 'admin/news-health/**'
      - 'index.html'
      - 'assets/home-page.js'
      - 'assets/home-page.css'
      - 'assets/home-wide-rails.css'
      - 'assets/design-system.css'
      - 'data/news-pipeline-health.json'
      - 'fix.css'
      - 'config/news-pipeline.json'
      - 'scripts/migrate-news-isolation.mjs'
      - 'scripts/smoke-news-browser.mjs'
      - 'scripts/build-news-pipeline-health.mjs'
      - 'scripts/run-news-pipeline.mjs'
      - 'scripts/validate-news-pipeline.mjs'
      - 'scripts/test-news-pipeline.mjs'
      - 'scripts/test-news-pipeline-health.mjs'
      - 'scripts/test-news-content-api.mjs'
      - 'scripts/test-news-storage-content-api.mjs'
      - 'scripts/check-yandex-storage.mjs'
      - 'scripts/lib/yandex-object-storage.mjs'
      - 'scripts/publish-news-storage.mjs'
      - 'scripts/validate-news-module.mjs'
      - 'scripts/validate-news-boundary.mjs'
      - 'scripts/validate-central-design-system.mjs'
      - 'scripts/validate-production-boundaries.mjs'
      - '.github/workflows/news-module-check.yml'
      - '.github/workflows/news-pipeline.yml'
      - '.github/workflows/yandex-storage-connectivity.yml'
      - '.github/workflows/staging-gate-watch.yml'
      - '.github/workflows/news-pipeline-staging.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/update-news.yml'
      - '.github/workflows/update-publisher-news.yml'

permissions:
  contents: read

concurrency:
  group: news-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify news JavaScript syntax
        run: |
          find features/news scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Prove news isolation is fully materialized
        run: |
          node scripts/migrate-news-isolation.mjs
          git diff --exit-code

      - name: Verify news storage content and pipeline contracts
        run: |
          node scripts/test-news-content-api.mjs
          node scripts/test-news-storage-content-api.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/validate-news-pipeline.mjs
          node scripts/validate-production-boundaries.mjs

      - name: Verify news module and central component boundary
        run: |
          node scripts/validate-news-module.mjs
          node scripts/validate-central-design-system.mjs

      - name: Enforce news UI branch scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'news-ui/')
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | node scripts/validate-news-boundary.mjs news-ui

      - name: Enforce news content branch scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'news-content/')
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | node scripts/validate-news-boundary.mjs news-content

      - name: Block new shared-layout regressions
        run: |
          set +e
          head_output="$(python3 scripts/enforce_layout_contract.py --check 2>&1)"
          head_status=$?
          set -e
          if [ "$head_status" -eq 0 ]; then
            printf '%s\n' "$head_output"
            exit 0
          fi

          base_ref="origin/${GITHUB_BASE_REF:-main}"
          git worktree add --detach /tmp/igropoisk-layout-base "$base_ref"
          set +e
          base_output="$(cd /tmp/igropoisk-layout-base && python3 scripts/enforce_layout_contract.py --check 2>&1)"
          base_status=$?
          set -e

          printf '%s\n' "$head_output" | grep '^- ' | sort -u > /tmp/head-layout-errors || true
          printf '%s\n' "$base_output" | grep '^- ' | sort -u > /tmp/base-layout-errors || true
          new_errors="$(comm -23 /tmp/head-layout-errors /tmp/base-layout-errors)"
          git worktree remove --force /tmp/igropoisk-layout-base

          if [ -n "$new_errors" ]; then
            echo "New layout regressions introduced by this change:"
            printf '%s\n' "$new_errors"
            exit 1
          fi

          echo "No new layout regression. Existing base-branch violations are not attributed to the news module."

      - name: Verify base page publication gate
        run: node scripts/validate-game-v3.mjs

      - name: Run news browser smoke test
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
          node scripts/smoke-news-browser.mjs

      - name: Reject malformed patches
        run: git diff --check

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4

      - name: Package news staging snapshot
        uses: actions/upload-artifact@v4
        with:
          name: igropoisk-news-module-${{ github.sha }}
          path: |
            .
            !.git/**
            !.github/**
          if-no-files-found: error
          retention-days: 7
