name: Game page quality

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'game/**/index.html'
      - 'game/_shared/**'
      - 'article/_shared/**'
      - 'article/**/index.html'
      - 'data/articles/**'
      - 'data/drafts/**'
      - 'data/parser-output/**'
      - 'data/article-media/**'
      - 'data/game-media/**'
      - 'data/reviews/**'
      - 'data/ratings/**'
      - 'data/similarity/**'
      - 'data/franchises/**'
      - 'data/guides/**'
      - 'config/game-page-quality-v2.json'
      - 'config/game-media-steam-overrides.json'
      - 'scripts/parse-game-data.mjs'
      - 'scripts/build-game-page.mjs'
      - 'scripts/build-game-page-basic.mjs'
      - 'scripts/materialize-game-shells.mjs'
      - 'scripts/validate-game-shells.mjs'
      - 'scripts/orchestrate-content.mjs'
      - 'scripts/canonicalize-editorial-game-id.mjs'
      - 'scripts/audit-review-publication.mjs'
      - 'scripts/repair-game-media-from-steam.mjs'
      - 'scripts/validate-game-media-quality.mjs'
      - 'scripts/build-similarity-index.mjs'
      - 'scripts/enrich-game-relations.mjs'
      - 'scripts/materialize-catalog-game-data.mjs'
      - 'scripts/run-game-catalog-enrichment.mjs'
      - 'scripts/prepare-guide-research.mjs'
      - 'scripts/prepare-review-research.mjs'
      - 'scripts/calculate-ratings-from-research.mjs'
      - 'scripts/synthesize-review-adaptive.mjs'
      - 'scripts/quality-control-loop.mjs'
      - 'scripts/run-content-pipeline.mjs'
      - 'scripts/materialize-review-publication-feed.mjs'
      - 'scripts/smoke-game-page-browser.mjs'
      - 'scripts/smoke-game-page-quality-v2.mjs'
      - 'scripts/smoke-game-page-visible-data-v3.mjs'
      - 'scripts/smoke-doom-game-page-v4.mjs'
      - 'scripts/smoke-game-runtime.mjs'
      - '.github/workflows/game-page-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser validation dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Verify shared runtime and quality-controller syntax
        run: |
          node --check game/_shared/game-page-v3-bootstrap.js
          node --check game/_shared/game-page.js
          node --check game/_shared/game-page-quality.js
          node --check game/_shared/game-page-similarity.js
          node --check game/_shared/game-page-review-publication-control.js
          node --check game/_shared/game-page-review-sources.js
          node --check game/_shared/game-page-materialized-data.js
          node --check game/_shared/game-media-recovery.js
          node --check article/_shared/review-carousel.js
          node --check article/_shared/review-article.js
          node --check scripts/parse-game-data.mjs
          node --check scripts/build-game-page.mjs
          node --check scripts/build-game-page-basic.mjs
          node --check scripts/materialize-game-shells.mjs
          node --check scripts/validate-game-shells.mjs
          node --check scripts/orchestrate-content.mjs
          node --check scripts/canonicalize-editorial-game-id.mjs
          node --check scripts/audit-review-publication.mjs
          node --check scripts/repair-game-media-from-steam.mjs
          node --check scripts/validate-game-media-quality.mjs
          node --check scripts/build-similarity-index.mjs
          node --check scripts/enrich-game-relations.mjs
          node --check scripts/materialize-catalog-game-data.mjs
          node --check scripts/run-game-catalog-enrichment.mjs
          node --check scripts/prepare-guide-research.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/synthesize-review-adaptive.mjs
          node --check scripts/quality-control-loop.mjs
          node --check scripts/run-content-pipeline.mjs
          node --check scripts/materialize-review-publication-feed.mjs
          node --check scripts/smoke-game-page-browser.mjs
          node --check scripts/smoke-game-page-quality-v2.mjs
          node --check scripts/smoke-game-page-visible-data-v3.mjs
          node --check scripts/smoke-doom-game-page-v4.mjs
          node --check scripts/smoke-game-runtime.mjs
      - name: Exercise canonical catalog materialization
        run: node scripts/materialize-catalog-game-data.mjs
      - name: Exercise verified Steam media repair
        run: node scripts/repair-game-media-from-steam.mjs
      - name: Verify official Russian Steam localization and English fallback
        run: |
          node scripts/parse-game-data.mjs localization-russian-smoke 3495050 '100 Zombie Cats'
          node scripts/parse-game-data.mjs localization-fallback-smoke 4963870 '4am'
          node - <<'NODE'
          const fs=require('fs');
          const ru=JSON.parse(fs.readFileSync('data/parser-output/localization-russian-smoke.json','utf8'));
          const fallback=JSON.parse(fs.readFileSync('data/parser-output/localization-fallback-smoke.json','utf8'));
          if(ru.editorial?.language!=='ru') throw new Error(`Expected official Russian localization, got ${ru.editorial?.language}`);
          if(!/[А-Яа-яЁё]/.test(String(ru.editorial?.short_description||''))) throw new Error('Russian Steam description must contain Cyrillic text');
          if(ru.source?.languages?.canonical!=='english') throw new Error('Canonical structured classification must remain English');
          if(fallback.editorial?.language!=='en-fallback') throw new Error(`Unsupported Russian localization must fall back to English, got ${fallback.editorial?.language}`);
          if(!String(fallback.editorial?.short_description||'').trim()) throw new Error('English fallback description must not be empty');
          console.log('Official Russian Steam localization + English fallback verified.');
          NODE
      - name: Verify source-exhausted official Steam screenshot policy
        run: |
          node scripts/parse-game-data.mjs 4am 4963870 4am
          node scripts/build-game-page-basic.mjs game_a0d66db8a5b2124ca89a
          node scripts/validate-game-media-quality.mjs 4am
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('data/quality-control/game-page-4am.json','utf8'));
          if(report.status!=='green') throw new Error(`4am media QC must be green: ${(report.comments||[]).join(' | ')}`);
          if(report.official_source_exhausted!==true) throw new Error('4am must exercise the source-exhausted policy');
          if(report.nominal_minimum_screenshots!==6||report.minimum_screenshots!==5) throw new Error(`Expected nominal/effective screenshot minimum 6/5, got ${report.nominal_minimum_screenshots}/${report.minimum_screenshots}`);
          if(report.accepted_screenshots!==5) throw new Error(`All five official screenshots must pass, got ${report.accepted_screenshots}`);
          console.log('Source-exhausted Steam screenshot policy verified on 4am.');
          NODE
      - name: Produce media quality diagnoses
        run: node scripts/validate-game-media-quality.mjs
      - name: Rebuild similarity reasons for the full catalog
        run: node scripts/build-similarity-index.mjs
      - name: Require canonical Game Page shell for the full visible catalog
        run: node scripts/validate-game-shells.mjs
      - name: Verify target game pages and review rendering in browser
        run: node scripts/smoke-game-page-browser.mjs
      - name: Verify global Game Page quality rules on BG3 control example
        run: node scripts/smoke-game-page-quality-v2.mjs
      - name: Verify visible BG3 requirements, rating removal and similarity
        run: node scripts/smoke-game-page-visible-data-v3.mjs
      - name: Verify DOOM migrated shell and visible content contract
        run: node scripts/smoke-doom-game-page-v4.mjs
      - name: Preserve BG3 acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg3-game-page-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/quality-control/bg3-smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify GTA VI release and media contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const gta=JSON.parse(fs.readFileSync('data/drafts/grand-theft-auto-vi.json','utf8'));
          if(gta.release?.status!=='upcoming') throw new Error('GTA VI must be marked upcoming');
          if(gta.release?.date!=='2026-11-19') throw new Error('GTA VI release date must be 2026-11-19');
          if(gta.ratings?.igropoisk!==null&&gta.ratings?.igropoisk!==undefined) throw new Error('GTA VI must not have an editorial rating before release');
          if((gta.media?.screenshots||[]).length<10) throw new Error('GTA VI needs a substantial official screenshot set');
          if((gta.media?.artwork||[]).length<2) throw new Error('GTA VI needs official artwork');
          for(const item of gta.media?.screenshots||[]){
            if(!String(item.url||'').includes('rockstargames.com/VI/')) throw new Error(`Non-official GTA VI screenshot: ${item.url}`);
            if(!String(item.source_url||'').startsWith('https://www.rockstargames.com/VI/')) throw new Error(`Non-official GTA VI source: ${item.source_url}`);
          }
          console.log('GTA VI upcoming/media contract verified.');
          NODE
