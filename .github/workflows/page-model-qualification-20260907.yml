name: Page Model Qualification v4 — serial exact-route final

on:
  push:
    branches: [benchmark/page-review-qualification-20260907]
    paths:
      - '.github/workflows/page-model-qualification-20260907.yml'
  workflow_dispatch:

concurrency:
  group: editorial-openrouter-serial-final
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_NO_WARNINGS: '1'

jobs:
  model:
    name: ${{ matrix.game.title }} — ${{ matrix.candidate.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game:
          - { slug: dangerous-dave-in-the-haunted-mansion, title: 'Dangerous Dave in the Haunted Mansion', year: '1991' }
          - { slug: far-cry, title: 'Far Cry', year: '2004' }
          - { slug: jack-orlando-a-cinematic-adventure-1997, title: 'Jack Orlando: A Cinematic Adventure', year: '1997' }
          - { slug: mafia, title: 'Mafia: The City of Lost Heaven', year: '2002' }
          - { slug: mass-effect-2007, title: 'Mass Effect', year: '2007' }
          - { slug: wolfenstein-3d, title: 'Wolfenstein 3D', year: '1992' }
          - { slug: spore, title: 'Spore', year: '2008' }
        candidate:
          - { id: qwen3-8-27b, label: 'Qwen 3.8 27B', model: 'qwen/qwen3.8-27b' }
          - { id: qwen3-6-27b, label: 'Qwen 3.6 27B', model: 'qwen/qwen3.6-27b' }
          - { id: gpt-oss-120b, label: 'GPT-OSS 120B', model: 'openai/gpt-oss-120b' }
          - { id: gpt-oss-20b, label: 'GPT-OSS 20B', model: 'openai/gpt-oss-20b' }
          - { id: glm-5-2, label: 'GLM 5.2', model: 'z-ai/glm-5.2' }
          - { id: nemotron-3-ultra, label: 'Nemotron 3 Ultra', model: 'nvidia/nemotron-3-ultra-550b-a55b' }
          - { id: nemotron-3-super, label: 'Nemotron 3 Super', model: 'nvidia/nemotron-3-super-120b-a12b' }
          - { id: minimax-m2-7, label: 'MiniMax M2.7', model: 'minimax/minimax-m2.7' }
          - { id: minimax-m3, label: 'MiniMax M3', model: 'minimax/minimax-m3' }
          - { id: dots3-note, label: 'Dots3-Note Preview', model: 'dots-studio/dots-3-note-preview' }
          - { id: gemma-4-31b, label: 'Gemma 4 31B', model: 'google/gemma-4-31b-it' }
          - { id: gemma-4-26b-a4b, label: 'Gemma 4 26B A4B', model: 'google/gemma-4-26b-a4b-it' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Download frozen full evidence
        uses: actions/download-artifact@v4
        with:
          name: page-evidence-${{ matrix.game.slug }}
          path: benchmark-evidence/${{ matrix.game.slug }}
          github-token: ${{ github.token }}
          repository: nkuchenov-hash/Igropoisk
          run-id: '34121244832'
      - name: Generate complete Page editorial bundle serially
        env:
          BENCH_GAME: ${{ matrix.game.slug }}
          BENCH_TITLE: ${{ matrix.game.title }}
          BENCH_YEAR: ${{ matrix.game.year }}
          BENCH_ATTEMPT: '4'
          BENCH_ID: ${{ matrix.candidate.id }}
          BENCH_LABEL: ${{ matrix.candidate.label }}
          BENCH_PROVIDER: openrouter
          BENCH_MODEL: ${{ matrix.candidate.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: node scripts/run-page-model-qualification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-v4-${{ matrix.game.slug }}-${{ matrix.candidate.id }}
          path: benchmark-page-one
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Serial Page qualification summary
    needs: model
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: page-v4-*
          path: page-artifacts
          merge-multiple: false
      - name: Build summary
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');const rows=[];for(const d of fs.readdirSync('page-artifacts')){const f=path.join('page-artifacts',d,'result.json');if(fs.existsSync(f))rows.push(JSON.parse(fs.readFileSync(f,'utf8')))}const by={};for(const r of rows){const x=by[r.label]??={model:r.label,total:0,ok:0,structural_pass:0,errors:0,unavailable:0,games:[]};x.total++;if(r.status==='ok')x.ok++;if(r.structural_contract_ok)x.structural_pass++;if(r.status==='error')x.errors++;if(r.status==='unavailable')x.unavailable++;x.games.push({game:r.game_slug,status:r.status,contract:r.structural_contract_ok,subtitle:r.subtitle,description:r.description,features:r.features,error:r.error,evidence_sha256:r.evidence_sha256})}const models=Object.values(by).sort((a,b)=>b.structural_pass-a.structural_pass||b.ok-a.ok||a.model.localeCompare(b.model));fs.mkdirSync('page-summary',{recursive:true});fs.writeFileSync('page-summary/results.json',JSON.stringify(rows,null,2)+'\n');fs.writeFileSync('page-summary/by-model.json',JSON.stringify(models,null,2)+'\n');const md=['# Page Model Qualification v4 — serial exact routes','',`Outputs: ${rows.length}/84`,'','| Model | Outputs | OK | Structural pass | Errors | Unavailable |','|---|---:|---:|---:|---:|---:|'];for(const m of models)md.push(`| ${m.model} | ${m.total} | ${m.ok} | ${m.structural_pass} | ${m.errors} | ${m.unavailable} |`);fs.writeFileSync('page-summary/SUMMARY.md',md.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: page-model-qualification-v4-summary
          path: page-summary
          if-no-files-found: error
          retention-days: 14
