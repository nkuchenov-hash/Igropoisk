name: Patch OpenCritic review discovery
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-opencritic-discovery.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch OpenCritic game lookup with sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-complete-review-github-models-v2.mjs')
          s=p.read_text()
          old="""  let gamePath=[...new Set(paths)][0];\n  if(!gamePath){\n    for(const q of [`site:opencritic.com/game \\\"${title}\\\" OpenCritic`,`site:opencritic.com/game/${year||''} \\\"${title}\\\"`]){\n      const rows=await bing(q);\n      const hit=rows.find(x=>{try{return new URL(x.url).hostname.endsWith('opencritic.com')&&/\\/game\\/\\d+\\//.test(new URL(x.url).pathname)}catch{return false}});\n      if(hit){try{gamePath=new URL(hit.url).pathname.replace(/\\/reviews\\/?$/,'');break}catch{}}\n    }\n  }\n  if(!gamePath)return[];\n"""
          new="""  let gamePath=[...new Set(paths)][0];\n  if(!gamePath){\n    const sitemap=await fetchText('https://opencritic.com/sitemap.xml',25000);\n    if(sitemap){\n      const words=normalized.split(' ').filter(w=>w.length>3);\n      const gameUrls=[...sitemap.text.matchAll(/<loc>(https?:\\/\\/opencritic\\.com\\/game\\/\\d+\\/[^<]+)<\\/loc>/gi)].map(m=>decode(m[1]));\n      const ranked=gameUrls.map(u=>{const low=u.toLowerCase().replace(/[-_]+/g,' ');return{u,score:words.reduce((n,w)=>n+(low.includes(w)?1:0),0)}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);\n      if(ranked[0]&&ranked[0].score>=Math.min(2,Math.max(1,words.length)))try{gamePath=new URL(ranked[0].u).pathname}catch{}\n    }\n  }\n  if(!gamePath){\n    for(const q of [`site:opencritic.com/game \\\"${title}\\\" OpenCritic`,`site:opencritic.com/game \\\"${title}\\\" reviews`]){\n      const rows=await bing(q);\n      const hit=rows.find(x=>{try{return new URL(x.url).hostname.endsWith('opencritic.com')&&/\\/game\\/\\d+\\//.test(new URL(x.url).pathname)}catch{return false}});\n      if(hit){try{gamePath=new URL(hit.url).pathname.replace(/\\/reviews\\/?$/,'');break}catch{}}\n    }\n  }\n  if(!gamePath)return[];\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/build-complete-review-github-models-v2.mjs
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build-complete-review-github-models-v2.mjs
          git commit -m "Resolve OpenCritic games through sitemap"
          git pull --rebase origin staging
          git push origin HEAD:staging
