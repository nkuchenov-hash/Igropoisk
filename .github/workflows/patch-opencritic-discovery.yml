name: Patch OpenCritic review discovery
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-opencritic-discovery.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch OpenCritic game lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-complete-review-github-models-v2.mjs')
          s=p.read_text()
          old="""  const gamePath=[...new Set(paths)][0];\n  if(!gamePath)return[];\n"""
          new="""  let gamePath=[...new Set(paths)][0];\n  if(!gamePath){\n    for(const q of [`site:opencritic.com/game \\\"${title}\\\" OpenCritic`,`site:opencritic.com/game/${year||''} \\\"${title}\\\"`]){\n      const rows=await bing(q);\n      const hit=rows.find(x=>{try{return new URL(x.url).hostname.endsWith('opencritic.com')&&/\\/game\\/\\d+\\//.test(new URL(x.url).pathname)}catch{return false}});\n      if(hit){try{gamePath=new URL(hit.url).pathname.replace(/\\/reviews\\/?$/,'');break}catch{}}\n    }\n  }\n  if(!gamePath)return[];\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/build-complete-review-github-models-v2.mjs
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build-complete-review-github-models-v2.mjs
          git commit -m "Find OpenCritic game pages through search fallback"
          git pull --rebase origin staging
          git push origin HEAD:staging
