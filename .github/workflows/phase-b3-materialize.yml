name: Phase B3 materialize

on:
  push:
    branches: [phase-b3-news-content-api]

permissions:
  contents: write

concurrency:
  group: phase-b3-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b3-news-content-api
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize News Content API wiring
        run: node scripts/migrate-news-isolation.mjs
      - name: Commit materialized source when needed
        run: |
          if git diff --quiet; then
            echo "Source already materialized."
            exit 0
          fi
          git config user.name "igropoisk-content-api-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "B3: materialize News Content API wiring"
          git push origin HEAD:phase-b3-news-content-api
