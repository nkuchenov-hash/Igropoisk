name: Build complete game pages autonomously

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Optional single game slug; blank builds incomplete catalog games
        required: false
        type: string
      limit:
        description: Optional maximum games in this run
        required: false
        default: "0"
        type: string
  push:
    branches: [staging]
    paths:
      - .github/workflows/build-complete-reviews-github-models.yml

permissions:
  contents: write
  models: read

concurrency:
  group: complete-game-pages-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure builder identity
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
      - name: Build every incomplete filled game page and review
        env:
          REQUESTED_SLUG: ${{ inputs.slug || '' }}
          REQUESTED_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          node - <<'NODE' > /tmp/queue.txt
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          const requested=(process.env.REQUESTED_SLUG||'').trim();
          const limit=Number(process.env.REQUESTED_LIMIT||0);
          let queue=catalog.filter(g=>g.slug!=='mafia');
          if(requested) queue=queue.filter(g=>g.slug===requested);
          else queue=queue.filter(g=>!fs.existsSync(`article/${g.slug}/index.html`));
          if(limit>0) queue=queue.slice(0,limit);
          process.stdout.write(queue.map(g=>g.slug).join('\n')+(queue.length?'\n':''));
          NODE
          echo "Queued $(wc -l < /tmp/queue.txt) games"
          : > /tmp/complete-results.tsv
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "=== COMPLETE BUILD: $slug ==="
            if node scripts/build-complete-review-github-models-v2.mjs "$slug"; then
              node - "$slug" <<'NODE'
          const fs=require('fs');
          const slug=process.argv[2];
          for(const file of [`data/article-media/${slug}.json`,`data/articles/${slug}.json`,`data/reviews/${slug}.json`]){
            if(!fs.existsSync(file)) continue;
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            const walk=v=>{
              if(Array.isArray(v)){
                const seen=new Set();
                return v.map(walk).filter(x=>{
                  if(!x||typeof x!=='object'||!x.duplicate_group)return true;
                  if(seen.has(x.duplicate_group))return false;
                  seen.add(x.duplicate_group);return true;
                });
              }
              if(v&&typeof v==='object')for(const k of Object.keys(v))v[k]=walk(v[k]);
              return v;
            };
            fs.writeFileSync(file,JSON.stringify(walk(data),null,2)+'\n');
          }
          NODE
              if node scripts/validate-review-output.mjs "$slug" && node scripts/render-review-pages.mjs "$slug"; then
                printf '%s\tsuccess\n' "$slug" >> /tmp/complete-results.tsv
                git add data "article/$slug" "game/$slug" scripts
                git commit -m "Build complete Mafia-standard review for $slug" || true
                git pull --rebase origin staging
                git push origin HEAD:staging
              else
                printf '%s\tblocked\n' "$slug" >> /tmp/complete-results.tsv
                git reset --hard HEAD
              fi
            else
              printf '%s\tblocked\n' "$slug" >> /tmp/complete-results.tsv
              git reset --hard HEAD
            fi
          done < /tmp/queue.txt
          cat /tmp/complete-results.tsv
      - name: Rebuild catalog pages and report coverage
        if: always()
        run: |
          node scripts/materialize-catalog-no-api.mjs
          node scripts/canonicalize-all-editorial-game-ids.mjs --write || true
          node - <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          const complete=catalog.filter(g=>fs.existsSync(`game/${g.slug}/index.html`)&&fs.existsSync(`data/articles/${g.slug}.json`)&&fs.existsSync(`article/${g.slug}/index.html`));
          const completeSlugs=new Set(complete.map(g=>g.slug));
          const missing=catalog.filter(g=>!completeSlugs.has(g.slug)).map(g=>g.slug);
          const report={generated_at:new Date().toISOString(),total:catalog.length,complete:complete.length,missing};
          console.log(JSON.stringify(report,null,2));
          fs.mkdirSync('data/parser-runs',{recursive:true});
          fs.writeFileSync('data/parser-runs/complete-game-pages-latest.json',JSON.stringify(report,null,2)+'\n');
          NODE
          git add data game article
          git diff --cached --quiet || git commit -m "Materialize complete catalog pages and coverage"
          git pull --rebase origin staging
          git push origin HEAD:staging
