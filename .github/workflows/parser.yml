name: Collect and validate game pages

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of seed games to process
        required: false
        default: "50"
      only:
        description: Exact game title (optional)
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * 1,4"

permissions:
  contents: write

concurrency:
  group: igropoisk-parser
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - name: Install parser dependencies
        run: pip install -r parser/requirements.txt
      - name: Run collector
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            python parser/collect.py --limit "$LIMIT" --only "$ONLY"
          else
            python parser/collect.py --limit "$LIMIT"
          fi
      - name: Validate public dataset
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('data/public/games.json')
          rows = json.loads(p.read_text(encoding='utf-8')) if p.exists() else []
          bad = [g for g in rows if not g.get('publication', {}).get('gate_passed')]
          if bad:
              print('Public dataset contains records that failed gate', file=sys.stderr)
              sys.exit(1)
          print(f'Public records: {len(rows)}')
          PY
      - name: Commit parser output
        run: |
          git config user.name "igropoisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update parsed game data"
            git push
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: parser-report
          path: data/parser-report.json
          if-no-files-found: error
