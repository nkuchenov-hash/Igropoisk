name: Collect, validate and build 50 game pages

on:
  push:
    branches: [main]
    paths:
      - "parser/**"
      - ".github/workflows/parser.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1,4"

permissions:
  contents: write

concurrency:
  group: igropoisk-full-parser
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - name: Install dependencies
        run: pip install -r parser/requirements.txt
      - name: Parse all 50 games
        env:
          PYTHONUNBUFFERED: "1"
        run: python parser/collect_v2.py --limit 50
      - name: Build all publishable pages
        run: python parser/build_pages.py
      - name: Validate generated output
        run: |
          python - <<'PY'
          import json, pathlib, sys
          public = pathlib.Path('data/public/games.json')
          rows = json.loads(public.read_text(encoding='utf-8')) if public.exists() else []
          bad = [g for g in rows if not g.get('publication', {}).get('gate_passed')]
          if bad:
              raise SystemExit('Public dataset contains records that failed gate')
          for game in rows:
              slug = game['identity']['slug']
              page = pathlib.Path('game') / slug / 'index.html'
              if not page.exists():
                  raise SystemExit(f'Missing generated page: {page}')
          print(f'Generated and validated {len(rows)} public pages')
          PY
      - name: Commit parsed data and pages
        run: |
          git config user.name "igropoisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ game/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish parsed pages for 50-game run"
            git push
          fi
      - name: Upload parser report
        uses: actions/upload-artifact@v4
        with:
          name: parser-report-50-games
          path: data/parser-report.json
          if-no-files-found: error
