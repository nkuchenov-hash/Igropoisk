name: Parse and build 50 game pages separately

on:
  push:
    branches: [staging]
    paths:
      - "parser/**"
      - "scripts/validate-automation-publish-diff.mjs"
      - ".github/workflows/parser.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1,4"

permissions:
  contents: write

concurrency:
  group: igropoisk-50-separate-pages-staging
  cancel-in-progress: false

jobs:
  parse-one-game:
    name: Parse ${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        game:
          - "The Witcher 3: Wild Hunt"
          - "Bloodborne"
          - "Metal Gear Solid V: The Phantom Pain"
          - "Fallout 4"
          - "Undertale"
          - "Tom Clancy's Rainbow Six Siege"
          - "Dark Souls III"
          - "Overwatch"
          - "DOOM"
          - "Titanfall 2"
          - "Sid Meier's Civilization VI"
          - "Stardew Valley"
          - "The Legend of Zelda: Breath of the Wild"
          - "Horizon Zero Dawn"
          - "NieR: Automata"
          - "Resident Evil 7 Biohazard"
          - "Divinity: Original Sin 2"
          - "Hollow Knight"
          - "God of War"
          - "Red Dead Redemption 2"
          - "Marvel's Spider-Man"
          - "Monster Hunter: World"
          - "Kingdom Come: Deliverance"
          - "Celeste"
          - "Sekiro: Shadows Die Twice"
          - "Death Stranding"
          - "Control"
          - "Disco Elysium"
          - "Resident Evil 2"
          - "Outer Wilds"
          - "Cyberpunk 2077"
          - "The Last of Us Part II"
          - "Ghost of Tsushima"
          - "Hades"
          - "Mount & Blade II: Bannerlord"
          - "Half-Life: Alyx"
          - "It Takes Two"
          - "Forza Horizon 5"
          - "Resident Evil Village"
          - "Deathloop"
          - "Elden Ring"
          - "God of War Ragnarok"
          - "Horizon Forbidden West"
          - "Stray"
          - "Baldur's Gate 3"
          - "Alan Wake 2"
          - "Hogwarts Legacy"
          - "Marvel's Spider-Man 2"
          - "Helldivers 2"
          - "Black Myth: Wukong"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - name: Install dependencies
        run: pip install -r parser/requirements.txt
      - name: Parse exactly one game
        env:
          PYTHONUNBUFFERED: "1"
        run: python parser/collect_v2.py --limit 1 --only "${{ matrix.game }}"
      - name: Create safe artifact name
        id: artifact
        shell: python
        run: |
          import os, re
          name = re.sub(r'[^a-z0-9]+', '-', "${{ matrix.game }}".lower()).strip('-')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'name={name}\n')
      - name: Upload this game's parser data
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ steps.artifact.outputs.name }}
          path: data/
          if-no-files-found: error
          retention-days: 3

  merge-and-publish:
    name: Merge 50 results into staging
    needs: parse-one-game
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all per-game results
        uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: parsed-results
      - name: Merge only newly passed games; preserve current publications
        run: |
          python - <<'PY'
          import json, pathlib, shutil

          root = pathlib.Path('parsed-results')
          public_path = pathlib.Path('data/public/games.json')
          try:
              current = json.loads(public_path.read_text(encoding='utf-8'))
              if not isinstance(current, list):
                  raise ValueError('current public games must be an array')
          except FileNotFoundError:
              current = []

          public_by_slug = {}
          order = []
          for game in current:
              slug = game.get('identity', {}).get('slug')
              if not slug or not game.get('publication', {}).get('gate_passed'):
                  continue
              if slug not in public_by_slug:
                  order.append(slug)
              public_by_slug[slug] = game

          newly_published = []
          drafts_out = pathlib.Path('data/drafts')
          drafts_out.mkdir(parents=True, exist_ok=True)
          reports = []

          for path in root.rglob('games.json'):
              try:
                  rows = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if not isinstance(rows, list):
                  continue
              for game in rows:
                  if not game.get('publication', {}).get('gate_passed'):
                      continue
                  slug = game.get('identity', {}).get('slug')
                  if not slug:
                      continue
                  if slug not in public_by_slug:
                      order.append(slug)
                  public_by_slug[slug] = game
                  newly_published.append(slug)

          for path in root.rglob('drafts/*.json'):
              shutil.copy2(path, drafts_out / path.name)

          for path in root.rglob('parser-report.json'):
              try:
                  reports.append(json.loads(path.read_text(encoding='utf-8')))
              except Exception:
                  pass

          public = [public_by_slug[slug] for slug in order]
          public_path.parent.mkdir(parents=True, exist_ok=True)
          public_path.write_text(
              json.dumps(public, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          pathlib.Path('data/parser-report-50.json').write_text(
              json.dumps(
                  {
                      'runs': reports,
                      'published_now': len(set(newly_published)),
                      'published_total': len(public),
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding='utf-8',
          )
          print(
              f'Accepted {len(set(newly_published))} newly publishable games; '
              f'preserved total={len(public)}'
          )
          PY
      - name: Upsert passed pages without deleting existing game files
        run: python parser/build_pages_safe.py
      - name: Verify current public pages and protected runtime
        run: |
          python - <<'PY'
          import json, pathlib

          shared = pathlib.Path('game/_shared')
          if not shared.is_dir():
              raise SystemExit('Protected game/_shared runtime is missing')

          rows = json.loads(pathlib.Path('data/public/games.json').read_text(encoding='utf-8'))
          for game in rows:
              if not game.get('publication', {}).get('gate_passed'):
                  continue
              slug = game['identity']['slug']
              page = pathlib.Path('game') / slug / 'index.html'
              if not page.exists():
                  raise SystemExit(f'Missing page: {page}')
          print(f'Verified {len(rows)} retained or generated public game records')
          PY
      - name: Stage and validate the isolated publisher diff
        run: |
          git add -- data/public/games.json data/public/catalog.json data/parser-report-50.json data/drafts game
          node scripts/validate-automation-publish-diff.mjs --profile parser-50
      - name: Commit safe merged data and generated pages to staging
        run: |
          git config user.name "igropoisk-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Safely upsert pages from 50 parser runs on staging"
          git pull --rebase origin staging
          git push origin HEAD:staging
