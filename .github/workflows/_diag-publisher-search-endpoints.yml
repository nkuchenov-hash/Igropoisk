name: Probe direct publisher search
on:
  push:
    branches: [diag/review-readiness-20260814]
    paths: [.github/workflows/_diag-publisher-search-endpoints.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe publisher-native search endpoints
        run: |
          node - <<'NODE'
          const tests=[
            ['pcgamer','Metal Gear Solid 5','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['pcgamer','Dark Souls 3','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['pcgamer','Red Dead Redemption 2','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['pcgamer','Half-Life Alyx','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['pcgamer','Deathloop','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['pcgamer','Alan Wake 2','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['pcgamer','Ghost Recon Wildlands','https://www.pcgamer.com/search/?searchTerm={q}'],
            ['gamesradar','Red Dead Redemption 2','https://www.gamesradar.com/search/?searchTerm={q}'],
            ['gamesradar','Alan Wake 2','https://www.gamesradar.com/search/?searchTerm={q}'],
            ['shacknews','Deathloop','https://www.shacknews.com/search?q={q}'],
            ['shacknews','Alan Wake 2','https://www.shacknews.com/search?q={q}']
          ];
          const decode=s=>String(s||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'");
          const text=s=>decode(String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());
          for(const [source,title,tpl] of tests){
            const url=tpl.replace('{q}',encodeURIComponent(title));
            try{
              const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 (compatible; IgropoiskSearchProbe/1.0)','accept-language':'en-US,en;q=.9'}});const h=await r.text(),links=[];
              for(const m of h.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)){let u=decode(m[1]);try{u=new URL(u,r.url).href}catch{continue}const label=text(m[2]);if(!/^https?:/i.test(u))continue;if(!links.some(x=>x.url===u)&&(/review/i.test(u+' '+label)||label.toLowerCase().includes(title.toLowerCase().split(' ')[0])))links.push({url:u,title:label.slice(0,180)});}
              console.log(JSON.stringify({source,title,http:r.status,final:r.url,bytes:h.length,links:links.slice(0,12)}));
            }catch(e){console.log(JSON.stringify({source,title,error:e.message}))}
          }
          NODE
