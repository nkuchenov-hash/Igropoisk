name: Fix GTA VI popular ranking

on:
  push:
    branches:
      - fix-gta6-popular-ranking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gta6-popular-ranking
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply isolated GTA VI ranking fix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('config/parsers/popular.json')
          config = json.loads(config_path.read_text())
          config['schema_version'] = max(4, int(config.get('schema_version', 0)))

          gta6 = {
              'slug': 'grand-theft-auto-vi',
              'title': 'Grand Theft Auto VI',
              'year': 2026,
              'upcoming': True,
              'aliases': ['Grand Theft Auto 6', 'GTA VI', 'GTA 6']
          }
          globals_ = [row for row in config.get('global_candidates', []) if row.get('slug') != gta6['slug']]
          globals_.append(gta6)
          config['global_candidates'] = globals_

          aliases = []
          for row in config.get('aliases', []):
              if row.get('slug') == 'grand-theft-auto-vi':
                  continue
              if row.get('slug') == 'grand-theft-auto-v':
                  row = dict(row)
                  row['aliases'] = [value for value in row.get('aliases', []) if value != 'GTA Online']
              aliases.append(row)
          config['aliases'] = aliases
          config['disambiguation'] = [
              {
                  'prefer_slug': 'grand-theft-auto-vi',
                  'prefer_aliases': ['Grand Theft Auto VI', 'Grand Theft Auto 6', 'GTA VI', 'GTA 6'],
                  'reason': 'A numbered sequel mention must outrank GTA V or GTA Online aliases in the same title.'
              }
          ]
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')

          override_path = Path('data/popular/cover-overrides.json')
          overrides = json.loads(override_path.read_text())
          overrides['grand-theft-auto-vi'] = [
              'https://www.rockstargames.com/VI/_next/static/media/GTAVI_FOB_UltimateEdition_Mobile_en_us.0p-teflcejj77.jpg?akim=1&imdensity=1&imwidth=3840',
              'https://www.rockstargames.com/VI/_next/static/media/Official_Cover_Art_landscape.12.uu2irr.2_a.jpg?akim=1&imdensity=1&imwidth=3840'
          ]
          override_path.write_text(json.dumps(overrides, ensure_ascii=False, indent=2) + '\n')

          parser_path = Path('scripts/parse-popular.mjs')
          parser = parser_path.read_text()
          old = """function resolve(title) {\n  const normalized = canonical(title);\n  const exact = byTitle.get(normalized);\n  if (exact) return exact;\n  const value = ` ${normalized} `;\n"""
          new = """function resolve(title) {\n  const normalized = canonical(title);\n  const value = ` ${normalized} `;\n  for (const rule of config.disambiguation || []) {\n    const matched = (rule.prefer_aliases || [])\n      .map(canonical)\n      .filter(Boolean)\n      .some(alias => value.includes(` ${alias} `));\n    if (matched) {\n      const preferred = bySlug.get(rule.prefer_slug);\n      if (preferred) return preferred;\n    }\n  }\n  const exact = byTitle.get(normalized);\n  if (exact) return exact;\n"""
          if old not in parser:
              raise SystemExit('parse-popular resolve block not found')
          parser_path.write_text(parser.replace(old, new, 1))

          curator_path = Path('scripts/curate-home-feeds.mjs')
          curator = curator_path.read_text()
          old_tier = """  const tier = !verifiedCover\n    ? null\n    : confirmed\n      ? 'confirmed'\n      : communityDominant\n        ? 'community_dominant'\n        : platformCorroborated\n          ? 'platform_corroborated'\n          : currentPlatformChart\n            ? 'platform_chart'\n            : null;\n  const selectionReason = tier === 'confirmed'\n"""
          new_tier = """  const relevanceTier = confirmed\n    ? 'confirmed'\n    : communityDominant\n      ? 'community_dominant'\n      : platformCorroborated\n        ? 'platform_corroborated'\n        : currentPlatformChart\n          ? 'platform_chart'\n          : null;\n  const presentationReady = Boolean(item.image || (item.image_candidates || []).length);\n  const tier = relevanceTier && presentationReady ? relevanceTier : null;\n  const selectionReason = relevanceTier === 'confirmed'\n"""
          if old_tier not in curator:
              raise SystemExit('curator tier block not found')
          curator = curator.replace(old_tier, new_tier, 1)
          curator = curator.replace("    : tier === 'community_dominant'", "    : relevanceTier === 'community_dominant'", 1)
          curator = curator.replace("      : tier === 'platform_corroborated'", "      : relevanceTier === 'platform_corroborated'", 1)
          curator = curator.replace("        : tier === 'platform_chart'", "        : relevanceTier === 'platform_chart'", 1)

          old_reasons = """  const reasons = [];\n  if (!verifiedCover) reasons.push('missing_verified_cover');\n  if (!tier) {\n    if (!confirmedByNews) reasons.push(`news_publishers_below_${Number(confirmedRules.minimum_news_publishers || 3)}`);\n    if (!confirmedByBreadth) reasons.push('insufficient_independent_families');\n    if (!communityDominant) reasons.push('community_signal_below_threshold');\n    if (!Number.isFinite(steamPosition) && !Number.isFinite(twitchPosition)) reasons.push('not_in_current_platform_chart');\n    if (confidence < Number(platformRules.minimum_confidence || 0)) reasons.push('low_confidence');\n    if (score < Number(platformRules.minimum_score || 0)) reasons.push('low_score');\n  }\n"""
          new_reasons = """  const reasons = [];\n  if (!verifiedCover) reasons.push('unverified_cover_fallback');\n  if (!presentationReady) reasons.push('missing_cover_candidate');\n  if (!relevanceTier) {\n    if (!confirmedByNews) reasons.push(`news_publishers_below_${Number(confirmedRules.minimum_news_publishers || 3)}`);\n    if (!confirmedByBreadth) reasons.push('insufficient_independent_families');\n    if (!communityDominant) reasons.push('community_signal_below_threshold');\n    if (!Number.isFinite(steamPosition) && !Number.isFinite(twitchPosition)) reasons.push('not_in_current_platform_chart');\n    if (confidence < Number(platformRules.minimum_confidence || 0)) reasons.push('low_confidence');\n    if (score < Number(platformRules.minimum_score || 0)) reasons.push('low_score');\n  } else if (!presentationReady) {\n    reasons.push('relevant_but_not_renderable');\n  }\n"""
          if old_reasons not in curator:
              raise SystemExit('curator reasons block not found')
          curator = curator.replace(old_reasons, new_reasons, 1)
          old_audit = """    eligible: Boolean(tier),\n    tier,\n"""
          new_audit = """    eligible: Boolean(relevanceTier),\n    publishable: Boolean(tier),\n    tier: relevanceTier,\n"""
          if old_audit not in curator:
              raise SystemExit('curator audit block not found')
          curator = curator.replace(old_audit, new_audit, 1)
          curator_path.write_text(curator)

          schedule_path = Path('config/parsers/schedule.json')
          schedule = json.loads(schedule_path.read_text())
          for parser_row in schedule.get('parsers', []):
              if parser_row.get('id') == 'popular':
                  command = parser_row['command']
                  test = 'node scripts/test-gta6-popular-rules.mjs && '
                  if not command.startswith(test):
                      parser_row['command'] = test + command
          schedule_path.write_text(json.dumps(schedule, ensure_ascii=False, indent=2) + '\n')

          test_path = Path('scripts/test-gta6-popular-rules.mjs')
          test_path.write_text("""import fs from 'node:fs';\n\nconst read = file => JSON.parse(fs.readFileSync(file, 'utf8'));\nconst config = read('config/parsers/popular.json');\nconst overrides = read('data/popular/cover-overrides.json');\nconst parser = fs.readFileSync('scripts/parse-popular.mjs', 'utf8');\nconst curator = fs.readFileSync('scripts/curate-home-feeds.mjs', 'utf8');\n\nconst gta6 = (config.global_candidates || []).find(item => item.slug === 'grand-theft-auto-vi');\nif (!gta6 || !(gta6.aliases || []).includes('GTA 6')) throw new Error('GTA VI is not in the global candidate universe.');\nconst gta5 = (config.aliases || []).find(item => item.slug === 'grand-theft-auto-v');\nif ((gta5?.aliases || []).includes('GTA Online')) throw new Error('GTA Online is still merged into GTA V aliases.');\nconst priority = (config.disambiguation || []).find(item => item.prefer_slug === 'grand-theft-auto-vi');\nif (!priority || !(priority.prefer_aliases || []).includes('GTA 6')) throw new Error('GTA VI sequel disambiguation is missing.');\nif (!parser.includes('for (const rule of config.disambiguation || [])')) throw new Error('Popular parser does not apply sequel disambiguation.');\nconst gta6Art = overrides['grand-theft-auto-vi'] || [];\nif (!gta6Art.some(url => /rockstargames\\.com\\/VI\\//i.test(url))) throw new Error('Official Rockstar GTA VI artwork override is missing.');\nif (!curator.includes('const relevanceTier = confirmed') || curator.includes('const tier = !verifiedCover')) throw new Error('Cover verification still determines popularity relevance.');\nif (!curator.includes('eligible: Boolean(relevanceTier)') || !curator.includes('publishable: Boolean(tier)')) throw new Error('Editorial audit does not separate relevance from presentation readiness.');\n\nconsole.log('GTA VI popular-ranking rules are valid.');\n""")
          PY

          rm .github/workflows/fix-gta6-popular.yml
          node --check scripts/parse-popular.mjs
          node --check scripts/curate-home-feeds.mjs
          node --check scripts/test-gta6-popular-rules.mjs
          node scripts/test-gta6-popular-rules.mjs

      - name: Commit isolated fix
        run: |
          git config user.name "igropoisk-maintenance[bot]"
          git config user.email "igropoisk-maintenance[bot]@users.noreply.github.com"
          git add config/parsers/popular.json config/parsers/schedule.json data/popular/cover-overrides.json scripts/parse-popular.mjs scripts/curate-home-feeds.mjs scripts/test-gta6-popular-rules.mjs .github/workflows/fix-gta6-popular.yml
          git commit -m "Исправить попадание GTA VI в популярное"
          git push origin HEAD:fix-gta6-popular-ranking
