name: Publish accepted Arx Fatalis page

on:
  push:
    paths:
      - '.github/workflows/publish-arx-final.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download accepted Arx Fatalis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/arx-final
          mkdir -p /tmp/arx-final
          gh run download 33639037935 --repo "$GITHUB_REPOSITORY" --name arx-fatalis-page-module-33639037935 --dir /tmp/arx-final
      - name: Publish accepted page data
        run: |
          mkdir -p game/arx-fatalis data/drafts data/parser-output data/game-sources data/ratings data/similarity data/media-candidates
          cp /tmp/arx-final/game/arx-fatalis/index.html game/arx-fatalis/index.html
          cp /tmp/arx-final/data/drafts/arx-fatalis.json data/drafts/arx-fatalis.json
          cp /tmp/arx-final/data/parser-output/arx-fatalis.json data/parser-output/arx-fatalis.json
          cp /tmp/arx-final/data/game-sources/arx-fatalis.json data/game-sources/arx-fatalis.json
          cp /tmp/arx-final/data/ratings/arx-fatalis.json data/ratings/arx-fatalis.json
          cp /tmp/arx-final/data/similarity/arx-fatalis.json data/similarity/arx-fatalis.json
          cp /tmp/arx-final/data/media-candidates/arx-fatalis.json data/media-candidates/arx-fatalis.json
      - name: Commit published page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/arx-fatalis data/drafts/arx-fatalis.json data/parser-output/arx-fatalis.json data/game-sources/arx-fatalis.json data/ratings/arx-fatalis.json data/similarity/arx-fatalis.json data/media-candidates/arx-fatalis.json
          git diff --cached --quiet && exit 0
          git commit -m "publish: Arx Fatalis accepted game page"
          git push origin HEAD:main
