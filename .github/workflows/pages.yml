name: Deploy Igropoisk to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [production-pages]
  workflow_dispatch:
  workflow_call:
    inputs:
      production_sha:
        description: Exact main commit to verify and deploy
        required: true
        type: string
    outputs:
      page_url:
        description: Deployed GitHub Pages URL
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  verify-production-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
          fetch-depth: 0

      - name: Require current main snapshot
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deploy-critical runtime
        run: |
          node --check game/_shared/game-shell.js
          node --check game/_shared/game-page.js
          node --check game/_shared/game-page-v3-bootstrap.js
          node --check game/_shared/game-page-v3.js
          node --check game/_shared/game-page-quality.js
          node --check game/_shared/game-page-review-publication-control.js
          node --check game/_shared/game-page-review-sources.js
          node --check game/_shared/game-page-materialized-data.js
          node --check scripts/smoke-game-runtime.mjs
          test -f game/fallout-2/index.html
          test -f data/reviews/fallout-2.json
          git diff --check
          test -z "$(git status --porcelain)"

  deploy:
    needs: verify-production-snapshot
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  game-runtime-production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed game pages and review runtime
        env:
          GAME_RUNTIME_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-game-runtime.mjs
