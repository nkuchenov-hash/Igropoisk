name: Deploy Igropoisk to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  repository_dispatch:
    types: [production-pages]
  workflow_call:
    inputs:
      production_sha:
        description: Exact main commit to verify and deploy
        required: true
        type: string
    outputs:
      page_url:
        description: Deployed GitHub Pages URL
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
          fetch-depth: 0
      - name: Require the requested production commit to be current main
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable production source and automation boundaries
        run: |
          node scripts/verify-deployment-source.mjs
          node scripts/validate-production-boundaries.mjs
          test -z "$(git status --porcelain)"
      - name: Verify JavaScript syntax and feed quality regressions
        run: |
          find assets scripts features game/_shared -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node scripts/test-home-feed-quality.mjs
      - name: Verify approved game module in a real browser before deployment
        run: |
          npm install --no-save --ignore-scripts --package-lock=false puppeteer-core@24.16.0
          node scripts/smoke-game-runtime.mjs
      - name: Verify News Content API pipeline health and module boundary
        run: |
          node scripts/test-news-content-api.mjs
          node scripts/test-news-storage-content-api.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/validate-news-pipeline.mjs --allow-stale-repository-fallback
          node scripts/validate-news-module.mjs
      - name: Verify repository fallback for popular and release feeds
        run: node scripts/validate-home-feeds.mjs
      - name: Verify central design-system governance
        env:
          DESIGN_SYSTEM_BASE_SHA: ${{ github.event.before }}
        run: |
          node scripts/test-central-design-system.mjs
          BASE="$DESIGN_SYSTEM_BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
          if [ -n "$BASE" ]; then node scripts/validate-central-design-system.mjs --base "$BASE"; else node scripts/validate-central-design-system.mjs; fi
      - name: Verify Python syntax and shared layout contract
        run: |
          python3 -m py_compile scripts/enforce_layout_contract.py
          python3 scripts/enforce_layout_contract.py --check
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Verify structured content files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          errors=[]
          for root in (Path('config'),Path('data')):
              if not root.exists(): continue
              for file in root.rglob('*.json'):
                  try: json.loads(file.read_text(encoding='utf-8'))
                  except Exception as error: errors.append(f'{file}: {error}')
          if errors: raise SystemExit('Invalid JSON files:\n'+'\n'.join(errors))
          print('Structured content JSON is valid.')
          PY
      - name: Verify base game publication gates
        run: |
          node scripts/validate-game-v3.mjs
          BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -n "$BASE" ]; then
            CHANGED_SLUGS="$(git diff --name-only "$BASE" HEAD | awk -F/ '/^data\/drafts\/[^/]+\.json$/ { sub(/\.json$/, "", $3); print $3 } /^data\/page-editorial\/[^/]+\.json$/ { sub(/\.json$/, "", $3); print $3 } /^game\/[^/]+\/index\.html$/ && $2 != "pending" { print $2 }' | sort -u | tr '\n' ' ')"
          else CHANGED_SLUGS=""; fi
          if [ -n "$CHANGED_SLUGS" ]; then
            node scripts/validate-game-page-publication-state.mjs $CHANGED_SLUGS
            node scripts/validate-game-shells.mjs $CHANGED_SLUGS
          else
            echo "No game-page shell, draft or canonical editorial changed in this production commit."
          fi
      - name: Reject generated or malformed changes
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the same verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exact repository snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4

  news-production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --package-lock=false puppeteer-core@24.16.0
      - name: Verify deployed news uses Object Storage and read-only health works
        env:
          NEWS_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-news-browser.mjs

  home-feeds-production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --package-lock=false puppeteer-core@24.16.0
      - name: Verify deployed popular and release blocks
        env:
          HOME_FEEDS_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-home-feeds-browser.mjs

  game-runtime-production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --package-lock=false puppeteer-core@24.16.0
      - name: Verify deployed game pages and protected shared runtime
        env:
          GAME_RUNTIME_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-game-runtime.mjs
      - name: Verify deployed Arx Fatalis is complete
        env:
          ARX_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-arx-game-page.mjs
      - name: Verify deployed DOOM uses the complete new Game Page
        env:
          DOOM_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-doom-game-page-v4.mjs
