name: Deploy Igropoisk to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [production-pages]
  workflow_dispatch:
  workflow_call:
    inputs:
      production_sha:
        description: Exact main commit to deploy
        required: true
        type: string
    outputs:
      page_url:
        description: Deployed GitHub Pages URL
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha || github.event.client_payload.production_sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  game-runtime-production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed game pages and review runtime
        env:
          GAME_RUNTIME_SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-game-runtime.mjs
