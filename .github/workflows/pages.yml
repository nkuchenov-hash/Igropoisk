name: Deploy Igropoisk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject repaired UI layer
        run: |
          sed -i 's#</head>#<link rel="stylesheet" href="fix.css"></head>#' index.html
          sed -i 's#</body>#<script src="fix.js"></script></body>#' index.html

      - name: Install release calendar files
        run: |
          node --check scripts/install-release-calendar.mjs
          node scripts/install-release-calendar.mjs

      - name: Validate and inject release calendar UI
        run: |
          node --check scripts/inject-release-ui.mjs
          node --check assets/release-home.js
          node --check assets/release-calendar.js
          node --check assets/release-admin.js
          node --check assets/release-admin-card.js
          node scripts/inject-release-ui.mjs

      - name: Enforce shared layout contract
        run: |
          python3 -m py_compile scripts/enforce_layout_contract.py
          python3 scripts/enforce_layout_contract.py --write
          python3 scripts/enforce_layout_contract.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
