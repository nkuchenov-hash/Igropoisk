name: Popular games parser

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: popular-games-parser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-central-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Run the authoritative curated home-feed pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run parser-scheduler.yml --ref "${GITHUB_REF_NAME}" -f force=true
