name: Popular games parser

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-central-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Run the canonical parser scheduler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run parser-scheduler.yml --ref main -f force=true
