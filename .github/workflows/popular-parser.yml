name: Popular games parser

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/parse-popular.mjs'
      - 'config/parsers/popular.json'
      - '.github/workflows/popular-parser.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: popular-games-parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Calculate current popularity
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
        run: node scripts/parse-popular.mjs
      - name: Commit fresh ranking and audit log
        run: |
          if git diff --quiet -- data/popular/current.json data/parser-runs/popular.json; then
            echo "No popularity changes"
            exit 0
          fi
          git config user.name "igropoisk-parser[bot]"
          git config user.email "igropoisk-parser[bot]@users.noreply.github.com"
          git add data/popular/current.json data/parser-runs/popular.json
          git commit -m "Update current popular games"
          git pull --rebase
          git push
