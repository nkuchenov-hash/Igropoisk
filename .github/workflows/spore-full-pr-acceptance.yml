name: Fresh Spore Full PR Acceptance

on:
  push:
    branches:
      - fix/game-page-module-contract-20260902

permissions:
  contents: read

concurrency:
  group: spore-full-pr-acceptance
  cancel-in-progress: true

jobs:
  build-spore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EDITORIAL_AI_PROVIDER_ORDER: openrouter,gigachat,gemini,groq,ollama
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_EDITORIAL_MODEL: moonshotai/kimi-k2.6:free
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_EDITORIAL_MODEL: GigaChat-3-Ultra
      GIGACHAT_EDITORIAL_FALLBACK_MODEL: GigaChat-2-Max
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EDITORIAL_MODEL: gemini-2.5-pro
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_EDITORIAL_MODEL: qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify module
        run: node scripts/validate-game-page-module-integrity.mjs

      - name: Register fresh Spore
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { GameRegistryApi } from './scripts/lib/game-registry.mjs';
          const registryPath='data/game-registry/registry.transition.json';
          const api=new GameRegistryApi(JSON.parse(fs.readFileSync(registryPath,'utf8')));
          const registration=api.registerCandidate({title:'Spore',slug:'spore',steamAppId:'17390',kind:'game',standalonePage:true,releaseYear:2008,source:{type:'official_platform_store',name:'Steam',url:'https://store.steampowered.com/app/17390/Spore/'},discoveryReason:'explicit_fresh_game_acceptance',status:'identified',statusReason:'fresh Spore acceptance requested',confidence:0.99},{actor:'spore-pr-acceptance'});
          if(!registration.entity) throw new Error(`Spore identity unresolved: ${registration.decision}`);
          fs.writeFileSync(registryPath,JSON.stringify(api.registry,null,2)+'\n');
          fs.mkdirSync('tmp',{recursive:true});
          fs.writeFileSync('tmp/spore-game-id.txt',registration.entity.id);
          NODE

      - name: Parse official Spore data
        run: node scripts/parse-game-data.mjs spore 17390 Spore

      - name: Queue canonical Page Assembly
        run: node scripts/ensure-game-page.mjs "$(cat tmp/spore-game-id.txt)"
        env:
          GAME_CREATOR_SOURCE: fresh-acceptance
          GAME_SOURCE_URL: https://store.steampowered.com/app/17390/Spore/

      - name: Detect zero-host editorial provider
        id: editorial_ai
        shell: bash
        run: |
          if [ -n "${OPENROUTER_API_KEY}${GIGACHAT_CREDENTIALS}${GEMINI_API_KEY}${GROQ_API_KEY}" ]; then
            echo "cloud=true" >> "$GITHUB_OUTPUT"
            echo "Cloud editorial provider configured; local Ollama fallback will not be started."
          else
            echo "cloud=false" >> "$GITHUB_OUTPUT"
            echo "No cloud editorial credentials found; enabling local Ollama fallback."
          fi

      - name: Cache local Qwen fallback
        if: steps.editorial_ai.outputs.cloud != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v1-${{ runner.os }}

      - name: Start local Qwen fallback only when no zero-host provider is configured
        if: steps.editorial_ai.outputs.cloud != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b
          echo "OLLAMA_BASE_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          echo "OLLAMA_EDITORIAL_MODEL=qwen2.5:3b" >> "$GITHUB_ENV"
          echo "OLLAMA_EDITORIAL_TIMEOUT_MS=240000" >> "$GITHUB_ENV"
          echo "FREE_EDITORIAL_AI_ENABLED=1" >> "$GITHUB_ENV"

      - name: Run full canonical lifecycle
        env:
          GAME_TARGET_SLUG: spore
        run: node scripts/run-content-pipeline.mjs

      - name: Require finalized Spore publication
        run: |
          node scripts/validate-game-page-publication-state.mjs spore
          node scripts/validate-game-shells.mjs spore
          test -f game/spore/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const draft=JSON.parse(fs.readFileSync('data/drafts/spore.json','utf8'));
          const editorial=JSON.parse(fs.readFileSync('data/page-editorial/spore.json','utf8'));
          const sources=JSON.parse(fs.readFileSync('data/game-sources/spore.json','utf8'));
          if(draft.publication?.status!=='published'||draft.publication?.public_ready!==true) throw new Error('Spore not published/public_ready');
          if(editorial.quality_status!=='green') throw new Error(`Editorial not green: ${editorial.quality_status}`);
          if(sources.discovery?.complete!==true) throw new Error('Source discovery did not complete');
          console.log(JSON.stringify({publication:draft.publication,editorial_quality:editorial.quality_status,source_discovery:sources.discovery},null,2));
          NODE

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-full-pr-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/parser-output/spore.json
            data/drafts/spore.json
            data/page-editorial/spore.json
            data/game-sources/spore.json
            data/ratings/spore.json
            data/quality-control/*spore*.json
            data/content-pipeline/execution-log.json
            game/spore/index.html
          if-no-files-found: warn
          retention-days: 7
