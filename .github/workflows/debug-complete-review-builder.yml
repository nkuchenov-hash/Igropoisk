name: Diagnose complete review builder

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/debug-complete-review-builder.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve OpenCritic IDs for catalog
        run: |
          node scripts/build-opencritic-id-map.mjs | tee data/parser-runs/complete-review-debug.txt
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add data/opencritic-game-ids.json data/parser-runs/complete-review-debug.txt
          git commit -m "Resolve catalog OpenCritic IDs from Wikidata" || true
          git pull --rebase origin staging || true
          git push origin HEAD:staging || true
