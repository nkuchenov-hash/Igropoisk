name: Diagnose complete review builder

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/debug-complete-review-builder.yml

permissions:
  contents: write
  models: read

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe OpenCritic discovery for Bloodborne
        run: |
          mkdir -p data/parser-runs
          node - <<'NODE' > data/parser-runs/complete-review-debug.txt 2>&1
          const urls=[
            'https://opencritic.com/search?q=Bloodborne',
            'https://opencritic.com/game/76/bloodborne/reviews',
            'https://api.opencritic.com/api/game/search?criteria=Bloodborne',
            'https://api.opencritic.com/api/review/game/76'
          ];
          for(const url of urls){
            try{
              const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0'}});
              const text=await r.text();
              console.log('\nURL',url,'STATUS',r.status,'FINAL',r.url,'LEN',text.length,'TYPE',r.headers.get('content-type'));
              const links=[...text.matchAll(/https?:\\?\/?\\?\/[^\s"'<>]+/g)].map(m=>m[0].replaceAll('\\/','/'));
              const domains=[...new Set(links.map(x=>{try{return new URL(x).hostname}catch{return''}}).filter(Boolean))];
              console.log('DOMAINS',domains.slice(0,80).join(','));
              console.log('SAMPLE',text.slice(0,1200).replace(/\s+/g,' '));
            }catch(e){console.log('ERROR',url,e.message)}
          }
          NODE
          cat data/parser-runs/complete-review-debug.txt
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/parser-runs/complete-review-debug.txt
          git commit -m "Record OpenCritic discovery probe" || true
          git pull --rebase origin staging || true
          git push origin HEAD:staging || true
