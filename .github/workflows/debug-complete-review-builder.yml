name: Diagnose complete review builder

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/debug-complete-review-builder.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe OpenCritic public game search endpoint
        run: |
          mkdir -p data/parser-runs
          node - <<'NODE' > data/parser-runs/complete-review-debug.txt 2>&1
          const url='https://opencritic.com/api/game/search?criteria='+encodeURIComponent('Bloodborne');
          const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept':'application/json'}});
          const text=await r.text();
          console.log('STATUS',r.status,'TYPE',r.headers.get('content-type'),'LEN',text.length);
          console.log(text.slice(0,8000));
          NODE
          cat data/parser-runs/complete-review-debug.txt
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/parser-runs/complete-review-debug.txt
          git commit -m "Record OpenCritic public search probe" || true
          git pull --rebase origin staging || true
          git push origin HEAD:staging || true
