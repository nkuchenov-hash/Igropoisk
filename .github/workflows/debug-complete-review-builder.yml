name: Diagnose complete review builder

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/debug-complete-review-builder.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Export catalog title list
        run: |
          mkdir -p data/parser-runs
          node - <<'NODE' > data/parser-runs/complete-review-debug.txt
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          for(const g of c) console.log(`${g.slug}\t${g.title}\t${g.year||''}`);
          NODE
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/parser-runs/complete-review-debug.txt
          git commit -m "Record catalog title list for review discovery" || true
          git pull --rebase origin staging || true
          git push origin HEAD:staging || true
