name: Diagnose complete review builder

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/debug-complete-review-builder.yml

permissions:
  contents: write
  models: read

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose Bloodborne after syntax fix
        run: |
          mkdir -p data/parser-runs
          {
            echo '=== NODE CHECK V2 ==='
            node --check scripts/build-complete-review-github-models.mjs
            echo '=== RUN V2 ==='
            node scripts/build-complete-review-github-models.mjs bloodborne
          } > data/parser-runs/complete-review-debug.txt 2>&1 || true
          cat data/parser-runs/complete-review-debug.txt
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add data/parser-runs/complete-review-debug.txt
          git commit -m "Record complete review builder diagnostic v2" || true
          git pull --rebase origin staging
          git push origin HEAD:staging
