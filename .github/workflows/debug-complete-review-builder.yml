name: Diagnose complete review builder

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/debug-complete-review-builder.yml

permissions:
  contents: write
  models: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Bloodborne with expanded source corpus
        run: |
          mkdir -p data/parser-runs
          set +e
          node --check scripts/build-complete-review-github-models-v2.mjs > data/parser-runs/complete-review-debug.txt 2>&1
          echo '=== EXPANDED CORPUS V2 BUILD ===' >> data/parser-runs/complete-review-debug.txt
          node scripts/build-complete-review-github-models-v2.mjs bloodborne >> data/parser-runs/complete-review-debug.txt 2>&1
          BUILD=$?
          echo "build_exit=$BUILD" >> data/parser-runs/complete-review-debug.txt
          if [ "$BUILD" = "0" ]; then
            echo '=== VALIDATOR ===' >> data/parser-runs/complete-review-debug.txt
            node scripts/validate-review-output.mjs bloodborne >> data/parser-runs/complete-review-debug.txt 2>&1
            echo "validator_exit=$?" >> data/parser-runs/complete-review-debug.txt
          fi
          cat data/parser-runs/complete-review-debug.txt
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/parser-runs/complete-review-debug.txt
          for f in data/parser-runs/review-source-discovery-bloodborne.json data/parser-runs/review-media-discovery-bloodborne.json data/parser-runs/review-research-bloodborne.json data/articles/bloodborne.json data/article-media/bloodborne.json data/reviews/bloodborne.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Record expanded-corpus Bloodborne diagnostic" || true
          git pull --rebase origin staging || true
          git push origin HEAD:staging || true
          exit 0
