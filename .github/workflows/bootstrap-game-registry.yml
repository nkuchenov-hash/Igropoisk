name: Bootstrap canonical game registry

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: bootstrap-canonical-game-registry
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'feat/unified-game-registry-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-game-registry-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct implementation
        shell: bash
        run: |
          cat .game-registry-bootstrap/part-* | base64 -d > /tmp/game-registry-implementation.tgz
          echo '7b0e8483bc17e629ed6177362586e7626d1a6a0d1d042dd4b968bf3c0961db2e  /tmp/game-registry-implementation.tgz' | sha256sum -c -
          tar -xzf /tmp/game-registry-implementation.tgz -C .
      - name: Verify implementation before commit
        run: |
          find scripts tests admin/games -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --test tests/game-registry.test.mjs tests/game-registry-migration.test.mjs
          node scripts/validate-game-registry-pages.mjs
          python3 scripts/test_safe_game_page_builder.py
          node scripts/test-automation-publish-guard.mjs
          node scripts/migrate-game-registry.mjs --root . --write --registry-out /tmp/game-registry.json --report-out /tmp/game-registry-report.json --base-commit "$GITHUB_SHA"
          git diff --exit-code -- game/_shared data/catalog-visible.json data/public data/game-content data/drafts data/parser-output content game
          cat /tmp/game-registry-report.json
      - name: Remove bootstrap transport
        run: |
          rm -rf .game-registry-bootstrap
          rm -f .github/workflows/bootstrap-game-registry.yml
      - name: Commit isolated implementation
        shell: bash
        run: |
          git config user.name 'igropoisk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Unify canonical game registry lifecycle'
          git push origin HEAD:feat/unified-game-registry-lifecycle
