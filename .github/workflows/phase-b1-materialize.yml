name: Phase B1 materialize news isolation

on:
  push:
    branches: [phase-b1-news-isolation]

permissions:
  contents: write

concurrency:
  group: phase-b1-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolation branch
        uses: actions/checkout@v4
        with:
          ref: phase-b1-news-isolation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Move news rendering and styles into the module
        run: node scripts/migrate-news-isolation.mjs

      - name: Verify module
        run: |
          find features/news scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
          node scripts/validate-news-module.mjs
          python3 scripts/enforce_layout_contract.py --check
          node scripts/validate-game-v3.mjs
          node scripts/validate-editorial-pipeline.mjs
          git diff --check

      - name: Commit materialized source
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "News isolation is already materialized"
            exit 0
          fi
          git config user.name "igropoisk-stabilization[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/home-page.js assets/home-page.css assets/home-wide-rails.css assets/design-system.css fix.css
          git commit -m "Phase B1: isolate news runtime and styles"
          git pull --rebase origin phase-b1-news-isolation
          git push origin HEAD:phase-b1-news-isolation
