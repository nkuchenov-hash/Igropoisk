name: Synchronize main into staging

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: synchronize-main-into-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging with full history
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Fast-forward staging to confirmed production only
        run: |
          git fetch origin main staging

          if git merge-base --is-ancestor origin/main origin/staging; then
            echo "Staging already contains the current main commit."
            exit 0
          fi

          if git merge-base --is-ancestor origin/staging origin/main; then
            git checkout -B staging origin/staging
            git merge --ff-only origin/main
            git push origin HEAD:staging
            echo "Staging fast-forwarded to main."
            exit 0
          fi

          read -r behind ahead <<< "$(git rev-list --left-right --count origin/main...origin/staging)"
          echo "::error::main and staging diverged (staging behind=$behind, ahead=$ahead). Automatic merge commits are forbidden. Preserve staging if needed, then repair it explicitly."
          exit 1
