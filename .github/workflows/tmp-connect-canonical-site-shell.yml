name: Temporary canonical site shell connector

on:
  push:
    branches: ['feat/game-registry-final-audit']

permissions:
  contents: write

concurrency:
  group: tmp-connect-canonical-site-shell
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-registry-final-audit
          fetch-depth: 0
      - name: Connect canonical runtime after legacy runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          shell = '<script src="assets/site-shell.js?v=20260807-1"></script>'
          if shell not in text:
              needle = '<script src="fix.js"></script>'
              if needle not in text:
                  raise SystemExit('fix.js script tag not found')
              text = text.replace(needle, needle + '\n' + shell, 1)
              p.write_text(text)
          PY
      - name: Commit only index runtime connection
        run: |
          git config user.name "igropoisk-registry-sync[bot]"
          git config user.email "igropoisk-registry-sync[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "Canonical site shell already connected."
            exit 0
          fi
          git commit -m "Connect homepage to canonical Game Registry runtime"
          git push origin HEAD:feat/game-registry-final-audit
