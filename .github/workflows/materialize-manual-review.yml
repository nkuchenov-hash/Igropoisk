name: Materialize manual review

on:
  push:
    branches: [staging]
    paths:
      - data/manual-review-builds/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-manual-review-staging
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize review files
        run: |
          shopt -s nullglob
          for dir in data/manual-review-builds/*.parts; do
            cat "$dir"/*.b64part | base64 --decode > /tmp/materialize-review.mjs
            node /tmp/materialize-review.mjs
          done
          for file in data/manual-review-builds/*.mjs; do
            node "$file"
          done
      - name: Commit review files to staging
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add article data
          git diff --cached --quiet && exit 0
          git commit -m "Materialize manual review articles on staging"
          git pull --rebase origin staging
          git push origin HEAD:staging
