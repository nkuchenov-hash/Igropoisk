name: Verify page enrichment on Fallout 2

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/verify-page-enrichment-fallout2.yml'
  pull_request:
    branches: [staging]
    paths:
      - 'data/verification/fallout2-materials-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tool syntax
        run: |
          node --check scripts/prepare-review-research.mjs
          node --check scripts/enrich-review-native-sources.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/discover-review-media.mjs
      - name: Run normal material enrichment for Fallout 2
        run: |
          node scripts/prepare-review-research.mjs fallout-2
          node scripts/enrich-review-native-sources.mjs fallout-2
          node scripts/calculate-ratings-from-research.mjs fallout-2
          node scripts/discover-review-media.mjs fallout-2
      - name: Validate Fallout 2 outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const reviews=JSON.parse(fs.readFileSync('data/reviews/fallout-2.json','utf8'));
          const ratings=JSON.parse(fs.readFileSync('data/ratings/fallout-2.json','utf8'));
          const draft=JSON.parse(fs.readFileSync('data/drafts/fallout-2.json','utf8'));
          if(!Array.isArray(reviews.reviews)||reviews.reviews.length<4) throw new Error(`Too few review/material links: ${reviews.reviews?.length||0}`);
          if(reviews.publication_gate?.maximum!==null) throw new Error('Review corpus is still capped');
          if(reviews.source_registry_scan?.complete!==true) throw new Error('Mandatory source registry scan incomplete');
          if(reviews.external_search?.complete!==true) throw new Error('Broad external search incomplete');
          if(ratings.method?.maximum_sources!==null) throw new Error('Ratings are still capped');
          if(!Array.isArray(draft.media?.screenshots)||draft.media.screenshots.length<7) throw new Error('Media corpus incomplete');
          console.log(JSON.stringify({reviews:reviews.reviews.length,registered_sources:reviews.source_registry_scan?.registered_sources||0,score_sources:reviews.score_sources?.length||0,rating_sources:ratings.sources?.length||0,screenshots:draft.media.screenshots.length,artwork:draft.media.artwork?.length||0},null,2));
          NODE
          git diff --check
      - name: Commit verified output through conflict-safe staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No changes'; exit 0; fi
          git config user.name 'igropoisk-content-bot'
          git config user.email 'igropoisk-content-bot@users.noreply.github.com'
          BRANCH="automation/fallout2-materials-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add data/reviews/fallout-2.json data/research/fallout-2-source-matrix.json data/ratings/fallout-2.json data/drafts/fallout-2.json data/media-candidates/fallout-2.json data/parser-runs
          git commit -m 'Rebuild Fallout 2 page materials with uncapped discovery'

          # Staging may move while discovery runs. Pull the newest staging into
          # the result branch before opening the PR. Generated Fallout 2 output
          # wins only on overlapping conflicts; unrelated staging work is kept.
          git fetch origin staging
          git merge --no-edit -X ours origin/staging

          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base staging --head "$BRANCH" --title 'Rebuild Fallout 2 page materials' --body 'Focused verification of the normal page-material enrichment tool: existing Reviews and Media structure only, mandatory registry scan, broad external search, native publisher discovery, uncapped material/score collection. Result branch is synchronized with the latest staging before merge.')"

          for attempt in 1 2 3; do
            if gh pr merge "$PR_URL" --merge --delete-branch; then
              exit 0
            fi
            echo "Merge attempt $attempt failed; refreshing from staging and retrying"
            git fetch origin staging
            git merge --no-edit -X ours origin/staging || true
            git push origin "$BRANCH"
            sleep $((attempt * 5))
          done
          echo 'Unable to merge verified Fallout 2 output after conflict recovery attempts.' >&2
          exit 1
