name: Continue incomplete Игропоиск game builds

on:
  workflow_run:
    workflows: ['Enrich newly created Игропоиск games']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: game-post-create-continuation-v3
  cancel-in-progress: false

jobs:
  continue-incomplete-page:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect genuinely missing page/review outputs
        id: pending
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const plan=read('data/content-pipeline/execution-plan.json')||{pages:[],reviews:[]};
          const pending=[];
          for(const task of plan.pages||[]){
            if(!task?.slug)continue;
            if(!fs.existsSync(`game/${task.slug}/index.html`))pending.push({type:'page',slug:task.slug});
          }
          for(const task of plan.reviews||[]){
            if(!task?.slug)continue;
            const feed=read(`data/reviews/${task.slug}.json`);
            const article=read(`data/articles/${task.slug}.json`);
            const reviewReady=feed?.publication_gate?.status==='green' || article?.publication_status==='published';
            if(!reviewReady)pending.push({type:'review',slug:task.slug});
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`continue=${pending.length?'true':'false'}\n`);
          console.log(JSON.stringify({status:pending.length?'continuation-required':'idle',pending},null,2));
          NODE

      - name: Dispatch next enrichment cycle
        if: steps.pending.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run game-post-create-enrichment.yml --ref staging
