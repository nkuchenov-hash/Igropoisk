name: Continue incomplete Игропоиск game builds

on:
  workflow_run:
    workflows: ['Enrich newly created Игропоиск games']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: game-post-create-continuation-v1
  cancel-in-progress: false

jobs:
  continue-required-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect incomplete required released game
        id: pending
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='data/game-enrichment-requests';
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const required=r=>r?.full_review_required===true||r?.force_full_review===true||(r?.released===true&&String(r?.modules?.review||'').toLowerCase()!=='ready');
          const rows=fs.existsSync(dir)?fs.readdirSync(dir).filter(f=>f.endsWith('.json')).map(f=>read(path.join(dir,f))).filter(Boolean):[];
          const pending=rows.filter(r=>r?.slug&&String(r.state||'')!=='complete'&&required(r)).sort((a,b)=>String(a.last_run_at||a.requested_at||'').localeCompare(String(b.last_run_at||b.requested_at||''))||String(a.slug).localeCompare(String(b.slug)));
          const first=pending[0]||null;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`continue=${first?'true':'false'}\nslug=${first?.slug||''}\n`);
          console.log(JSON.stringify({status:first?'continuation-required':'idle',slug:first?.slug||null,pending_required:pending.length},null,2));
          NODE

      - name: Dispatch next worker cycle
        if: steps.pending.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Continuing required game build: ${{ steps.pending.outputs.slug }}"
          gh workflow run game-post-create-enrichment.yml --ref staging
