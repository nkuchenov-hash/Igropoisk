name: Continue incomplete Игропоиск game builds

on:
  workflow_run:
    workflows: ['Enrich newly created Игропоиск games']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: game-post-create-continuation-v4
  cancel-in-progress: false

jobs:
  continue-incomplete-page:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect next page that is not green
        id: pending
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const plan=read('data/content-pipeline/execution-plan.json')||{pages:[]};
          const pending=[];
          for(const task of plan.pages||[]){
            if(!task?.slug) continue;
            const page=read(`data/quality-control/page-${task.slug}-control.json`);
            const media=read(`data/quality-control/game-page-${task.slug}.json`);
            const green=page?.green===true && (media?.status==='green' || media?.green===true);
            if(!green) pending.push(task.slug);
          }
          const slug=pending[0]||'';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`continue=${slug?'true':'false'}\nslug=${slug}\n`);
          console.log(JSON.stringify({status:slug?'continuation-required':'idle',next_slug:slug,pending_pages:pending},null,2));
          NODE

      - name: Dispatch next bounded enrichment cycle
        if: steps.pending.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_SLUG: ${{ steps.pending.outputs.slug }}
        run: |
          test -n "$NEXT_SLUG"
          gh workflow run game-post-create-enrichment.yml --ref staging -f slug="$NEXT_SLUG"
