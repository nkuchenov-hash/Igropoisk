name: Patch Wikidata OpenCritic discovery
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-wikidata-opencritic.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Wikidata OpenCritic ID resolver
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check scripts/build-complete-review-github-models-v2.mjs
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build-complete-review-github-models-v2.mjs
          git commit -m "Resolve OpenCritic games through Wikidata IDs"
          git pull --rebase origin staging
          git push origin HEAD:staging
