name: Complete Bloodborne publication build
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-wikidata-opencritic.yml
permissions:
  contents: write
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add single-review rendering support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/render-review-pages.mjs')
          s=p.read_text()
          if "const requestedSlug=process.argv[2]||'';" not in s:
              s=s.replace("const root=process.cwd();\n", "const root=process.cwd();\nconst requestedSlug=process.argv[2]||'';\n", 1)
          old="for(const name of fs.readdirSync(articlesDir).filter(name=>name.endsWith('.json'))){"
          new="const renderFiles=requestedSlug?[`${requestedSlug}.json`]:fs.readdirSync(articlesDir).filter(name=>name.endsWith('.json'));\nfor(const name of renderFiles){"
          if old in s:
              s=s.replace(old,new,1)
          if 'const renderFiles=requestedSlug?' not in s:
              raise SystemExit('renderer patch verification failed')
          p.write_text(s)
          PY
          node --check scripts/render-review-pages.mjs
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/render-review-pages.mjs
          git commit -m "Render individual validated reviews independently" || true
          git pull --rebase origin staging
          git push origin HEAD:staging
      - name: Build, validate, render and materialize Bloodborne
        run: |
          node scripts/build-complete-review-github-models-v2.mjs bloodborne
          node scripts/validate-review-output.mjs bloodborne
          node scripts/render-review-pages.mjs bloodborne
          node scripts/materialize-catalog-no-api.mjs
          git add data article game
          git commit -m "Publish complete Bloodborne page and review to staging" || true
          git pull --rebase origin staging
          git push origin HEAD:staging
