name: Test content-hash review build
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/patch-wikidata-opencritic.yml
permissions:
  contents: write
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch screenshot duplicate detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-complete-review-github-models-v2.mjs')
          s=p.read_text()
          if "import {createHash} from 'node:crypto';" not in s:
              s=s.replace("import path from 'node:path';\n", "import path from 'node:path';\nimport {createHash} from 'node:crypto';\n", 1)
          old="duplicate_group:`${slug}-${Buffer.from(r.url).toString('base64url').slice(0,20)}`"
          new="duplicate_group:`${slug}-${createHash('sha256').update(b).digest('hex').slice(0,24)}`"
          if old not in s:
              raise SystemExit('duplicate group expression not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/build-complete-review-github-models-v2.mjs
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build-complete-review-github-models-v2.mjs scripts/local-review-synthesis.mjs
          git commit -m "Deduplicate review screenshots by content hash" || true
      - name: Build and validate Bloodborne end to end
        run: |
          node scripts/build-complete-review-github-models-v2.mjs bloodborne
          node scripts/validate-review-output.mjs bloodborne
          node scripts/render-review-pages.mjs
          node scripts/materialize-catalog-no-api.mjs
          git add data article game scripts
          git commit -m "Build complete Bloodborne page and review" || true
          git pull --rebase origin staging
          git push origin HEAD:staging
