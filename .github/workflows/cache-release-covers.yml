name: Cache release covers locally

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-release-covers.yml'
      - 'scripts/cache-release-covers.mjs'
      - 'data/releases/current.json'
      - 'data/popular/current.json'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cover-cache
  cancel-in-progress: true

jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify official covers
        run: |
          node --check scripts/cache-release-covers.mjs
          node scripts/cache-release-covers.mjs

      - name: Commit local cover snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/covers/releases data/releases/current.json calendar/index.html
          if git diff --cached --quiet; then
            echo 'Release covers are already current.'
            exit 0
          fi
          git commit -m 'Обновить локальные обложки релизов'
          git push origin HEAD:main
