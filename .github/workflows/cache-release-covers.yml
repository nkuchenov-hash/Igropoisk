name: Cache release covers locally

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cover-cache-staging
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Download and verify official covers
        run: |
          node --check scripts/cache-release-covers.mjs
          node scripts/cache-release-covers.mjs

      - name: Commit local cover snapshot to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/covers/releases data/releases/current.json
          if git diff --cached --quiet; then
            echo 'Release covers are already current.'
            exit 0
          fi
          git commit -m 'Обновить локальные обложки релизов в staging'
          git pull --rebase origin staging
          git push origin HEAD:staging
