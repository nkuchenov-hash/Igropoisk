name: Test publisher sitemap integration
on:
  push:
    branches: [fix/review-publisher-sitemap-discovery]
    paths: [.github/workflows/_test-publisher-sitemap-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-publisher-sitemap-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect RDR2 catalog and Game Registry release history
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          const item=catalog.find(x=>x.slug==='red-dead-redemption-2');
          const registry=JSON.parse(fs.readFileSync('data/game-registry/registry.transition.json','utf8'));
          const entities=Array.isArray(registry.entities)?registry.entities:Object.values(registry.entities||registry.games||{});
          const entity=entities.find(x=>x?.id===item?.game_id||x?.identity?.slug?.value==='red-dead-redemption-2');
          console.log('CATALOG',JSON.stringify(item,null,2));
          console.log('ENTITY',JSON.stringify(entity,null,2));
          NODE
