name: Test publisher sitemap integration
on:
  push:
    branches: [fix/review-publisher-sitemap-discovery]
    paths: [.github/workflows/_test-publisher-sitemap-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-publisher-sitemap-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace RDR2 accepted sitemap source and score enrichment
        run: |
          slug=red-dead-redemption-2
          node scripts/discover-review-sources-web-v8.mjs "$slug" --all
          node scripts/promote-review-source-audit.mjs "$slug"
          node - "$slug" <<'NODE'
          const fs=require('fs'),slug=process.argv[2],m=JSON.parse(fs.readFileSync(`data/research/${slug}-source-matrix.json`,'utf8'));
          console.log('SITEMAP SOURCES',JSON.stringify((m.accepted||[]).filter(x=>['pc-gamer','gamesradar'].includes(x.configured_source_id)),null,2));
          NODE
          node scripts/enrich-review-explicit-scores.mjs "$slug"
          node - "$slug" <<'NODE'
          const fs=require('fs'),slug=process.argv[2],r=JSON.parse(fs.readFileSync(`data/parser-runs/review-explicit-scores-${slug}.json`,'utf8'));
          console.log('SITEMAP CHECKS',JSON.stringify((r.checks||[]).filter(x=>['pc-gamer','gamesradar'].includes(x.configured_source_id)),null,2));
          NODE
          node scripts/calculate-ratings-from-research.mjs "$slug" || true
          node - "$slug" <<'NODE'
          const fs=require('fs'),slug=process.argv[2],r=JSON.parse(fs.readFileSync(`data/reviews/${slug}.json`,'utf8'));
          console.log('FINAL',JSON.stringify({accepted:r.publication_gate?.accepted,status:r.review_score?.status,sources:r.review_score?.sources?.length,score:r.review_score?.calculation?.score_10},null,2));
          NODE
