name: Test publisher sitemap integration
on:
  push:
    branches: [fix/review-publisher-sitemap-discovery]
    paths: [.github/workflows/_test-publisher-sitemap-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-publisher-sitemap-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace PC Gamer discovery acceptance
        run: |
          slug=red-dead-redemption-2
          node scripts/discover-review-sources-web-v8.mjs "$slug" --all
          node - "$slug" <<'NODE'
          const fs=require('fs'),slug=process.argv[2],m=JSON.parse(fs.readFileSync(`data/research/${slug}-source-matrix.json`,'utf8'));
          console.log('PCG ACCEPTED',JSON.stringify(m.accepted.filter(x=>x.configured_source_id==='pc-gamer'),null,2));
          console.log('PCG CHECK',JSON.stringify((m.source_checks||[]).filter(x=>x.source_id==='pc-gamer'),null,2));
          console.log('PCG REJECTED',JSON.stringify((m.rejected||[]).filter(x=>/PC Gamer/i.test(x.publication||'')),null,2));
          console.log('GAMESRADAR ACCEPTED',JSON.stringify(m.accepted.filter(x=>x.configured_source_id==='gamesradar'),null,2));
          NODE
