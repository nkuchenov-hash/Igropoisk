name: Parse game news

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Game slug
        required: true
      steam_appid:
        description: Steam App ID
        required: true

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - slug: the-witcher-3-wild-hunt
            steam_appid: '292030'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve inputs
        id: game
        run: |
          echo "slug=${{ inputs.slug || matrix.slug }}" >> "$GITHUB_OUTPUT"
          echo "appid=${{ inputs.steam_appid || matrix.steam_appid }}" >> "$GITHUB_OUTPUT"
      - run: node scripts/parse-news.mjs "${{ steps.game.outputs.slug }}" "${{ steps.game.outputs.appid }}"
      - name: Commit parser output to staging
        run: |
          git config user.name "igropoisk-parser"
          git config user.email "actions@users.noreply.github.com"
          git add data/news data/parser-runs/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Parse news for ${{ steps.game.outputs.slug }}"
          git pull --rebase origin staging
          git push origin HEAD:staging
