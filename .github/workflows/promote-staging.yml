name: Prepare staging promotion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact staging SHA to promote
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: prepare-staging-promotion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging snapshot
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require automation-only history for scheduled promotion
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin main staging
          AHEAD="$(git rev-list --count origin/main..origin/staging)"
          if [ "$AHEAD" = "0" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to promote."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eligible=true
          while read -r sha; do
            head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '[.[] | select(.base.ref == "staging")][0].head.ref // empty' 2>/dev/null || true)"
            author_email="$(git show -s --format=%ae "$sha")"
            if [[ "$head_ref" == automation/* ]]; then
              continue
            fi
            if [[ "$author_email" == igropoisk-*bot*@users.noreply.github.com ]]; then
              continue
            fi
            echo "Scheduled production promotion blocked by non-automation commit $sha (PR head: ${head_ref:-none}, author: $author_email)."
            eligible=false
            break
          done < <(git rev-list origin/main..origin/staging)
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Verify requested SHA and production gates
        if: steps.trust.outputs.eligible == 'true'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Staging is $ACTUAL_SHA, not requested $EXPECTED_SHA"
            exit 1
          fi
          node scripts/verify-deployment-source.mjs
          node scripts/validate-production-boundaries.mjs
          node scripts/test-news-content-api.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/validate-news-pipeline.mjs
          node scripts/validate-news-module.mjs
          node scripts/validate-home-feeds.mjs
          node scripts/validate-game-v3.mjs
          node scripts/validate-game-media-quality.mjs
          node scripts/audit-review-publication.mjs --strict
          node scripts/validate-editorial-pipeline.mjs
          node scripts/validate-top-250.mjs
          python3 scripts/enforce_layout_contract.py --check
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Open and merge staging-to-main promotion PR
        if: steps.trust.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main staging
          AHEAD="$(git rev-list --count origin/main..origin/staging)"
          if [ "$AHEAD" = "0" ]; then
            echo "Staging has no commits to promote."
            exit 0
          fi
          SHA="$(git rev-parse origin/staging)"
          EXISTING="$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // empty')"
          BODY="Staging snapshot \`$SHA\` passed immutable-source, module, content, media, review and publication gates. Scheduled promotion is allowed only when all unpromoted history is automation-owned; manual dispatch is explicit."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "Promote staging to production" --body "$BODY"
            PR="$EXISTING"
          else
            PR="$(gh pr create --base main --head staging --title "Promote staging to production" --body "$BODY" --json number --jq '.number' 2>/dev/null || true)"
            if [ -z "$PR" ]; then
              PR="$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')"
            fi
          fi
          gh pr merge "$PR" --merge
