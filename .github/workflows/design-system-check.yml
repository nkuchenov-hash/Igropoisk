name: Design system check

on:
  push:
    paths:
      - 'assets/**'
      - 'features/**'
      - 'game/**'
      - 'article/**'
      - 'admin/**'
      - 'backend/**'
      - 'config/**'
      - 'data/**'
      - 'docs/**'
      - 'skills/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'assets/**'
      - 'features/**'
      - 'game/**'
      - 'article/**'
      - 'admin/**'
      - 'backend/**'
      - 'config/**'
      - 'data/**'
      - 'docs/**'
      - 'skills/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node scripts/validate-game-v3.mjs
          node scripts/validate-central-design-system.mjs
