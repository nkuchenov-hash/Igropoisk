name: DOOM smoke diagnostics

on:
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/smoke-doom-game-page-v4.mjs'
      - '.github/workflows/doom-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Reproduce Game Page prerequisites
        run: |
          node scripts/materialize-catalog-game-data.mjs
          node scripts/repair-game-media-from-steam.mjs
          node scripts/validate-game-media-quality.mjs
          node scripts/build-similarity-index.mjs
          node scripts/validate-game-shells.mjs
      - name: Run DOOM smoke
        run: node scripts/smoke-doom-game-page-v4.mjs
      - name: Preserve DOOM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doom-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/quality-control/doom-smoke.json
          if-no-files-found: error
          retention-days: 2
