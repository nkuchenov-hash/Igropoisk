name: Central parser scheduler

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run all enabled parsers regardless of freshness
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - 'config/parsers/schedule.json'
      - 'config/parsers/popular.json'
      - 'config/parsers/releases.json'
      - 'config/parsers/official-popular-art.json'
      - 'config/home-feeds-quality.json'
      - 'data/popular/cover-overrides.json'
      - 'features/home-releases/rules.json'
      - 'assets/popular-home.js'
      - 'assets/home-releases/index.js'
      - 'scripts/run-scheduled-parsers.mjs'
      - 'scripts/parse-releases.mjs'
      - 'scripts/parse-popular.mjs'
      - 'scripts/enrich-global-popular-youtube.mjs'
      - 'scripts/resolve-global-popular-art.mjs'
      - 'scripts/resolve-official-popular-packages.mjs'
      - 'scripts/test-gta6-popular-rules.mjs'
      - 'scripts/curate-home-feeds.mjs'
      - 'scripts/filter-popular.mjs'
      - 'scripts/resolve-popular-covers.mjs'
      - 'scripts/validate-home-feeds.mjs'
      - '.github/workflows/parser-scheduler.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: central-parser-scheduler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependencies
        run: npm install --no-save --ignore-scripts image-size@2

      - name: Validate parser code
        run: |
          node --check scripts/run-scheduled-parsers.mjs
          node --check scripts/parse-releases.mjs
          node --check scripts/parse-popular.mjs
          node --check scripts/enrich-global-popular-youtube.mjs
          node --check scripts/resolve-global-popular-art.mjs
          node --check scripts/resolve-official-popular-packages.mjs
          node --check scripts/test-gta6-popular-rules.mjs
          node --check scripts/curate-home-feeds.mjs
          node --check scripts/filter-popular.mjs
          node --check scripts/resolve-popular-covers.mjs
          node --check scripts/validate-home-feeds.mjs
          node --check assets/popular-home.js
          node --check assets/home-releases/index.js
          node scripts/test-gta6-popular-rules.mjs

      - name: Run due parsers independently
        id: parsers
        continue-on-error: true
        env:
          PARSER_FORCE: ${{ inputs.force || github.event.inputs.force || github.event_name == 'push' }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          mkdir -p assets/covers/releases assets/covers/popular data/release-drafts data/parser-runs
          node scripts/run-scheduled-parsers.mjs

      - name: Curate available snapshots without a cardinality gate
        id: curation
        if: always()
        run: node scripts/curate-home-feeds.mjs

      - name: Preserve editorial audit for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-feeds-editorial-audit-${{ github.run_id }}
          path: |
            data/home-feeds-quality.json
            data/popular/current.json
            data/parser-runs/popular.json
            data/releases/current.json
            data/parser-runs/releases.json
            data/parser-runs/scheduler.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate publishable home feeds
        id: validation
        if: always()
        continue-on-error: true
        run: node scripts/validate-home-feeds.mjs --fresh-hours 18

      - name: Commit validated parser outputs
        id: publication
        if: always() && github.ref == 'refs/heads/main' && steps.curation.outcome == 'success' && steps.validation.outcome == 'success'
        run: |
          git config user.name "igropoisk-parser[bot]"
          git config user.email "igropoisk-parser[bot]@users.noreply.github.com"

          remote_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Branch advanced from $GITHUB_SHA to ${remote_sha:-unknown}; stale generated snapshot was not published."
            exit 0
          fi

          paths=(
            data/popular/current.json
            data/popular/published.json
            data/popular/covers.json
            data/parser-runs/popular.json
            assets/covers/popular
            data/releases/current.json
            data/releases/changes.json
            data/parser-runs/releases.json
            data/parser-runs/scheduler.json
            data/home-feeds-quality.json
            data/release-drafts
            assets/covers/releases
          )

          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi

          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "Parser snapshots are already current."
            exit 0
          fi

          git commit -m "Update curated popular and release feeds"
          git push origin "HEAD:$GITHUB_REF_NAME"
          published_sha="$(git rev-parse HEAD)"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
          echo "superseded=false" >> "$GITHUB_OUTPUT"

      - name: Deploy updated production feeds
        if: steps.publication.outputs.published == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.publication.outputs.published_sha }}
        run: |
          visible_sha=""
          for attempt in $(seq 1 30); do
            visible_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$visible_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            sleep 2
          done
          if [ "$visible_sha" != "$EXPECTED_SHA" ]; then
            echo "GitHub API still resolves main to $visible_sha instead of $EXPECTED_SHA"
            exit 1
          fi
          sleep 3
          gh workflow run pages.yml --ref main

      - name: Report parser degradation without blocking valid updates
        if: steps.parsers.outcome == 'failure' && steps.validation.outcome == 'success'
        run: echo "One or more sources/parsers degraded, but valid popular and release snapshots were curated and remain publishable."

      - name: Report invalid publication
        if: steps.curation.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: |
          echo "Home-feed output is structurally invalid and was not published."
          exit 1
