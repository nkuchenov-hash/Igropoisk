name: Central parser scheduler

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run all enabled parsers regardless of freshness
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [staging]
    paths:
      - 'config/parsers/**'
      - 'config/home-feeds-quality.json'
      - 'config/release-calendar.json'
      - 'config/home-feeds-storage.json'
      - 'data/popular/cover-overrides.json'
      - 'features/home-releases/rules.json'
      - 'scripts/run-scheduled-parsers.mjs'
      - 'scripts/parse-releases.mjs'
      - 'scripts/parse-popular.mjs'
      - 'scripts/enrich-global-popular-youtube.mjs'
      - 'scripts/resolve-global-popular-art.mjs'
      - 'scripts/resolve-official-popular-packages.mjs'
      - 'scripts/curate-home-feeds.mjs'
      - 'scripts/filter-popular.mjs'
      - 'scripts/resolve-popular-covers.mjs'
      - 'scripts/validate-home-feeds.mjs'
      - 'scripts/canonicalize-system-game-identity.mjs'
      - 'scripts/materialize-release-calendar.mjs'
      - 'scripts/validate-release-calendar.mjs'
      - 'scripts/test-release-calendar-policy.mjs'
      - 'scripts/publish-home-feeds-storage.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/parser-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: central-parser-scheduler-storage
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current staging code and repository fallback snapshot
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependencies
        run: npm install --no-save --ignore-scripts image-size@2

      - name: Validate parser and storage code
        run: |
          node --check scripts/run-scheduled-parsers.mjs
          node --check scripts/parse-releases.mjs
          node --check scripts/parse-popular.mjs
          node --check scripts/curate-home-feeds.mjs
          node --check scripts/validate-home-feeds.mjs
          node --check scripts/canonicalize-system-game-identity.mjs
          node --check scripts/materialize-release-calendar.mjs
          node --check scripts/validate-release-calendar.mjs
          node --check scripts/publish-home-feeds-storage.mjs
          node --check scripts/lib/yandex-object-storage.mjs
          node scripts/test-release-calendar-policy.mjs

      - name: Bootstrap last repository snapshot into Object Storage if empty
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: node scripts/publish-home-feeds-storage.mjs --bootstrap-only

      - name: Run due parsers independently
        id: parsers
        continue-on-error: true
        env:
          PARSER_FORCE: ${{ inputs.force || github.event.inputs.force || github.event_name == 'push' }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          mkdir -p assets/covers/releases assets/covers/popular data/release-drafts data/parser-runs
          node scripts/run-scheduled-parsers.mjs

      - name: Curate available snapshots
        id: curation
        if: always()
        continue-on-error: true
        run: node scripts/curate-home-feeds.mjs

      - name: Bind Popular snapshots to canonical Game Registry ids
        id: identity
        if: always() && steps.curation.outcome == 'success'
        continue-on-error: true
        run: node scripts/canonicalize-system-game-identity.mjs --write --popular-only

      - name: Materialize editorial release calendar
        id: release_calendar
        if: always() && steps.identity.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/test-release-calendar-policy.mjs
          node scripts/materialize-release-calendar.mjs
          node scripts/validate-release-calendar.mjs

      - name: Validate publishable home feeds
        id: validation
        if: always() && steps.release_calendar.outcome == 'success'
        continue-on-error: true
        run: node scripts/validate-home-feeds.mjs --fresh-hours 18

      - name: Publish immutable home-feed snapshot and switch manifest
        id: publication
        if: steps.validation.outcome == 'success'
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: node scripts/publish-home-feeds-storage.mjs

      - name: Keep last validated external snapshot on rejected refresh
        if: always() && steps.validation.outcome != 'success'
        run: echo "Fresh parser output did not pass all publication gates; current Object Storage manifest remains unchanged."

      - name: Prove parser automation did not write to GitHub
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
          git diff --check
          echo "Generated parser data stayed in the runner workspace and Object Storage; Git history was not modified."

      - name: Preserve editorial audit for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-feeds-editorial-audit-${{ github.run_id }}
          path: |
            data/home-feeds-quality.json
            data/popular/current.json
            data/popular/published.json
            data/parser-runs/popular.json
            data/releases/current.json
            data/releases/public.json
            data/releases/materialization-report.json
            data/release-candidates/current.json
            data/parser-runs/releases.json
            data/parser-runs/scheduler.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report source degradation without replacing valid content
        if: always() && (steps.parsers.outcome == 'failure' || steps.validation.outcome != 'success')
        run: echo "Parser refresh degraded or was rejected; the last validated external snapshot remains active."
