name: Temporary sync final audit with staging

on:
  push:
    branches: ['feat/game-registry-final-audit']

permissions:
  contents: write

concurrency:
  group: tmp-sync-final-audit-with-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-registry-final-audit
          fetch-depth: 0
      - name: Merge current staging without rewriting feature commits
        run: |
          git config user.name "igropoisk-registry-sync[bot]"
          git config user.email "igropoisk-registry-sync[bot]@users.noreply.github.com"
          git fetch origin staging
          git merge --no-edit origin/staging
          git push origin HEAD:feat/game-registry-final-audit
