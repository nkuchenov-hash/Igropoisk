name: Temporary fix DOOM preview design guard
on:
  push:
    branches:
      - tmp/fix-doom-preview-design-guard
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply central components and layout contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview/doom-dark-ages-alt/index.html')
          s=p.read_text(encoding='utf-8')
          if '/Igropoisk/assets/design-system.css' not in s:
              s=s.replace('<meta name="color-scheme" content="dark">','<meta name="color-scheme" content="dark">\n<link rel="stylesheet" href="/Igropoisk/assets/design-system.css">')
          replacements={
              'class="header-btn"':'class="ig-button header-btn"',
              'class="btn ':'class="ig-button btn ',
              'class="btn"':'class="ig-button btn"',
              'class="thumb ':'class="ig-button thumb ',
              'class="thumb"':'class="ig-button thumb"',
              'class="control"':'class="ig-button control"',
              'class="tab ':'class="ig-button tab ',
              'class="tab"':'class="ig-button tab"',
              'class="close"':'class="ig-button close"',
              'class="card"':'class="ig-card card"',
              'class="modal"':'class="ig-panel modal"',
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          s=s.replace(' style="grid-template-columns:1fr"','')
          header_style='<link rel="stylesheet" href="/Igropoisk/assets/site-header.css?v=20260803-2" data-ig-shared-header="style">'
          layout_style='<link rel="stylesheet" href="/Igropoisk/assets/layout-contract.css?v=20260803-1" data-ig-layout-contract="style">'
          header_script='<script src="/Igropoisk/assets/site-header.js?v=20260803-2" data-ig-shared-header="script" defer></script>'
          layout_script='<script src="/Igropoisk/assets/layout-contract.js?v=20260803-1" data-ig-layout-contract="script" defer></script>'
          for token in (header_style,layout_style,header_script,layout_script):
              s=s.replace(token,'')
          s=s.replace('</head>',f'{header_style}\n{layout_style}\n</head>')
          s=s.replace('</body>',f'{header_script}\n{layout_script}\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify complete layout/header contract
        run: python3 scripts/enforce_layout_contract.py --check
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/doom-dark-ages-alt/index.html
          git commit -m "Fix DOOM preview layout contract"
          git push origin HEAD:main
