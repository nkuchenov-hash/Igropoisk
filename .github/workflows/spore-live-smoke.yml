name: Spore live smoke

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/spore-live-smoke.yml'

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Spore page and JSON
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nkuchenov-hash.github.io/Igropoisk'
          curl --fail --silent --show-error --location --retry 12 --retry-delay 2 --retry-all-errors "$BASE/game/spore/" -o /tmp/page.html
          grep -q 'SPORE™ — Игропоиск' /tmp/page.html
          curl --fail --silent --show-error --location --retry 12 --retry-delay 2 --retry-all-errors "$BASE/data/reviews/spore.json" -o /tmp/reviews.json
          curl --fail --silent --show-error --location --retry 12 --retry-delay 2 --retry-all-errors "$BASE/data/ratings/spore.json" -o /tmp/ratings.json
          node - <<'NODE'
          const fs=require('fs');
          const reviews=JSON.parse(fs.readFileSync('/tmp/reviews.json','utf8'));
          const ratings=JSON.parse(fs.readFileSync('/tmp/ratings.json','utf8'));
          const rows=Array.isArray(reviews.reviews)?reviews.reviews:[];
          const scores=Array.isArray(ratings.sources)?ratings.sources:[];
          if(rows.length<10) throw new Error(`reviews ${rows.length}/10`);
          if(scores.length<5) throw new Error(`scores ${scores.length}/5`);
          if(ratings.status!=='green') throw new Error(`rating status ${ratings.status}`);
          if(Number(ratings.calculation?.score_10)!==8.6) throw new Error(`rating ${ratings.calculation?.score_10}`);
          console.log(JSON.stringify({page:'https://nkuchenov-hash.github.io/Igropoisk/game/spore/',reviews:rows.length,scores:scores.length,rating:ratings.calculation.score_10,status:'green'},null,2));
          NODE
