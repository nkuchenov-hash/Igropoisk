name: Spore Search Provider Diagnostics
on:
  push:
    branches: [diag/spore-search-results-20260903]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query review search results
        run: |
          node <<'NODE'
          const qs=[
            '"Spore" review site:gamespot.com',
            '"Spore" review site:gamerevolution.com',
            '"Spore" review site:worthplaying.com',
            '"Spore" review site:gameinformer.com',
            '"Spore" review site:gamesradar.com',
            '"Spore" review site:gamingnexus.com',
            '"Spore" review site:wired.com',
            '"Spore" review 2008'
          ];
          const decode=s=>String(s||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#x27;|&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          for(const q of qs){
            console.log('\n===== '+q+' =====');
            const u=new URL('https://www.bing.com/search');u.searchParams.set('format','rss');u.searchParams.set('count','50');u.searchParams.set('q',q);
            try{
              const r=await fetch(u,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(7000)});
              const xml=await r.text(); let n=0;
              for(const m of xml.matchAll(/<item>([\s\S]*?)<\/item>/gi)){
                const b=m[1],pick=t=>decode((b.match(new RegExp(`<${t}>([\\s\\S]*?)<\\/${t}>`,'i'))||[])[1]||'');
                console.log(JSON.stringify({title:pick('title'),url:pick('link'),description:pick('description')}));
                if(++n>=8)break;
              }
            }catch(e){console.log('ERR',String(e))}
          }
          NODE
