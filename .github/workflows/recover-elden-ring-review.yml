name: Recover Elden Ring review payloads

on:
  push:
    branches:
      - fix/recover-elden-ring-mafia-build
    paths:
      - scripts/recover-manual-review-payloads.mjs
      - .github/workflows/recover-elden-ring-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover payloads
        run: node scripts/recover-manual-review-payloads.mjs elden-ring
      - name: Restore recovered media corpus
        run: |
          cp .tmp-recovered-review/elden-ring/data/article-media/elden-ring.json data/article-media/elden-ring.json
          node -e "JSON.parse(require('fs').readFileSync('data/article-media/elden-ring.json','utf8')); console.log('Recovered media JSON is valid')"
      - name: Commit recovered media
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          git add data/article-media/elden-ring.json
          git diff --cached --quiet && exit 0
          git commit -m "Recover Elden Ring article media corpus"
          git push origin HEAD:fix/recover-elden-ring-mafia-build
