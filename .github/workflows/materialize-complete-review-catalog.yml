name: Materialize complete review catalog
on:
  push:
    branches: [content/complete-review-catalog-2026-08-11]
    paths:
      - 'scripts/materialize-complete-review-catalog.mjs'
      - '.github/workflows/materialize-complete-review-catalog.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/complete-review-catalog-2026-08-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/materialize-complete-review-catalog.mjs
      - run: |
          node scripts/audit-review-publication.mjs || true
          node scripts/validate-game-media-quality.mjs
          git diff --check
      - name: Commit materialized package
        run: |
          git config user.name "igropoisk-review-repair[bot]"
          git config user.email "igropoisk-review-repair[bot]@users.noreply.github.com"
          git add data/articles data/reviews data/game-media data/drafts article
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize complete published review catalog"
          git push origin HEAD:content/complete-review-catalog-2026-08-11
