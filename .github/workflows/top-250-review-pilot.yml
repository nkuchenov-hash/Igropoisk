name: Top-250 review pilot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/top-250-review-pilot
    paths:
      - 'scripts/build-top-250.mjs'
      - 'scripts/validate-top-250.mjs'
      - 'scripts/seed-top-250-web-reviews.mjs'
      - 'data/top-250/**'
      - 'data/pilot-reviews/**'
      - 'top-250/**'
      - 'assets/top-250.*'
      - 'article/**'
      - '.github/workflows/top-250-review-pilot.yml'
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/build-top-250.mjs'
      - 'scripts/validate-top-250.mjs'
      - 'scripts/seed-top-250-web-reviews.mjs'
      - 'data/top-250/**'
      - 'data/pilot-reviews/**'
      - 'top-250/**'
      - 'assets/top-250.*'
      - 'article/**'
      - '.github/workflows/top-250-review-pilot.yml'

permissions:
  contents: read

jobs:
  validate-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed Top-250 snapshot
        run: node scripts/validate-top-250.mjs
      - name: Validate Game Registry integration
        run: node scripts/validate-system-game-registry-integration.mjs
      - name: Validate review pilot target
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('data/top-250/review-pilot-status.json', 'utf8'));
          if (status.passed !== true || Number(status.published) < 10) {
            throw new Error(`Top-250 review pilot target not met: ${status.published || 0}/10`);
          }
          const top = JSON.parse(fs.readFileSync('data/top-250/current.json', 'utf8'));
          const published = (top.ranking || []).filter(item => item.review?.status === 'published' && item.review?.url);
          if (published.length < 10) throw new Error(`Top-250 exposes only ${published.length}/10 published reviews`);
          for (const item of published) {
            if (!fs.existsSync(`data/pilot-reviews/${item.slug}.json`) && !fs.existsSync(`data/articles/${item.slug}.json`)) {
              throw new Error(`Missing review data for ${item.slug}`);
            }
            if (!fs.existsSync(`article/${item.slug}/index.html`)) throw new Error(`Missing review page for ${item.slug}`);
          }
          console.log(`Top-250 pilot verified: ${published.length} published review links.`);
          NODE
