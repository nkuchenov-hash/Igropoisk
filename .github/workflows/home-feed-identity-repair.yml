name: One-time home feed quality repair

on:
  push:
    branches: [hotfix/home-feeds-quality-repair]
    paths:
      - .github/workflows/home-feed-identity-repair.yml
      - assets/home-releases/index.js
      - features/home-releases/rules.json
      - config/home-feeds-quality.json
      - config/parsers/popular.json
      - scripts/curate-home-feeds.mjs
      - scripts/lib/home-feed-identity.mjs
      - scripts/lib/home-release-quality.mjs
      - scripts/test-home-feed-quality.mjs
      - scripts/validate-home-feeds.mjs

permissions:
  contents: write

concurrency:
  group: one-time-home-feed-quality-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact repair branch without external actions
        run: |
          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Use latest verified production feed as bounded fallback
        working-directory: repo
        run: |
          git fetch origin main --depth=1
          git show origin/main:data/popular/current.json > data/popular/published.json

      - name: Recurate and validate complete home-feed quality
        working-directory: repo
        run: |
          node --version
          node scripts/test-home-feed-quality.mjs
          node scripts/curate-home-feeds.mjs
          node scripts/validate-home-feeds.mjs
          git diff --check

      - name: Commit deterministic repaired datasets
        working-directory: repo
        run: |
          if git diff --quiet -- data/popular/current.json data/popular/published.json data/home-feeds-quality.json data/releases/current.json; then
            echo 'No repaired dataset changes were required.'
            exit 0
          fi
          git fetch origin hotfix/home-feeds-quality-repair --depth=1
          test "$(git rev-parse origin/hotfix/home-feeds-quality-repair)" = "$GITHUB_SHA"
          git config user.name 'igropoisk-parser[bot]'
          git config user.email 'igropoisk-parser[bot]@users.noreply.github.com'
          git add data/popular/current.json data/popular/published.json data/home-feeds-quality.json data/releases/current.json
          git commit -m 'Repair home feed identity and release quality'
          git push origin HEAD:hotfix/home-feeds-quality-repair
