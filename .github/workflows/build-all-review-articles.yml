name: Build catalog pages and existing reviews

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - .github/workflows/build-all-review-articles.yml
      - data/review-build-requests/all-catalog.json
      - scripts/materialize-catalog-no-api.mjs
      - scripts/render-review-pages.mjs
      - data/game-registry/**
      - data/articles/**
      - data/article-media/**

permissions:
  contents: write

concurrency:
  group: build-catalog-no-api-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure builder identity
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
      - name: Materialize every catalog game page without external AI API
        run: node scripts/materialize-catalog-no-api.mjs
      - name: Render all already prepared review articles
        continue-on-error: true
        run: node scripts/render-review-pages.mjs
      - name: Bind editorial artifacts to canonical Game Registry IDs
        if: always()
        run: node scripts/canonicalize-all-editorial-game-ids.mjs --write
      - name: Commit materialized pages and reports to staging
        if: always()
        run: |
          git add data article game
          git diff --cached --quiet && exit 0
          git commit -m "Materialize catalog pages without OpenAI API"
          git pull --rebase origin staging
          git push origin HEAD:staging
