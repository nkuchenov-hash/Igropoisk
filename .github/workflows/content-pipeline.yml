name: Maintain Игропоиск game lifecycle

on:
  workflow_dispatch:
    inputs:
      news_game_requests_b64:
        description: Base64 JSON of games whose pages are required by news
        required: false
        type: string
        default: ''
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [staging]
    paths:
      - 'scripts/hydrate-live-home-feeds.mjs'
      - 'scripts/orchestrate-content.mjs'
      - 'scripts/plan-news-game-pages.mjs'
      - 'scripts/materialize-news-production-pages.mjs'
      - 'scripts/run-content-pipeline.mjs'
      - 'scripts/run-game-catalog-enrichment.mjs'
      - 'scripts/materialize-catalog-game-data.mjs'
      - 'scripts/prepare-guide-research.mjs'
      - 'scripts/build-game-page.mjs'
      - 'scripts/build-game-page-basic.mjs'
      - 'scripts/canonicalize-editorial-game-id.mjs'
      - 'scripts/repair-public-catalog-game-ids.mjs'
      - 'scripts/materialize-review-publication-feed.mjs'
      - 'scripts/prepare-review-research.mjs'
      - 'scripts/calculate-ratings-from-research.mjs'
      - 'scripts/synthesize-review-adaptive.mjs'
      - 'scripts/quality-control-loop.mjs'
      - 'scripts/validate-game-media-quality.mjs'
      - 'scripts/build-similarity-index.mjs'
      - 'scripts/enrich-game-relations.mjs'
      - 'scripts/audit-review-publication.mjs'
      - 'scripts/validate-automation-publish-diff.mjs'
      - 'scripts/test-news-game-registry-discovery.mjs'
      - 'scripts/lib/news-game-registry-discovery.mjs'
      - 'scripts/lib/editorial-game-registry-adapter.mjs'
      - 'scripts/lib/system-game-registry-adapter.mjs'
      - 'config/content-pipeline.json'
      - 'config/game-page-quality-v2.json'
      - 'config/home-feeds-storage.json'
      - '.github/workflows/content-pipeline.yml'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: content-lifecycle-staging
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lifecycle scripts
        run: |
          node --check scripts/hydrate-live-home-feeds.mjs
          node --check scripts/orchestrate-content.mjs
          node --check scripts/plan-news-game-pages.mjs
          node --check scripts/materialize-news-production-pages.mjs
          node --check scripts/run-content-pipeline.mjs
          node --check scripts/run-game-catalog-enrichment.mjs
          node --check scripts/materialize-catalog-game-data.mjs
          node --check scripts/prepare-guide-research.mjs
          node --check scripts/build-game-page.mjs
          node --check scripts/build-game-page-basic.mjs
          node --check scripts/canonicalize-editorial-game-id.mjs
          node --check scripts/repair-public-catalog-game-ids.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/prepare-review-research.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/synthesize-review-adaptive.mjs
          node --check scripts/quality-control-loop.mjs
          node --check scripts/validate-game-media-quality.mjs
          node --check scripts/build-similarity-index.mjs
          node --check scripts/enrich-game-relations.mjs
          node --check scripts/validate-automation-publish-diff.mjs
          node --check scripts/materialize-review-publication-feed.mjs
          node --check scripts/audit-review-publication.mjs
          node --check scripts/lib/game-registry.mjs
          node --check scripts/lib/game-registry-migration.mjs
          node --check scripts/lib/game-registry-page-sections.mjs
          node --check scripts/lib/news-game-registry-discovery.mjs
          node --check scripts/lib/editorial-game-registry-adapter.mjs
          node --check scripts/lib/system-game-registry-adapter.mjs
          node --check game/_shared/game-page-materialized-data.js
          node scripts/test-news-game-registry-discovery.mjs
      - name: Hydrate current Popular and Releases snapshots from Object Storage
        run: node scripts/hydrate-live-home-feeds.mjs
      - name: Repair public catalog canonical identities
        run: node scripts/repair-public-catalog-game-ids.mjs
      - name: Restore only green identity-safe publication links before planning new work
        run: node scripts/materialize-review-publication-feed.mjs
      - name: Materialize and enrich the visible game catalog
        run: node scripts/run-game-catalog-enrichment.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-5' }}
          CATALOG_RELATION_BATCH: '8'
          CATALOG_REVIEW_BATCH: '6'
          CATALOG_GUIDE_BATCH: '8'
      - name: Build canonical registry and semantic work queue
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Inject every news-required missing game page into this lifecycle run
        env:
          NEWS_GAME_REQUESTS_B64: ${{ inputs.news_game_requests_b64 || '' }}
        run: node scripts/plan-news-game-pages.mjs
      - name: Build selected game pages and revise red work until green
        run: node scripts/run-content-pipeline.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5' }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-5' }}
      - name: Check whether every news-required page is ready
        id: news_pages
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const path = require('path');
          let requestPlan = { required_games: [] };
          try { requestPlan = JSON.parse(fs.readFileSync('tmp/news-game-page-plan.json', 'utf8')); } catch {}
          const games = Array.isArray(requestPlan.required_games) ? requestPlan.required_games : [];
          const ready = games.filter(game => {
            const page = path.join('game', game.slug, 'index.html');
            const draft = path.join('data/drafts', `${game.slug}.json`);
            let quality = null;
            try { quality = JSON.parse(fs.readFileSync(path.join('data/quality-control', `page-${game.slug}-control.json`), 'utf8')); } catch {}
            return fs.existsSync(page) && fs.existsSync(draft) && quality?.green !== false;
          });
          const gamesB64 = Buffer.from(JSON.stringify(games), 'utf8').toString('base64');
          process.stdout.write(`count=${games.length}\nready_count=${ready.length}\nall_ready=${games.length > 0 && ready.length === games.length ? 'true' : 'false'}\ngames_b64=${gamesB64}\n`);
          NODE
      - name: Materialize newly green reviews into runtime feed
        run: node scripts/materialize-review-publication-feed.mjs
      - name: Recalculate lifecycle state
        if: always()
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Audit actual review publication state
        if: always()
        run: node scripts/audit-review-publication.mjs
      - name: Stage isolated lifecycle and revision state
        run: |
          paths=(
            data/content-pipeline
            data/game-registry
            data/quality-control
            data/franchises
            data/similarity
            data/guides
            data/reviews
            data/parser-output
            data/parser-runs
            data/drafts
            data/game-content
            data/catalog-visible.json
            data/research
            data/ratings
            data/media-candidates
            data/articles
            data/article-drafts
            data/article-media
            game
            article
          )
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          if ! git diff --cached --quiet; then
            node scripts/validate-automation-publish-diff.mjs --profile content-pipeline
          fi
      - name: Validate complete candidate and retained revision state
        if: success()
        run: |
          if git diff --cached --quiet; then exit 0; fi
          node scripts/validate-game-v3.mjs
          node scripts/validate-game-media-quality.mjs
          node scripts/audit-review-publication.mjs
          node scripts/validate-editorial-pipeline.mjs
          node scripts/validate-production-boundaries.mjs
          node scripts/validate-top-250.mjs
          python3 scripts/enforce_layout_contract.py --check
          git diff --check
      - name: Open and merge isolated lifecycle PR
        id: lifecycle_publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "No lifecycle or revision-state changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/game-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Build and revise queued game lifecycle output"
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base staging \
            --head "$branch" \
            --title "Automated game lifecycle ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --body "Autonomous game lifecycle output. Every visible game is tracked for relations/franchise, similarity, professional reviews/rating and guides. Green content is exposed publicly; red quality findings are retained only as revision state and automatically return to research/rebuild/recheck on the next lifecycle pass. The workflow never treats a red quality result as terminal.")"
          gh pr merge "$pr_url" --merge --delete-branch
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Promote only news-required green game pages to production
        id: production_publish
        if: steps.news_pages.outputs.all_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          production="$RUNNER_TEMP/news-production-main"
          rm -rf "$production"
          git worktree add "$production" origin/main
          node scripts/materialize-news-production-pages.mjs --target "$production"
          cd "$production"
          git diff --check
          node scripts/validate-game-v3.mjs
          node scripts/validate-production-boundaries.mjs
          paths=(game data/catalog-visible.json data/drafts data/game-content data/ratings data/reviews data/guides data/articles data/similarity article)
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            branch="automation/news-game-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git config user.name "igropoisk-content[bot]"
            git config user.email "igropoisk-content[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git commit -m "Publish news-required canonical game pages"
            git push origin "$branch"
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Publish news-required game pages ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
              --body "Isolated production promotion for canonical game pages referenced by published news hashtags. Only the requested games and their per-game materialized content are copied from staging; unrelated staging changes are excluded.")"
            gh pr merge "$pr_url" --merge --delete-branch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait until every promoted game page is live
        if: steps.news_pages.outputs.all_ready == 'true'
        env:
          NEWS_GAMES_B64: ${{ steps.news_pages.outputs.games_b64 }}
        run: |
          set -euo pipefail
          slugs="$(node -e "const a=JSON.parse(Buffer.from(process.env.NEWS_GAMES_B64,'base64').toString('utf8'));process.stdout.write(a.map(x=>x.slug).join(' '))")"
          base="https://nkuchenov-hash.github.io/Igropoisk"
          ready=false
          for attempt in $(seq 1 90); do
            missing=0
            for slug in $slugs; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$base/game/$slug/" || true)"
              if [ "$code" != "200" ]; then missing=$((missing+1)); fi
            done
            if [ "$missing" = "0" ]; then ready=true; break; fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "One or more news-required game pages did not become live."
            exit 1
          fi
      - name: Republish deferred news after production pages are live
        if: steps.news_pages.outputs.all_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-pipeline.yml --ref staging -f force=true
      - name: Preserve lifecycle queue and quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/parser-runs/home-feed-hydration.json
            data/content-pipeline/status.json
            data/content-pipeline/queue.json
            data/content-pipeline/execution-plan.json
            data/content-pipeline/execution-log.json
            data/content-pipeline/catalog-enrichment-queue.json
            data/content-pipeline/catalog-enrichment-log.json
            data/content-pipeline/franchise-queue.json
            data/quality-control
            data/audits/review-publication.json
            data/audits/review-feed-materialization.json
            tmp/news-game-page-plan.json
            tmp/news-production-materialization.json
          if-no-files-found: warn
          retention-days: 14
