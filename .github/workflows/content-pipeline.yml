name: Maintain Игропоиск game lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [staging]
    paths:
      - 'scripts/hydrate-live-home-feeds.mjs'
      - 'scripts/hydrate-game-page-assembly-queue.mjs'
      - 'scripts/ack-game-page-assembly-queue.mjs'
      - 'scripts/test-game-page-assembly-queue.mjs'
      - 'scripts/orchestrate-content.mjs'
      - 'scripts/run-content-pipeline.mjs'
      - 'scripts/run-game-catalog-enrichment.mjs'
      - 'scripts/materialize-catalog-game-data.mjs'
      - 'scripts/materialize-page-editorial.mjs'
      - 'scripts/finalize-game-page-publication.mjs'
      - 'scripts/validate-game-page-publication-state.mjs'
      - 'scripts/validate-game-page-module-integrity.mjs'
      - 'scripts/discover-game-sources-web.mjs'
      - 'scripts/discover-game-publication-hubs.mjs'
      - 'scripts/collect-game-sources.mjs'
      - 'scripts/validate-game-page-content.mjs'
      - 'scripts/prepare-guide-research.mjs'
      - 'scripts/build-game-page.mjs'
      - 'scripts/build-game-page-basic.mjs'
      - 'scripts/materialize-green-game-page.mjs'
      - 'scripts/canonicalize-editorial-game-id.mjs'
      - 'scripts/repair-public-catalog-game-ids.mjs'
      - 'scripts/materialize-review-publication-feed.mjs'
      - 'scripts/prepare-review-research.mjs'
      - 'scripts/calculate-ratings-from-research.mjs'
      - 'scripts/synthesize-review-adaptive.mjs'
      - 'scripts/quality-control-loop.mjs'
      - 'scripts/validate-game-media-quality.mjs'
      - 'scripts/build-similarity-index.mjs'
      - 'scripts/enrich-game-relations.mjs'
      - 'scripts/audit-review-publication.mjs'
      - 'scripts/validate-automation-publish-diff.mjs'
      - 'scripts/lib/game-page-assembly-queue.mjs'
      - 'scripts/lib/yandex-object-storage.mjs'
      - 'scripts/lib/free-editorial-ai.mjs'
      - 'scripts/lib/editorial-game-registry-adapter.mjs'
      - 'scripts/lib/system-game-registry-adapter.mjs'
      - 'config/content-pipeline.json'
      - 'config/game-page-quality-v2.json'
      - 'config/game-page-module.manifest.json'
      - 'config/home-feeds-storage.json'
      - 'docs/GAME_PAGE_MODULE_STABLE.md'
      - '.github/workflows/content-pipeline.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-lifecycle-staging
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EDITORIAL_AI_PROVIDER_ORDER: openrouter,gigachat,gemini,groq,ollama
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_EDITORIAL_MODEL: moonshotai/kimi-k2.6:free
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_EDITORIAL_MODEL: GigaChat-3-Ultra
      GIGACHAT_EDITORIAL_FALLBACK_MODEL: GigaChat-2-Max
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EDITORIAL_MODEL: gemini-2.5-pro
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_EDITORIAL_MODEL: qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lifecycle scripts
        run: |
          node --check scripts/hydrate-live-home-feeds.mjs
          node --check scripts/hydrate-game-page-assembly-queue.mjs
          node --check scripts/ack-game-page-assembly-queue.mjs
          node --check scripts/orchestrate-content.mjs
          node --check scripts/run-content-pipeline.mjs
          node --check scripts/run-game-catalog-enrichment.mjs
          node --check scripts/materialize-catalog-game-data.mjs
          node --check scripts/materialize-page-editorial.mjs
          node --check scripts/finalize-game-page-publication.mjs
          node --check scripts/validate-game-page-publication-state.mjs
          node --check scripts/validate-game-page-module-integrity.mjs
          node --check scripts/discover-game-sources-web.mjs
          node --check scripts/discover-game-publication-hubs.mjs
          node --check scripts/collect-game-sources.mjs
          node --check scripts/validate-game-page-content.mjs
          node --check scripts/prepare-guide-research.mjs
          node --check scripts/build-game-page.mjs
          node --check scripts/build-game-page-basic.mjs
          node --check scripts/materialize-green-game-page.mjs
          node --check scripts/canonicalize-editorial-game-id.mjs
          node --check scripts/repair-public-catalog-game-ids.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/prepare-review-research.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/synthesize-review-adaptive.mjs
          node --check scripts/quality-control-loop.mjs
          node --check scripts/validate-game-media-quality.mjs
          node --check scripts/build-similarity-index.mjs
          node --check scripts/enrich-game-relations.mjs
          node --check scripts/validate-automation-publish-diff.mjs
          node --check scripts/materialize-review-publication-feed.mjs
          node --check scripts/audit-review-publication.mjs
          node --check scripts/lib/game-page-assembly-queue.mjs
          node --check scripts/lib/yandex-object-storage.mjs
          node --check scripts/lib/free-editorial-ai.mjs
          node --check scripts/lib/game-registry.mjs
          node --check scripts/lib/game-registry-migration.mjs
          node --check scripts/lib/game-registry-page-sections.mjs
          node --check scripts/lib/editorial-game-registry-adapter.mjs
          node --check scripts/lib/system-game-registry-adapter.mjs
          node --check game/_shared/game-page-materialized-data.js
          node scripts/test-game-page-assembly-queue.mjs
      - name: Require complete game page assembly module
        run: node scripts/validate-game-page-module-integrity.mjs
      - name: Detect zero-host editorial provider
        id: editorial_ai
        shell: bash
        run: |
          if [ -n "${OPENROUTER_API_KEY}${GIGACHAT_CREDENTIALS}${GEMINI_API_KEY}${GROQ_API_KEY}" ]; then
            echo "cloud=true" >> "$GITHUB_OUTPUT"
            echo "Cloud editorial provider configured; local Ollama fallback will not be started."
          else
            echo "cloud=false" >> "$GITHUB_OUTPUT"
            echo "No cloud editorial credentials found; enabling local Ollama fallback."
          fi
      - name: Cache local Qwen fallback
        if: steps.editorial_ai.outputs.cloud != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v1-${{ runner.os }}
      - name: Start local Qwen fallback only when no zero-host provider is configured
        if: steps.editorial_ai.outputs.cloud != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b
          echo "OLLAMA_BASE_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          echo "OLLAMA_EDITORIAL_MODEL=qwen2.5:3b" >> "$GITHUB_ENV"
          echo "OLLAMA_EDITORIAL_TIMEOUT_MS=240000" >> "$GITHUB_ENV"
          echo "FREE_EDITORIAL_AI_ENABLED=1" >> "$GITHUB_ENV"
      - name: Hydrate current Popular and Releases snapshots from Object Storage
        run: node scripts/hydrate-live-home-feeds.mjs
      - name: Hydrate temporary game-page assembly queue
        continue-on-error: true
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: node scripts/hydrate-game-page-assembly-queue.mjs
      - name: Repair public catalog canonical identities
        run: node scripts/repair-public-catalog-game-ids.mjs
      - name: Restore only green identity-safe publication links before planning new work
        run: node scripts/materialize-review-publication-feed.mjs
      - name: Materialize and enrich the visible game catalog
        run: node scripts/run-game-catalog-enrichment.mjs
        env:
          CATALOG_RELATION_BATCH: '8'
          CATALOG_REVIEW_BATCH: '6'
          CATALOG_GUIDE_BATCH: '8'
      - name: Build canonical registry and semantic work queue
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Build selected game pages and revise red work until green
        run: node scripts/run-content-pipeline.mjs
      - name: Materialize newly green reviews into runtime feed
        run: node scripts/materialize-review-publication-feed.mjs
      - name: Recalculate lifecycle state
        if: always()
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Audit actual review publication state
        if: always()
        run: node scripts/audit-review-publication.mjs
      - name: Stage isolated lifecycle and revision state
        run: |
          paths=(
            data/content-pipeline
            data/quality-control
            data/franchises
            data/similarity
            data/guides
            data/reviews
            data/parser-output
            data/parser-runs
            data/drafts
            data/page-editorial
            data/game-content
            data/catalog-visible.json
            data/research
            data/ratings
            data/media-candidates
            data/articles
            data/article-drafts
            data/article-media
            game
            article
          )
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          if ! git diff --cached --quiet; then
            node scripts/validate-automation-publish-diff.mjs --profile content-pipeline
          fi
      - name: Validate complete candidate and retained revision state
        if: success()
        run: |
          if git diff --cached --quiet; then exit 0; fi
          node scripts/validate-game-v3.mjs
          node scripts/validate-game-media-quality.mjs
          node scripts/audit-review-publication.mjs
          node scripts/validate-editorial-pipeline.mjs
          node scripts/validate-production-boundaries.mjs
          node scripts/validate-top-250.mjs
          python3 scripts/enforce_layout_contract.py --check
          git diff --check
          git add -A -- data/quality-control data/audits
          node scripts/validate-automation-publish-diff.mjs --profile content-pipeline
      - name: Open and merge isolated lifecycle PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "No lifecycle or revision-state changes."
            exit 0
          fi
          branch="automation/game-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Build and revise queued game lifecycle output"
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base staging \
            --head "$branch" \
            --title "Automated game lifecycle ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --body "Autonomous game lifecycle output. Page assembly is draft-first and publication is green-only: canonical editorial, source corpus, content and media must all pass before the public catalog or page shell is materialized. Red work remains revision state and never replaces the current public page. Game-page editorial and relation enrichment use the zero-host editorial provider router when credentials are configured, with local Qwen/Ollama only as a no-credentials fallback; no paid AI API is required for page publication.")"
          gh pr merge "$pr_url" --merge --delete-branch
      - name: Acknowledge temporary requests only after their production pages exist
        if: always()
        continue-on-error: true
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
          GAME_PAGE_ASSEMBLY_PRODUCTION_REF: origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          node scripts/ack-game-page-assembly-queue.mjs
      - name: Preserve lifecycle queue and quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/game-page-assembly-inbox.json
            tmp/game-page-assembly-queue-ack.json
            data/parser-runs/home-feed-hydration.json
            data/content-pipeline/status.json
            data/content-pipeline/queue.json
            data/content-pipeline/execution-plan.json
            data/content-pipeline/execution-log.json
            data/content-pipeline/catalog-enrichment-queue.json
            data/content-pipeline/catalog-enrichment-log.json
            data/content-pipeline/franchise-queue.json
            data/quality-control
            data/page-editorial
            data/audits/review-publication.json
            data/audits/review-feed-materialization.json
          if-no-files-found: warn
          retention-days: 14
