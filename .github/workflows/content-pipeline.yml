name: Maintain Игропоиск content

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline-staging
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pipeline scripts
        run: |
          node --check scripts/orchestrate-content.mjs
          node --check scripts/run-content-pipeline.mjs
          node --check scripts/build-game-page.mjs
          node --check scripts/build-game-page-from-registry.mjs
          node --check scripts/build-top-250.mjs
          node --check scripts/materialize-top-250-game-pages.mjs
          node --check scripts/validate-top-250.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/validate-automation-publish-diff.mjs
          node --check scripts/lib/game-registry.mjs
          node --check scripts/lib/game-registry-migration.mjs
          node --check scripts/lib/game-registry-page-sections.mjs
          node --check scripts/lib/system-game-registry-adapter.mjs
      - name: Build registry and execution plan
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Materialize canonical Top-250 game pages
        run: |
          node scripts/build-top-250.mjs
          node scripts/materialize-top-250-game-pages.mjs
          node scripts/build-top-250.mjs
          node scripts/materialize-top-250-game-pages.mjs
          node scripts/build-top-250.mjs
          node scripts/validate-top-250.mjs
          node scripts/orchestrate-content.mjs --finalize
      - name: Build selected pages and reviews
        run: node scripts/run-content-pipeline.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5' }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-5' }}
      - name: Recalculate final statuses
        if: always()
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Validate current public game structure
        if: always()
        run: |
          if [ -f scripts/validate-game-v3.mjs ]; then node scripts/validate-game-v3.mjs; fi
      - name: Stage and validate isolated pipeline results
        run: |
          paths=(
            data/content-pipeline
            data/game-registry
            data/parser-runs
            data/parser-output
            data/drafts
            data/game-content
            data/catalog-visible.json
            data/top-250
            data/research
            data/reviews
            data/ratings
            data/media-candidates
            data/articles
            data/article-drafts
            data/article-media
            game
            article
          )
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          node scripts/validate-automation-publish-diff.mjs --profile content-pipeline
      - name: Commit pipeline results to staging
        run: |
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Maintain game pages and reviews on staging"
            git pull --rebase origin staging
            git push origin HEAD:staging
          fi
