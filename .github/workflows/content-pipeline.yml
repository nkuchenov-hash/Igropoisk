name: Maintain Игропоиск game lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-lifecycle-staging
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lifecycle scripts
        run: |
          node --check scripts/orchestrate-content.mjs
          node --check scripts/run-content-pipeline.mjs
          node --check scripts/build-game-page.mjs
          node --check scripts/build-game-page-from-registry.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/validate-automation-publish-diff.mjs
          node --check scripts/audit-review-publication.mjs
          node --check scripts/lib/game-registry.mjs
          node --check scripts/lib/game-registry-migration.mjs
          node --check scripts/lib/game-registry-page-sections.mjs
          node --check scripts/lib/system-game-registry-adapter.mjs
      - name: Build canonical registry and work queue
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Detect AI research capability
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "OpenAI research capability is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; lifecycle queue will be preserved without fabricating game pages or reviews."
          fi
      - name: Build selected pages and reviews
        if: steps.ai.outputs.available == 'true'
        run: node scripts/run-content-pipeline.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-5' }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-5' }}
      - name: Recalculate lifecycle state
        if: always()
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Audit actual review publication state
        if: always()
        run: node scripts/audit-review-publication.mjs
      - name: Validate generated game structure
        if: steps.ai.outputs.available == 'true'
        run: |
          if [ -f scripts/validate-game-v3.mjs ]; then node scripts/validate-game-v3.mjs; fi
          paths=(
            data/content-pipeline
            data/game-registry
            data/parser-runs
            data/parser-output
            data/drafts
            data/game-content
            data/catalog-visible.json
            data/research
            data/reviews
            data/ratings
            data/media-candidates
            data/articles
            data/article-drafts
            data/article-media
            game
            article
          )
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          node scripts/validate-automation-publish-diff.mjs --profile content-pipeline
      - name: Open isolated lifecycle PR instead of writing to staging
        if: steps.ai.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "No validated lifecycle content changes."
            exit 0
          fi
          branch="automation/game-lifecycle-${GITHUB_RUN_ID}"
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Build queued game pages and reviews"
          git push origin "$branch"
          gh pr create \
            --base staging \
            --head "$branch" \
            --title "Automated game lifecycle ${GITHUB_RUN_ID}" \
            --body "Automated isolated game lifecycle output. Generated from the canonical queue; direct bot writes to staging are forbidden. Merge only after repository and semantic publication checks pass."
      - name: Preserve lifecycle queue and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-lifecycle-${{ github.run_id }}
          path: |
            data/content-pipeline/status.json
            data/content-pipeline/queue.json
            data/content-pipeline/execution-plan.json
            data/content-pipeline/execution-log.json
            data/audits/review-publication.json
          if-no-files-found: warn
          retention-days: 14
