name: Temporary fix DOOM video background loop
on:
  push:
    branches:
      - tmp/fix-doom-video-loop
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply video loop patch
        run: python3 tmp/fix_doom_video_loop.py
      - name: Verify layout contract
        run: python3 scripts/enforce_layout_contract.py --check
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/doom-dark-ages-alt/index.html
          git commit -m "Fix DOOM background video endless loading"
          git push origin HEAD:main