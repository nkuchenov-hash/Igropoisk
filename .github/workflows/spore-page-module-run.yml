# Acceptance run for one ordinary game through the universal Game Page module.
# Spore is only the input fixture; no Spore-specific editorial text or game facts are hard-coded here.
name: Spore complete page-module run

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/spore-page-module-run.yml'
      - 'scripts/collect-game-sources.mjs'
      - 'scripts/build-game-source-knowledge.mjs'
      - 'scripts/build-game-page.mjs'
      - 'scripts/build-game-page-baseline-editorial.mjs'
      - 'scripts/validate-game-page-content.mjs'
      - 'scripts/quality-control-loop.mjs'
      - 'scripts/lib/game-page-editorial-ai.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  models: read

concurrency:
  group: spore-page-module-acceptance
  cancel-in-progress: true

jobs:
  build-spore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse structured Spore data
        run: node scripts/parse-game-data.mjs spore 17390 Spore

      - name: Register Spore in the canonical Game Registry
        run: |
          node --input-type=module - <<'NODE'
          import {migrateRepository,writeMigrationArtifacts} from './scripts/lib/game-registry-migration.mjs';
          const result=migrateRepository(process.cwd());
          writeMigrationArtifacts(process.cwd(),result);
          const entity=Object.values(result.registry.games||{}).find(g=>g.identity?.slug?.value==='spore');
          if(!entity) throw new Error('Spore was not registered after parser migration');
          if(String(entity.externalIds?.steamAppId||'')!=='17390') throw new Error(`Wrong Spore identity: ${entity.externalIds?.steamAppId||'missing Steam id'}`);
          console.log(JSON.stringify({game_id:entity.id,slug:entity.identity.slug.value,steam:entity.externalIds?.steamAppId},null,2));
          NODE

      - name: Create the base page through the universal Game Page creator
        env:
          GAME_CREATOR_SOURCE: acceptance
          GAME_SOURCE_URL: https://store.steampowered.com/app/17390/
        run: node scripts/ensure-game-page.mjs spore

      - name: Persist canonical identity so later rebuilds do not depend on this runner
        run: |
          set -euo pipefail
          git add -A -- data/game-registry data/parser-output/spore.json
          if git diff --cached --quiet; then echo 'Canonical Spore identity already exists on staging.'; exit 0; fi
          branch="automation/spore-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Register Spore for universal Game Page creation"
          git push origin "$branch"
          pr_url="$(gh pr create --base staging --head "$branch" --title "Register Spore for Game Page creation" --body "Canonical identity produced by the normal parser/registry path before the universal page module continues enrichment.")"
          gh pr merge "$pr_url" --merge --delete-branch

      - name: Refresh complete source and rating evidence
        run: |
          node scripts/prepare-review-research.mjs spore
          node scripts/recover-historical-review-scores.mjs spore
          node scripts/calculate-ratings-from-research.mjs spore
          node scripts/collect-game-sources.mjs spore

      - name: Refresh the universal page plan
        run: node scripts/orchestrate-content.mjs --finalize

      - name: Run complete source-grounded Game Page cycle
        env:
          GAME_TARGET_SLUG: spore
          EDITORIAL_AI_ENABLED: 'false'
        run: node scripts/run-content-pipeline.mjs

      - name: Require the finished source-grounded page to be green
        run: |
          node scripts/validate-game-shells.mjs spore
          node scripts/validate-pre-review-materials.mjs spore
          node - <<'NODE'
          const fs=require('fs');const must=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const page=must('data/quality-control/page-spore-control.json');
          const media=must('data/quality-control/game-page-spore.json');
          const content=must('data/quality-control/game-page-content-spore.json');
          const sources=must('data/game-sources/spore.json');
          const sourceContent=must('data/game-source-content/spore.json');
          const knowledge=must('data/game-knowledge/spore.json');
          const editorial=must('data/page-editorial/spore.json');
          const draft=must('data/drafts/spore.json');
          const ratings=must('data/ratings/spore.json');
          if(page.green!==true) throw new Error(`page QC is red: ${(page.comments||[]).join(' | ')}`);
          if(media.status!=='green' && media.green!==true) throw new Error(`media QC=${media.status||'red'}`);
          if(content.status!=='green') throw new Error(`content QC=${content.status||'red'}`);
          if(sources.discovery?.complete!==true) throw new Error('source scan incomplete');
          if(sourceContent.readable_sources<3) throw new Error(`readable source content=${sourceContent.readable_sources}`);
          if(knowledge.status!=='green' || (knowledge.defining_claims||[]).length<4) throw new Error('source-grounded game knowledge is not green');
          if(!String(editorial.generation_mode||'').startsWith('source_grounded_')) throw new Error(`wrong editorial mode: ${editorial.generation_mode}`);
          if(!String(draft.editorial?.editorial_mode||'').startsWith('source_grounded_')) throw new Error(`wrong draft editorial mode: ${draft.editorial?.editorial_mode}`);
          if(ratings.status!=='green'||!Number.isFinite(Number(ratings.calculation?.score_10))) throw new Error('professional rating is not green');
          if(!fs.existsSync('game/spore/index.html')) throw new Error('public Spore page shell missing');
          console.log(JSON.stringify({title:draft.identity?.title,source_content:sourceContent.readable_sources,knowledge_claims:knowledge.defining_claims.length,game_essence:knowledge.game_essence,editorial_mode:draft.editorial.editorial_mode,short_description:draft.editorial.short_description,integrated_description:draft.editorial.integrated_description,professional_reviews:sources.counts?.professional_reviews,score_sources:ratings.calculation?.source_count,rating:ratings.calculation?.score_10,screenshots:(draft.media?.screenshots||[]).length,page_qc:page.status,media_qc:media.status,content_qc:content.status},null,2));
          NODE
          git diff --check

      - name: Publish verified Spore page to staging
        id: staging_publish
        env:
          GAME_TARGET_SLUG: spore
          GAME_PAGE_STAGING_REPORT: ${{ runner.temp }}/spore-staging.json
        run: |
          set -euo pipefail
          node scripts/publish-game-page-staging-conflict-safe.mjs spore
          STAGING_SHA="$(node -p "require(process.env.GAME_PAGE_STAGING_REPORT).staging_sha || ''")"
          test -n "$STAGING_SHA"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish the same green page to production
        id: production
        env:
          GAME_TARGET_SLUG: spore
          STAGING_SHA: ${{ steps.staging_publish.outputs.staging_sha }}
          GAME_PAGE_PRODUCTION_REPORT: ${{ runner.temp }}/spore-production.json
        run: |
          set -euo pipefail
          node scripts/publish-green-game-page-production.mjs spore "$STAGING_SHA"
          PRODUCTION_SHA="$(node -p "require(process.env.GAME_PAGE_PRODUCTION_REPORT).production_sha || ''")"
          test -n "$PRODUCTION_SHA"
          echo "production_sha=$PRODUCTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact production snapshot
        env:
          PRODUCTION_SHA: ${{ steps.production.outputs.production_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
          process.stdout.write(JSON.stringify({event_type:'production-pages',client_payload:{target_branch:'main',mode:'production',production_sha:process.env.PRODUCTION_SHA,sha:process.env.PRODUCTION_SHA,source:'spore-universal-page-module-acceptance'}}));
          NODE

      - name: Verify the live Spore page and its visible professional materials
        run: |
          npm install --no-save puppeteer-core@24
          node scripts/verify-live-game-page-pre-review.mjs spore

      - name: Verify live source-grounded editorial artifacts
        run: |
          set -euo pipefail
          BASE='https://nkuchenov-hash.github.io/Igropoisk'
          for i in $(seq 1 30); do
            if curl -fsSL "$BASE/data/game-knowledge/spore.json" -o /tmp/knowledge.json && curl -fsSL "$BASE/data/drafts/spore.json" -o /tmp/draft.json; then
              if node - <<'NODE'
          const fs=require('fs');const k=JSON.parse(fs.readFileSync('/tmp/knowledge.json'));const d=JSON.parse(fs.readFileSync('/tmp/draft.json'));
          if(k.status!=='green'||(k.defining_claims||[]).length<4)process.exit(1);
          if(!String(d.editorial?.editorial_mode||'').startsWith('source_grounded_'))process.exit(1);
          if(String(d.editorial?.integrated_description||'').length<350)process.exit(1);
          console.log(JSON.stringify({knowledge_claims:k.defining_claims.length,game_essence:k.game_essence,editorial_mode:d.editorial.editorial_mode,integrated_description:d.editorial.integrated_description},null,2));
          NODE
              then exit 0; fi
            fi
            sleep 5
          done
          echo 'Live source-grounded editorial did not converge' >&2
          exit 1

      - name: Preserve the acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-page-module-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/parser-output/spore.json
            data/drafts/spore.json
            data/game-sources/spore.json
            data/game-source-content/spore.json
            data/game-knowledge/spore.json
            data/page-editorial/spore.json
            data/reviews/spore.json
            data/ratings/spore.json
            data/research/spore-source-matrix.json
            data/quality-control/*spore*.json
            data/parser-runs/*spore*.json
            game/spore/index.html
          if-no-files-found: warn
          retention-days: 14
