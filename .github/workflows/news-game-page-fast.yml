name: Queue news-required game pages

on:
  workflow_dispatch:
    inputs:
      news_game_requests_b64:
        description: Base64 JSON of verified games whose pages are required by news
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: news-game-page-requests
  cancel-in-progress: false

jobs:
  queue-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready_count: ${{ steps.request.outputs.ready_count }}
      queued_count: ${{ steps.request.outputs.queued_count }}
      failed_count: ${{ steps.request.outputs.failed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require canonical Page Assembly contract
        run: |
          node --check scripts/ensure-game-page.mjs
          node --check scripts/run-news-game-page-fast.mjs
          node --check scripts/build-game-page-basic.mjs
          node scripts/validate-game-page-module-integrity.mjs

      - name: Resolve games and enqueue Page Assembly
        id: request
        env:
          NEWS_GAME_REQUESTS_B64: ${{ inputs.news_game_requests_b64 }}
        run: |
          node scripts/run-news-game-page-fast.mjs
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('tmp/news-game-page-fast.json','utf8'));
          process.stdout.write(`ready_count=${Number(report.ready_count||0)}\nqueued_count=${Number(report.queued_count||0)}\nfailed_count=${Number(report.failed_count||0)}\n`);
          NODE
          cat tmp/news-game-page-fast.json

      - name: Stage request state only
        id: staged
        run: |
          paths=(data/game-registry data/parser-output data/parser-runs data/drafts data/game-content data/content-pipeline)
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ ${#existing[@]} -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          # News is forbidden from directly publishing a Game Page.
          if ! git diff --cached --quiet -- data/catalog-visible.json game data/page-editorial data/game-sources data/quality-control; then
            echo "News adapter attempted to cross the Page Assembly publication boundary."
            exit 1
          fi
          git diff --check
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Merge queued Page Assembly requests into staging
        if: steps.staged.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/news-page-requests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Queue news-required Game Page assembly"
          git push origin "$branch"
          pr_url="$(gh pr create --base staging --head "$branch" --title "Queue news-required Game Pages ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --body "News only resolves canonical game identities and queues Page Assembly. It cannot create catalog entries, public shells or public_ready state. Publication remains owned exclusively by the green-only Game Page finalizer.")"
          gh pr merge "$pr_url" --merge --delete-branch

      - name: Start canonical lifecycle for queued pages
        if: steps.request.outputs.queued_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run content-pipeline.yml --repo "$GITHUB_REPOSITORY" --ref staging

      - name: Republish deferred news when every requested page was already finalized
        if: steps.request.outputs.queued_count == '0' && steps.request.outputs.failed_count == '0' && steps.request.outputs.ready_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-pipeline.yml --repo "$GITHUB_REPOSITORY" --ref staging -f force=true

      - name: Preserve request diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-game-page-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/news-game-page-fast.json
            tmp/news-game-page-plan.json
          if-no-files-found: warn
          retention-days: 14
