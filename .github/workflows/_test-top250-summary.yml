name: Test Top-250 summary fallback
on:
  push:
    branches: [fix/top250-summary-fallback]
    paths: [.github/workflows/_test-top250-summary.yml]
permissions:
  contents: read
concurrency:
  group: top250-summary-canary
  cancel-in-progress: true
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top250-summary-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce canonical Doom review state
        env:
          OPENAI_API_KEY: ''
        run: |
          node scripts/recover-canonical-review-backlog.mjs --only doom-the-dark-ages --concurrency 1 --timeout-ms 240000 || true
          node - <<'NODE'
          const fs=require('fs');
          const slug='doom-the-dark-ages';
          const review=JSON.parse(fs.readFileSync(`data/reviews/${slug}.json`,'utf8'));
          const article=JSON.parse(fs.readFileSync(`data/articles/${slug}.json`,'utf8'));
          const score=Number(review.review_score?.calculation?.score_10);
          if(review.publication_gate?.status!=='green'||review.review_score?.status!=='green'||!Number.isFinite(score))process.exit(2);
          article.score=score;
          article.publication_status='published';
          article.quality_status='green';
          fs.mkdirSync('data/article-drafts',{recursive:true});
          fs.writeFileSync(`data/articles/${slug}.json`,JSON.stringify(article,null,2)+'\n');
          fs.writeFileSync(`data/article-drafts/${slug}.json`,JSON.stringify(article,null,2)+'\n');
          NODE
          node scripts/render-review-pages.mjs doom-the-dark-ages
      - name: Build and validate Top-250 summary fallback
        run: |
          node scripts/build-top-250.mjs
          node scripts/validate-top-250.mjs
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('data/top-250/current.json','utf8'));
          const row=t.ranking.find(x=>x.slug==='doom-the-dark-ages');
          console.log(JSON.stringify({count:t.count,row},null,2));
          if(!row||!String(row.summary||'').trim())process.exit(2);
          NODE
