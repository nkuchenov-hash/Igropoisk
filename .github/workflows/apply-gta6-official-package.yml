name: Apply GTA VI official package resolver

on:
  push:
    branches:
      - fix-gta6-popular-ranking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gta6-popular-ranking
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add reusable official artwork package resolver
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('config/parsers/popular.json')
          config = json.loads(config_path.read_text())
          for row in config.get('global_candidates', []):
              if row.get('slug') == 'grand-theft-auto-vi':
                  row['official_art_package'] = {
                      'url': 'https://media.rockstargames.com/VI/downloads/artwork_wallpapers/GTAVI_Artwork_Wallpapers.zip',
                      'member': 'Official_Cover_Art/Official_Cover_Art_portrait.jpg',
                      'source_page': 'https://www.rockstargames.com/VI/media/artwork-wallpapers'
                  }
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')

          schedule_path = Path('config/parsers/schedule.json')
          schedule = json.loads(schedule_path.read_text())
          for row in schedule.get('parsers', []):
              if row.get('id') != 'popular':
                  continue
              marker = 'node scripts/resolve-global-popular-art.mjs'
              addition = marker + ' && node scripts/resolve-official-popular-packages.mjs'
              if addition not in row['command']:
                  row['command'] = row['command'].replace(marker, addition)
          schedule_path.write_text(json.dumps(schedule, ensure_ascii=False, indent=2) + '\n')

          test_path = Path('scripts/test-gta6-popular-rules.mjs')
          test = test_path.read_text()
          needle = "if (!gta6 || !(gta6.aliases || []).includes('GTA 6')) throw new Error('GTA VI is not in the global candidate universe.');\n"
          extra = needle + "if (!gta6.official_art_package?.url || !gta6.official_art_package?.member) throw new Error('GTA VI official artwork package is not configured.');\n"
          if "official artwork package is not configured" not in test:
              if needle not in test:
                  raise SystemExit('GTA VI test insertion point not found')
              test = test.replace(needle, extra, 1)
          test_path.write_text(test)

          Path('scripts/resolve-official-popular-packages.mjs').write_text(r"""import fs from 'node:fs';
import path from 'node:path';
import os from 'node:os';
import { execFileSync } from 'node:child_process';
import { imageSize } from 'image-size';

const root = process.cwd();
const read = file => JSON.parse(fs.readFileSync(path.join(root, file), 'utf8'));
const write = (file, value) => fs.writeFileSync(path.join(root, file), `${JSON.stringify(value, null, 2)}\n`);
const config = read('config/parsers/popular.json');
const rankingPath = 'data/popular/current.json';
const coversPath = 'data/popular/covers.json';
const data = read(rankingPath);
const covers = fs.existsSync(path.join(root, coversPath)) ? read(coversPath) : {};
const candidates = new Map((config.global_candidates || [])
  .filter(item => item.official_art_package?.url && item.official_art_package?.member)
  .map(item => [item.slug, item]));

const dimensions = bytes => {
  try {
    const result = imageSize(bytes);
    return { width: Number(result.width || 0), height: Number(result.height || 0) };
  } catch {
    return { width: 0, height: 0 };
  }
};

let resolved = 0;
const failures = [];
for (const item of data.ranking || []) {
  const configured = candidates.get(item.slug);
  if (!configured) continue;
  const pkg = configured.official_art_package;
  const temporary = path.join(os.tmpdir(), `igropoisk-${item.slug}-${process.pid}.zip`);
  try {
    const response = await fetch(pkg.url, {
      signal: AbortSignal.timeout(45000),
      headers: { 'user-agent': 'Mozilla/5.0 IgropoiskOfficialArtResolver/1.0' }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const bytes = Buffer.from(await response.arrayBuffer());
    if (bytes.length < 100000) throw new Error('Official artwork package is unexpectedly small');
    fs.writeFileSync(temporary, bytes);
    const image = execFileSync('unzip', ['-p', temporary, pkg.member], {
      maxBuffer: 20 * 1024 * 1024
    });
    const size = dimensions(image);
    if (image.length < 40000 || size.width < 500 || size.height < 700 || size.height / size.width < 1.2) {
      throw new Error(`Official portrait failed dimensions: ${size.width}x${size.height}`);
    }
    const relative = `assets/covers/popular/${item.slug}.jpg`;
    fs.mkdirSync(path.dirname(path.join(root, relative)), { recursive: true });
    fs.writeFileSync(path.join(root, relative), image);
    item.image = relative;
    item.image_candidates = [relative];
    item.cover_source = pkg.source_page || pkg.url;
    item.cover_verified = true;
    item.cover_width = size.width;
    item.cover_height = size.height;
    item.cover_kind = 'official-publisher-package';
    covers[item.slug] = {
      local: relative,
      source: pkg.source_page || pkg.url,
      source_package: pkg.url,
      package_member: pkg.member,
      resolved_at: new Date().toISOString(),
      width: size.width,
      height: size.height,
      quality: 'verified-official-publisher-art',
      identity_verified: true
    };
    resolved += 1;
  } catch (error) {
    failures.push({ slug: item.slug, error: error.message });
  } finally {
    fs.rmSync(temporary, { force: true });
  }
}

write(rankingPath, data);
write(coversPath, covers);
console.log(JSON.stringify({ resolved, failures }, null, 2));
if (failures.length) process.exitCode = 1;
""")

          Path('.github/workflows/gta6-art-diagnostic.yml').unlink(missing_ok=True)
          PY

          node --check scripts/resolve-official-popular-packages.mjs
          node --check scripts/test-gta6-popular-rules.mjs
          node scripts/test-gta6-popular-rules.mjs

      - name: Commit resolver
        run: |
          git config user.name "igropoisk-maintenance[bot]"
          git config user.email "igropoisk-maintenance[bot]@users.noreply.github.com"
          git add config/parsers/popular.json config/parsers/schedule.json scripts/test-gta6-popular-rules.mjs scripts/resolve-official-popular-packages.mjs .github/workflows/gta6-art-diagnostic.yml
          git commit -m "Брать обложку GTA VI из официального пакета Rockstar"
          git push origin HEAD:fix-gta6-popular-ranking
