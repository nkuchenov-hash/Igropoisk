name: Build review score adapters
on:
  push:
    branches: [fix/review-score-source-adapters]
    paths: [.github/workflows/_build-review-score-adapters.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-score-source-adapters
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add verified source-specific score patterns
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='config/parsers/review-source-registry.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const set=(id,score)=>{const s=r.sources.find(x=>x.id===id);if(!s)throw new Error(`missing ${id}`);s.review=s.review||{};s.review.score={...(s.review.score||{}),policy:'explicit_only',...score};};
          set('game-revolution',{default_scale:10,patterns:[{pattern:'<div\\s+class=["\\\'][^"\\\']*xe-review-reports__rating[^"\\\']*["\\\'][^>]*>\\s*<p[^>]*>\\s*([0-9]+(?:\\.[0-9]+)?)\\s*</p>',html:true,score_group:1,scale:10}]});
          set('worthplaying',{default_scale:10,patterns:[{pattern:'<strong[^>]*>\\s*Score:\\s*([0-9]+(?:\\.[0-9]+)?)\\s*/\\s*(10)\\s*</strong>',html:true,score_group:1,scale_group:2}]});
          set('gry-online',{default_scale:10,patterns:[{pattern:'oce-game-box[^>]*oce-gre[^>]*>[\\s\\S]{0,300}?oce-rate[^>]*>\\s*([0-9]+(?:[.,][0-9]+)?)\\s*</div>[\\s\\S]{0,350}?<p[^>]*>\\s*GRYOnline\\s*</p>',html:true,score_group:1,scale:10}]});
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          node scripts/validate-review-source-registry.mjs
          git diff --check
          git config user.name "igropoisk-tools[bot]"
          git config user.email "igropoisk-tools[bot]@users.noreply.github.com"
          git add config/parsers/review-source-registry.json
          git commit -m "Add verified publication score adapters"
          git push origin HEAD:fix/review-score-source-adapters
