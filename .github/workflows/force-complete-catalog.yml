name: Force complete game catalog

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/force-complete-catalog.yml
      - scripts/patch-strict-review-runtime.py
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: force-complete-catalog-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch strict research runtime
        run: python scripts/patch-strict-review-runtime.py
      - name: Build every remaining game through Mafia publication gate
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          node - <<'NODE' > /tmp/queue.txt
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          const complete=g=>fs.existsSync(`game/${g.slug}/index.html`)&&fs.existsSync(`data/articles/${g.slug}.json`)&&fs.existsSync(`article/${g.slug}/index.html`);
          process.stdout.write(catalog.filter(g=>g.slug!=='mafia'&&!complete(g)).map(g=>g.slug).join('\n')+'\n');
          NODE
          : > /tmp/results.tsv
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "=== STRICT BUILD: $slug ==="
            if node scripts/build-complete-review-github-models-v2.mjs "$slug" && node scripts/validate-review-output.mjs "$slug" && node scripts/render-review-pages.mjs "$slug"; then
              printf '%s\tsuccess\n' "$slug" >> /tmp/results.tsv
              git add data "article/$slug"
              git commit -m "Complete strict Mafia-standard article for $slug" || true
              git push origin HEAD:staging
            else
              printf '%s\tblocked\n' "$slug" >> /tmp/results.tsv
              git restore --worktree --staged data article game 2>/dev/null || true
              git clean -fd data article game >/dev/null 2>&1 || true
            fi
          done < /tmp/queue.txt
          cat /tmp/results.tsv
      - name: Materialize and require full catalog coverage
        if: always()
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          node scripts/materialize-catalog-no-api.mjs
          node scripts/canonicalize-all-editorial-game-ids.mjs --write || true
          node -e "const fs=require('fs');const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));const missing=catalog.filter(g=>!(fs.existsSync('game/'+g.slug+'/index.html')&&fs.existsSync('data/articles/'+g.slug+'.json')&&fs.existsSync('article/'+g.slug+'/index.html'))).map(g=>g.slug);const report={generated_at:new Date().toISOString(),total:catalog.length,complete:catalog.length-missing.length,missing};fs.mkdirSync('data/parser-runs',{recursive:true});fs.writeFileSync('data/parser-runs/complete-game-pages-latest.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));"
          git add data game article
          git diff --cached --quiet || git commit -m "Record complete catalog coverage"
          git push origin HEAD:staging
          test "$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/parser-runs/complete-game-pages-latest.json','utf8'));process.stdout.write(String(r.missing.length))")" = "0"
