name: Force complete game catalog

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/force-complete-catalog.yml
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: force-complete-catalog-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand sparse-title media discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-sparse-review-fast.mjs')
          s = p.read_text()
          old = "if(candidates.length<45){const imgs=await Promise.all([`${title} gameplay screenshots`,`${title} official screenshots`,`${title} game screenshot`].map(imageSearch));for(const rows of imgs)for(const u of rows)add(u,'https://www.bing.com/images/search','Web image source',title)}"
          new = "if(candidates.length<90){const imageQueries=[`${title} gameplay screenshots`,`${title} official screenshots`,`${title} game screenshot`,`${title} screenshot gallery`,`${title} press kit screenshots`,`${title} 4k gameplay screenshots`,`${title} PC screenshots`,`${title} PS5 screenshots`,`${title} Xbox screenshots`,`${title} review screenshots`,`${title} trailer screenshots`,`${title} official media gallery`];const imgs=await Promise.all(imageQueries.map(imageSearch));for(const rows of imgs)for(const u of rows)add(u,'https://www.bing.com/images/search','Web image source',title)}"
          if old not in s:
              raise SystemExit('media discovery patch anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Build every remaining filled page
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          node - <<'NODE' > /tmp/queue.txt
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          process.stdout.write(catalog.filter(g=>g.slug!=='mafia'&&!fs.existsSync(`article/${g.slug}/index.html`)).map(g=>g.slug).join('\n')+'\n');
          NODE
          : > /tmp/results.tsv
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "=== COMPLETE BUILD: $slug ==="
            built=0
            if node scripts/build-complete-review-github-models-v2.mjs "$slug"; then
              built=1
            else
              git reset --hard HEAD
              if node scripts/build-sparse-review-fast.mjs "$slug"; then built=1; fi
            fi
            if [ "$built" = "1" ]; then
              node - "$slug" <<'NODE'
          const fs=require('fs');const slug=process.argv[2];const globalSeen=new Set();
          const walk=v=>{if(Array.isArray(v))return v.map(walk).filter(x=>{if(!x||typeof x!=='object'||!x.duplicate_group)return true;if(globalSeen.has(x.duplicate_group))return false;globalSeen.add(x.duplicate_group);return true});if(v&&typeof v==='object')for(const k of Object.keys(v))v[k]=walk(v[k]);return v};
          for(const file of [`data/article-media/${slug}.json`,`data/articles/${slug}.json`,`data/reviews/${slug}.json`]){if(!fs.existsSync(file))continue;globalSeen.clear();const data=JSON.parse(fs.readFileSync(file,'utf8'));fs.writeFileSync(file,JSON.stringify(walk(data),null,2)+'\n')}
          NODE
              if node scripts/validate-review-output.mjs "$slug" && node scripts/render-review-pages.mjs "$slug"; then
                printf '%s\tsuccess\n' "$slug" >> /tmp/results.tsv
                git add data "article/$slug"
                git commit -m "Complete Mafia-standard article for $slug" || true
                git pull --rebase origin staging
                git push origin HEAD:staging
              else
                printf '%s\tblocked\n' "$slug" >> /tmp/results.tsv
                git reset --hard HEAD
              fi
            else
              printf '%s\tblocked\n' "$slug" >> /tmp/results.tsv
              git reset --hard HEAD
            fi
          done < /tmp/queue.txt
          cat /tmp/results.tsv
      - name: Materialize and require full catalog coverage
        if: always()
        run: |
          git config user.name "igropoisk-builder"
          git config user.email "actions@users.noreply.github.com"
          node scripts/materialize-catalog-no-api.mjs
          node scripts/canonicalize-all-editorial-game-ids.mjs --write || true
          node - <<'NODE'
          const fs=require('fs');const catalog=JSON.parse(fs.readFileSync('data/catalog-visible.json','utf8'));
          const missing=catalog.filter(g=>!(fs.existsSync(`game/${g.slug}/index.html`)&&fs.existsSync(`data/articles/${g.slug}.json`)&&fs.existsSync(`article/${g.slug}/index.html`))).map(g=>g.slug);
          const report={generated_at:new Date().toISOString(),total:catalog.length,complete:catalog.length-missing.length,missing};
          fs.mkdirSync('data/parser-runs',{recursive:true});fs.writeFileSync('data/parser-runs/complete-game-pages-latest.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          if(missing.length)process.exit(2);
          NODE
          git add data game article
          git diff --cached --quiet || git commit -m "Complete entire filled game catalog"
          git pull --rebase origin staging
          git push origin HEAD:staging
