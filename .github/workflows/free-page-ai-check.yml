name: Verify free game page AI backend

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/free-page-ai-check.yml'
      - 'scripts/lib/free-editorial-ai.mjs'
      - 'scripts/build-game-page.mjs'

permissions:
  contents: read

jobs:
  verify-free-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate free AI client syntax
        run: |
          node --check scripts/lib/free-editorial-ai.mjs
          node --check scripts/build-game-page.mjs
      - name: Cache Qwen model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v1-${{ runner.os }}
      - name: Start Ollama and install free Qwen
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b
      - name: Verify structured editorial response without paid API
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          OLLAMA_EDITORIAL_MODEL: qwen2.5:3b
          OLLAMA_EDITORIAL_TIMEOUT_MS: '240000'
        run: |
          node --input-type=module <<'NODE'
          import {assertFreeEditorialAI,generateFreeEditorialJSON} from './scripts/lib/free-editorial-ai.mjs';
          const health=await assertFreeEditorialAI();
          const result=await generateFreeEditorialJSON({
            system:'Return only valid JSON.',
            prompt:'Return exactly one JSON object with keys status and paid_api. status must be "ok" and paid_api must be false.',
            temperature:0
          });
          if(result.data?.status!=='ok'||result.data?.paid_api!==false)throw new Error(`Unexpected free AI output: ${JSON.stringify(result.data)}`);
          if(result.provider!=='ollama')throw new Error(`Unexpected provider: ${result.provider}`);
          console.log(JSON.stringify({status:'green',provider:result.provider,model:result.model,paid_api:false,health},null,2));
          NODE
