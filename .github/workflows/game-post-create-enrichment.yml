name: Enrich newly created Игропоиск games

on:
  workflow_dispatch:
  repository_dispatch:
    types: [game-post-create-enrichment]
  workflow_run:
    workflows: ['Fast news game page creation']
    types: [completed]
  push:
    branches: [staging]
    paths:
      - 'scripts/prepare-review-research.mjs'
      - 'scripts/calculate-ratings-from-research.mjs'
      - 'scripts/discover-review-media.mjs'
      - 'scripts/discover-game-videos.mjs'
      - 'scripts/quality-control-loop.mjs'
      - 'scripts/validate-target-game-page.mjs'
      - 'data/content-pipeline/execution-plan.json'
      - 'data/content-pipeline/target-page.json'
      - '.github/workflows/game-post-create-enrichment.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: game-post-create-enrichment-v6
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout staging snapshot
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify enrichment runtime
        run: |
          node --check scripts/orchestrate-content.mjs
          node --check scripts/run-content-pipeline.mjs
          node --check scripts/quality-control-loop.mjs
          node --check scripts/prepare-review-research.mjs
          node --check scripts/calculate-ratings-from-research.mjs
          node --check scripts/discover-review-media.mjs
          node --check scripts/discover-game-videos.mjs
          node --check scripts/validate-target-game-page.mjs
          node --check game/_shared/game-page-review-sources.js
      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          TARGET=false
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.event.head_commit.message }}" == Run\ targeted\ page:* ]] && [ -f data/content-pipeline/target-page.json ]; then
            TARGET=true
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = true ]; then
            SLUG="$(node -p "require('./data/content-pipeline/target-page.json').slug")"
            GAME_ID="$(node -p "require('./data/content-pipeline/target-page.json').game_id")"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "game_id=$GAME_ID" >> "$GITHUB_OUTPUT"
            echo "Targeted page control: $SLUG ($GAME_ID)"
          else
            echo "Normal autonomous enrichment mode"
          fi
      - name: Refresh execution plan
        if: steps.mode.outputs.target != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_AI_ENABLED: 'true'
        run: node scripts/orchestrate-content.mjs --finalize
      - name: Run complete autonomous page enrichment cycle
        if: steps.mode.outputs.target != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_AI_ENABLED: 'true'
        run: node scripts/run-content-pipeline.mjs
      - name: Run isolated target page enrichment
        if: steps.mode.outputs.target == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_AI_ENABLED: 'false'
        run: |
          SLUG="${{ steps.mode.outputs.slug }}"
          GAME_ID="${{ steps.mode.outputs.game_id }}"
          node scripts/prepare-review-research.mjs "$SLUG"
          if [ -f scripts/enrich-review-native-sources.mjs ]; then node scripts/enrich-review-native-sources.mjs "$SLUG"; fi
          node scripts/calculate-ratings-from-research.mjs "$SLUG"
          node scripts/discover-review-media.mjs "$SLUG"
          node scripts/discover-game-videos.mjs "$SLUG"
          node scripts/validate-target-game-page.mjs data/content-pipeline/target-page.json
      - name: Validate generated game shells and material feeds
        if: steps.mode.outputs.target != 'true'
        run: |
          node scripts/validate-game-shells.mjs
          git diff --check
      - name: Validate isolated target only
        if: steps.mode.outputs.target == 'true'
        run: |
          node scripts/validate-target-game-page.mjs data/content-pipeline/target-page.json
          git diff --check
      - name: Publish enrichment snapshot to staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No enrichment changes produced."; exit 0; fi
          git config user.name "igropoisk-content-bot"
          git config user.email "igropoisk-content-bot@users.noreply.github.com"
          BRANCH="automation/post-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Continue game page enrichment ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          git push origin "$BRANCH"
          gh pr create --base staging --head "$BRANCH" --title "Continue game page enrichment" --body "Automated page enrichment: data, existing Media including videos, all discovered review/review-source links and ratings. Игропоиск article synthesis is not a page readiness requirement."
          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&base=staging&state=open" --jq '.[0].number')"
          test -n "$PR"
          gh pr merge "$PR" --merge --delete-branch
