name: Enrich newly created Игропоиск games

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'data/game-enrichment-requests/*.json'
      - 'config/parsers/review-source-registry*.json'
      - 'scripts/ensure-game-page.mjs'
      - 'scripts/materialize-known-series.mjs'
      - 'scripts/enrich-game-media-from-sources.mjs'
      - 'scripts/discover-review-sources-web.mjs'
      - 'scripts/discover-review-sources-web-v14.mjs'
      - 'scripts/discover-review-sources-web-v15.mjs'
      - 'scripts/prepare-post-create-review-research.mjs'
      - 'scripts/lib/review-source-registry.mjs'
      - 'scripts/lib/review-score-extractor.mjs'
      - 'scripts/build-review-bootstrap-local.mjs'
      - 'scripts/materialize-review-publication-feed.mjs'
      - 'scripts/run-game-post-create-enrichment.mjs'
      - 'scripts/publish-game-post-create-overlay.mjs'
      - 'scripts/test-game-creator-post-create.mjs'
      - 'scripts/test-quick-review-text-model-wiring.mjs'
      - 'scripts/lib/verified-game-import.mjs'
      - 'game/_shared/game-page-materialized-data.js'
      - '.github/workflows/game-post-create-enrichment.yml'

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: game-post-create-enrichment-v2-staging
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ''
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REVIEW_MODEL: ${{ vars.GITHUB_REVIEW_MODEL || 'openai/gpt-4.1' }}
      GITHUB_VISION_MODEL: ${{ vars.GITHUB_VISION_MODEL || vars.GITHUB_REVIEW_MODEL || 'openai/gpt-4.1' }}
      LOCAL_TEXT_MODEL: qwen3:1.7b
      LOCAL_EDITORIAL_MODEL: qwen3:1.7b
      LOCAL_VISION_MODEL: qwen3-vl:4b
      POST_CREATE_REVIEW_BATCH: '3'
      POST_CREATE_MAX_ATTEMPTS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate post-create boundary
        run: |
          node --check scripts/ensure-game-page.mjs
          node --check scripts/materialize-known-series.mjs
          node --check scripts/enrich-game-media-from-sources.mjs
          node --check scripts/discover-review-sources-web-v14.mjs
          node --check scripts/discover-review-sources-web-v15.mjs
          node --check scripts/prepare-post-create-review-research.mjs
          node --check scripts/lib/review-source-registry.mjs
          node --check scripts/lib/review-score-extractor.mjs
          node --check scripts/build-review-bootstrap-local.mjs
          node --check scripts/materialize-review-publication-feed.mjs
          node --check scripts/run-game-post-create-enrichment.mjs
          node --check scripts/publish-game-post-create-overlay.mjs
          node --check scripts/test-game-creator-post-create.mjs
          node --check scripts/test-quick-review-text-model-wiring.mjs
          node --check scripts/lib/verified-game-import.mjs
          node --check game/_shared/game-page-materialized-data.js
          node scripts/test-game-creator-boundary.mjs
          node scripts/test-game-creator-post-create.mjs
          node scripts/test-quick-review-text-model-wiring.mjs

      - name: Bootstrap series, rating and media for every requested game
        env:
          POST_CREATE_PHASE: bootstrap
        run: node scripts/run-game-post-create-enrichment.mjs

      - name: Publish fast module checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: bootstrap
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Restore local editorial model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-post-create-v1

      - name: Start local editorial model service
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Ensure required text model and optional vision model
        run: |
          set -euo pipefail
          pull_required() {
            model="$1"
            for attempt in 1 2 3 4 5; do
              ollama list | grep -Fq "$model" && return 0
              ollama pull "$model" && return 0
              sleep $((attempt * 5))
            done
            echo "::error::Required text model $model is unavailable after retries."
            return 1
          }
          pull_optional() {
            model="$1"
            for attempt in 1 2 3; do
              ollama list | grep -Fq "$model" && return 0
              ollama pull "$model" && return 0
              sleep $((attempt * 5))
            done
            echo "::warning::Optional vision model $model is unavailable; quick text review will continue and full visual upgrade remains pending."
            return 0
          }
          pull_required "$LOCAL_TEXT_MODEL"
          pull_optional "$LOCAL_VISION_MODEL"

      - name: Build bounded quick reviews for green-rated games
        env:
          POST_CREATE_PHASE: quick-review
        run: node scripts/run-game-post-create-enrichment.mjs

      - name: Publish quick-review checkpoint before full upgrades
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: quick-review
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Run bounded full-review upgrades
        env:
          POST_CREATE_PHASE: full-review
        run: node scripts/run-game-post-create-enrichment.mjs

      - name: Publish full-review checkpoint conflict-safely
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: full-review
        run: node scripts/publish-game-post-create-overlay.mjs
