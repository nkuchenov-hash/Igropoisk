name: Enrich newly created Игропоиск games

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [staging]
    paths:
      - 'config/review-commercial-contract.json'
      - 'config/parsers/review-source-registry*.json'
      - 'config/parsers/review-media-policy.json'
      - 'config/game-dna-taxonomy.json'
      - 'scripts/ensure-game-page.mjs'
      - 'scripts/materialize-known-series.mjs'
      - 'scripts/materialize-post-create-game-dna.mjs'
      - 'scripts/build-game-dna.mjs'
      - 'scripts/validate-game-dna.mjs'
      - 'scripts/build-similarity-index.mjs'
      - 'scripts/enrich-game-media-from-sources.mjs'
      - 'scripts/enforce-commercial-game-media.mjs'
      - 'scripts/build-review-bootstrap-commercial.mjs'
      - 'scripts/build-review-bootstrap-commercial-grounded.mjs'
      - 'scripts/render-review-bootstrap.mjs'
      - 'scripts/verify-post-create-quick-reviews.mjs'
      - 'scripts/build-review-article-corpus.mjs'
      - 'scripts/build-review-article-corpus-resilient.mjs'
      - 'scripts/classify-review-importance.mjs'
      - 'scripts/lib/review-importance.mjs'
      - 'scripts/prepare-sectioned-review-meta.mjs'
      - 'scripts/run-commercial-review-contract.mjs'
      - 'scripts/synthesize-commercial-review-openai.mjs'
      - 'scripts/synthesize-commercial-review-resilient.mjs'
      - 'scripts/synthesize-commercial-review-resilient-wrapper.mjs'
      - 'scripts/enrich-commercial-review-media-openai.mjs'
      - 'scripts/enrich-commercial-review-media-resilient.mjs'
      - 'scripts/validate-commercial-review-v2.mjs'
      - 'scripts/render-review-pages.mjs'
      - 'scripts/materialize-review-publication-feed.mjs'
      - 'scripts/finalize-commercial-post-create.mjs'
      - 'scripts/sync-review-policy.mjs'
      - 'scripts/run-game-post-create-enrichment.mjs'
      - 'scripts/resolve-post-create-event-targets.mjs'
      - 'scripts/smoke-published-review-pages.mjs'
      - 'scripts/publish-game-post-create-overlay.mjs'
      - 'scripts/publish-post-create-production.mjs'
      - 'scripts/test-commercial-review-contract-v2.mjs'
      - 'scripts/test-game-creator-post-create.mjs'
      - 'scripts/test-commercial-quick-review-depth.mjs'
      - 'scripts/test-review-importance-gate.mjs'
      - 'scripts/test-full-review-provider-order.mjs'
      - 'scripts/test-post-create-production-publisher.mjs'
      - 'scripts/lib/local-editorial-model.mjs'
      - 'scripts/lib/verified-game-import.mjs'
      - 'article/_shared/review-carousel.js'
      - 'article/_shared/review-shot-card.css'
      - 'game/_shared/game-page-materialized-data.js'
      - '.github/workflows/game-post-create-enrichment.yml'
      - '.github/workflows/game-post-create-continuation.yml'
      - '.github/workflows/review-synthesis.yml'
  pull_request:
    branches: [staging]
    types: [closed]
    paths:
      - 'data/game-enrichment-requests/*.json'
      - 'game/*/index.html'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: game-post-create-enrichment-v8-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'staging' }}
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LOCAL_TEXT_MODEL: qwen3:4b
      LOCAL_EDITORIAL_MODEL: qwen3:4b
      LOCAL_WRITER_MODEL: qwen3:0.6b
      POST_CREATE_BACKLOG_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve event-scoped game targets or one retry candidate
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-post-create-event-targets.mjs

      - name: Validate unified post-create boundary
        run: |
          node --check scripts/ensure-game-page.mjs
          node --check scripts/materialize-known-series.mjs
          node --check scripts/materialize-post-create-game-dna.mjs
          node --check scripts/build-game-dna.mjs
          node --check scripts/validate-game-dna.mjs
          node --check scripts/build-similarity-index.mjs
          node --check scripts/enrich-game-media-from-sources.mjs
          node --check scripts/enforce-commercial-game-media.mjs
          node --check scripts/build-review-bootstrap-commercial.mjs
          node --check scripts/build-review-bootstrap-commercial-grounded.mjs
          node --check scripts/render-review-bootstrap.mjs
          node --check scripts/verify-post-create-quick-reviews.mjs
          node --check scripts/build-review-article-corpus.mjs
          node --check scripts/build-review-article-corpus-resilient.mjs
          node --check scripts/classify-review-importance.mjs
          node --check scripts/lib/review-importance.mjs
          node --check scripts/prepare-sectioned-review-meta.mjs
          node --check scripts/run-commercial-review-contract.mjs
          node --check scripts/synthesize-commercial-review-openai.mjs
          node --check scripts/synthesize-commercial-review-resilient.mjs
          node --check scripts/synthesize-commercial-review-resilient-wrapper.mjs
          node --check scripts/enrich-commercial-review-media-openai.mjs
          node --check scripts/enrich-commercial-review-media-resilient.mjs
          node --check scripts/validate-commercial-review-v2.mjs
          node --check scripts/render-review-pages.mjs
          node --check scripts/materialize-review-publication-feed.mjs
          node --check scripts/finalize-commercial-post-create.mjs
          node --check scripts/sync-review-policy.mjs
          node --check scripts/run-game-post-create-enrichment.mjs
          node --check scripts/resolve-post-create-event-targets.mjs
          node --check scripts/smoke-published-review-pages.mjs
          node --check scripts/publish-game-post-create-overlay.mjs
          node --check scripts/publish-post-create-production.mjs
          node --check scripts/test-commercial-review-contract-v2.mjs
          node --check scripts/test-game-creator-post-create.mjs
          node --check scripts/test-commercial-quick-review-depth.mjs
          node --check scripts/test-review-importance-gate.mjs
          node --check scripts/test-full-review-provider-order.mjs
          node --check scripts/test-post-create-production-publisher.mjs
          node --check scripts/lib/local-editorial-model.mjs
          node --check scripts/lib/verified-game-import.mjs
          node --check article/_shared/review-carousel.js
          node --check game/_shared/game-page-materialized-data.js
          node scripts/test-game-creator-boundary.mjs
          node scripts/test-commercial-review-contract-v2.mjs
          node scripts/test-game-creator-post-create.mjs
          node scripts/test-commercial-quick-review-depth.mjs
          node scripts/test-review-importance-gate.mjs
          node scripts/test-full-review-provider-order.mjs
          node scripts/test-post-create-production-publisher.mjs
          node scripts/test-review-carousel-version-gate.mjs

      - name: Synchronize legacy policy mirrors from commercial contract
        run: node scripts/sync-review-policy.mjs

      - name: Materialize Game DNA and similarity immediately after page creation
        if: steps.scope.outputs.count != '0'
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/materialize-post-create-game-dna.mjs "${TARGETS[@]}"

      - name: Publish Game DNA checkpoint before network enrichment
        if: steps.scope.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: dna
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Bootstrap series rating and source-backed raw media
        if: steps.scope.outputs.count != '0'
        env:
          POST_CREATE_PHASE: bootstrap
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/run-game-post-create-enrichment.mjs "${TARGETS[@]}"

      - name: Publish source-backed bootstrap checkpoint
        if: steps.scope.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: bootstrap
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Build and verify deterministic grounded quick reviews
        if: steps.scope.outputs.count != '0'
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          for slug in "${TARGETS[@]}"; do
            node scripts/build-review-bootstrap-commercial.mjs "$slug"
          done
          node scripts/verify-post-create-quick-reviews.mjs "${TARGETS[@]}"

      - name: Publish quick factual checkpoint before editorial selection
        if: steps.scope.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: quick-review
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Verify published quick material on production Pages
        if: steps.scope.outputs.count != '0'
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
          REVIEW_SMOKE_ATTEMPTS: '36'
          REVIEW_SMOKE_DELAY_MS: '5000'
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/smoke-published-review-pages.mjs "${TARGETS[@]}"

      - name: Determine whether a full editorial review is required
        id: importance
        if: steps.scope.outputs.count != '0'
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/classify-review-importance.mjs "${TARGETS[@]}"

      - name: Publish review-importance decision
        if: steps.scope.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: review-importance
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Finalize page when a full review is not required
        id: quick_finalize
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade != 'true' && steps.importance.outputs.pending != 'true'
        continue-on-error: true
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/finalize-commercial-post-create.mjs "${TARGETS[@]}"

      - name: Publish completed non-full-review page state
        if: steps.quick_finalize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: page-complete
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Record unresolved editorial importance for continuation
        if: steps.importance.outputs.pending == 'true'
        run: echo 'Editorial importance remains unresolved. The next page worker cycle will continue source discovery; no full review is started yet.'

      - name: Restore local full-review model cache
        id: ollama_cache
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-commercial-local-v2-${{ runner.os }}
          restore-keys: |
            ollama-commercial-local-v2-

      - name: Start local full-review model service
        id: full_model_service
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          nohup ollama serve >/tmp/ollama-commercial.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama-commercial.log || true
          exit 1

      - name: Ensure required local review models
        id: local_models
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade == 'true' && steps.full_model_service.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for MODEL in "$LOCAL_TEXT_MODEL" "$LOCAL_WRITER_MODEL"; do
            READY=false
            for attempt in 1 2 3 4 5; do
              if ollama list | grep -Fq "$MODEL"; then READY=true; break; fi
              if ollama pull "$MODEL"; then READY=true; break; fi
              sleep $((attempt * 5))
            done
            if [ "$READY" != true ]; then
              echo "Local model $MODEL is unavailable in this worker cycle." >&2
              exit 75
            fi
          done

      - name: Save local full-review model cache before generation
        if: steps.local_models.outcome == 'success' && steps.ollama_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-commercial-local-v2-${{ runner.os }}

      - name: Run required local full commercial review upgrade
        id: full_upgrade
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade == 'true' && steps.full_model_service.outcome == 'success' && steps.local_models.outcome == 'success'
        continue-on-error: true
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/run-commercial-review-contract.mjs "${TARGETS[@]}"

      - name: Persist incomplete full-review state for automatic continuation
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade == 'true' && steps.full_upgrade.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: full-review-retry
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Record automatic continuation requirement
        if: steps.importance.outputs.full_upgrade == 'true' && steps.full_upgrade.outcome != 'success'
        run: echo 'Editorially required full review remains incomplete. Persisted state will be picked up automatically by the next page worker cycle.'

      - name: Verify required full review completed locally
        if: steps.importance.outputs.full_upgrade == 'true' && steps.full_upgrade.outcome == 'success'
        env:
          POST_CREATE_TARGETS: ${{ steps.scope.outputs.slugs }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const targets=String(process.env.POST_CREATE_TARGETS||'').split(',').filter(Boolean);
          const o=JSON.parse(fs.readFileSync('data/parser-runs/commercial-review-orchestrator.json','utf8'));
          const complete=new Set(o.completed||[]);
          const missing=targets.filter(slug=>!complete.has(slug));
          if(missing.length)throw new Error(`Required full review did not complete: ${missing.join(', ')}`);
          for(const slug of targets){
            const request=JSON.parse(fs.readFileSync(`data/game-enrichment-requests/${slug}.json`,'utf8'));
            if(request.review_importance?.status!=='required')throw new Error(`${slug}: full review ran without review_importance=required`);
            const v=JSON.parse(fs.readFileSync(`data/parser-runs/review-commercial-v2-${slug}.json`,'utf8'));
            const a=JSON.parse(fs.readFileSync(`data/articles/${slug}.json`,'utf8'));
            if(v.passed!==true)throw new Error(`${slug}: commercial validator is not green`);
            if(Number(v.metrics?.article_words||a.generation?.words||0)<3000)throw new Error(`${slug}: full review is below 3000 words`);
            if(a.generation?.editorial_audit?.passed!==true)throw new Error(`${slug}: final editorial audit is not green`);
          }
          console.log(JSON.stringify({status:'required-full-review-green',targets,provider_policy:'local_only',importance_gate:'required'},null,2));
          NODE

      - name: Publish full commercial review checkpoint
        if: steps.scope.outputs.count != '0' && steps.importance.outputs.full_upgrade == 'true' && steps.full_upgrade.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_CREATE_PUBLISH_PHASE: commercial-review
        run: node scripts/publish-game-post-create-overlay.mjs

      - name: Resolve completed full reviews for live smoke
        id: smoke
        if: steps.scope.outputs.count != '0' && steps.full_upgrade.outcome == 'success'
        shell: bash
        run: |
          SLUGS=$(node -e "const fs=require('fs');const p='data/parser-runs/commercial-review-orchestrator.json';const d=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};process.stdout.write((d.completed||[]).join(','))")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ -n "$SLUGS" ]; then echo "completed=$SLUGS"; else echo 'No required full commercial review completed in this pass.'; fi

      - name: Verify full commercial reviews on production Pages
        if: steps.smoke.outputs.slugs != ''
        env:
          POST_CREATE_TARGETS: ${{ steps.smoke.outputs.slugs }}
          REVIEW_SMOKE_ATTEMPTS: '48'
          REVIEW_SMOKE_DELAY_MS: '5000'
        run: |
          IFS=',' read -ra TARGETS <<< "$POST_CREATE_TARGETS"
          node scripts/smoke-published-review-pages.mjs "${TARGETS[@]}"
