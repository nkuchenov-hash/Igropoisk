name: Parse game data

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Optional game slug; leave empty to parse queued Steam games
        required: false
        type: string
      steam_appid:
        description: Optional Steam App ID for a single game
        required: false
        type: string
      title:
        description: Optional game title
        required: false
        type: string
      batch_limit:
        description: Maximum queued games to parse
        required: false
        type: string
        default: '5'

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate parser and lifecycle planner
        run: |
          node --check scripts/parse-game-data.mjs
          node --check scripts/hydrate-live-home-feeds.mjs
          node --check scripts/orchestrate-content.mjs
      - name: Hydrate current Popular and Releases snapshots
        if: inputs.slug == ''
        run: node scripts/hydrate-live-home-feeds.mjs
      - name: Build current lifecycle queue
        if: inputs.slug == ''
        run: node scripts/orchestrate-content.mjs
      - name: Parse one requested game
        if: inputs.slug != ''
        run: |
          test -n "${{ inputs.steam_appid }}" || { echo 'steam_appid is required when slug is provided'; exit 2; }
          node scripts/parse-game-data.mjs "${{ inputs.slug }}" "${{ inputs.steam_appid }}" "${{ inputs.title }}"
      - name: Parse queued Steam games
        if: inputs.slug == ''
        env:
          BATCH_LIMIT: ${{ inputs.batch_limit || '5' }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {spawnSync}=require('child_process');
          const plan=JSON.parse(fs.readFileSync('data/content-pipeline/execution-plan.json','utf8'));
          const limit=Math.max(1,Math.min(20,Number(process.env.BATCH_LIMIT||5)));
          const tasks=(plan.pages||[]).filter(item=>item.slug&&item.steam_appid).slice(0,limit);
          const results=[];
          for(const task of tasks){
            const run=spawnSync('node',['scripts/parse-game-data.mjs',task.slug,String(task.steam_appid),task.title||''],{stdio:'inherit'});
            results.push({slug:task.slug,steam_appid:task.steam_appid,status:run.status===0?'success':'failed'});
          }
          fs.mkdirSync('data/parser-runs',{recursive:true});
          fs.writeFileSync('data/parser-runs/game-data-batch.json',JSON.stringify({schema_version:1,checked_at:new Date().toISOString(),count:results.length,results},null,2)+'\n');
          if(results.some(item=>item.status==='failed'))process.exit(2);
          NODE
      - name: Prove parser did not write to GitHub
        if: always()
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
      - name: Preserve parsed data for the lifecycle builder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-data-parser-${{ github.run_id }}
          path: |
            data/parser-output
            data/parser-runs/game-data*.json
            data/parser-runs/home-feed-hydration.json
            data/content-pipeline/execution-plan.json
          if-no-files-found: warn
          retention-days: 7
