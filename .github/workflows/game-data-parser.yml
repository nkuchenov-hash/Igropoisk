name: Parse game data

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Game slug
        required: true
      steam_appid:
        description: Steam App ID
        required: true
      title:
        description: Game title
        required: false

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/parse-game-data.mjs "${{ inputs.slug }}" "${{ inputs.steam_appid }}" "${{ inputs.title }}"
      - name: Commit parser output
        run: |
          git config user.name "igropoisk-parser"
          git config user.email "actions@users.noreply.github.com"
          git add data/parser-output data/parser-runs/game-data.json
          git diff --cached --quiet || git commit -m "Parse game data for ${{ inputs.slug }}"
          git push
