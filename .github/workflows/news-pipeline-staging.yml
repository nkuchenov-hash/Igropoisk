name: News pipeline staging network test
# Fast commercial acceptance: native Russian + deterministic local translation.

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'config/news-pipeline.json'
      - 'data/news-sources.json'
      - 'data/youtube-sources.json'
      - 'scripts/**news*.mjs'
      - 'scripts/lib/yandex-object-storage.mjs'
      - 'scripts/publish-news-storage.mjs'
      - 'features/news/**'
      - '.github/workflows/news-pipeline*.yml'
      - '.github/workflows/yandex-storage-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: news-pipeline-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed pipeline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore local Russian translator runtime and model
        id: news_translator_cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/igropoisk-news-translator-runtime
            /tmp/igropoisk-news-translation-models
          key: news-translator-${{ runner.os }}-node22-hf-4.2.0-opus-en-ru-q8-v1

      - name: Install local Russian translator runtime
        if: steps.news_translator_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/igropoisk-news-translator-runtime
          npm install --prefix /tmp/igropoisk-news-translator-runtime --no-save --no-audit --no-fund @huggingface/transformers@4.2.0

      - name: Run contract tests
        run: |
          node --check scripts/edit-news-russian.mjs
          node --check scripts/merge-russian-news-feeds.mjs
          node --check scripts/lib/news-editor-qwen.mjs
          node --check scripts/lib/news-editor-production.mjs
          node --check scripts/lib/news-editor-policy.mjs
          node --check scripts/lib/news-content-policy.mjs
          node --check scripts/lib/news-editorial-summary.mjs
          node --check scripts/lib/news-home-selector.mjs
          node --check scripts/lib/news-primary-game-evidence.mjs
          node scripts/test-news-editor.mjs
          node scripts/test-news-commercial-quality.mjs
          node scripts/test-news-final-commercial-regressions.mjs
          node scripts/test-news-run287-regressions.mjs
          node scripts/test-news-run295-regressions.mjs
          node scripts/test-news-health-commercial-semantics.mjs
          node scripts/test-russian-news-feeds.mjs
          node scripts/test-news-home-selector.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/test-news-content-api.mjs
          node scripts/test-news-storage-content-api.mjs
          node scripts/test-news-media-cache-retention.mjs
          node scripts/test-news-image-fallback-contract.mjs
          node scripts/test-news-game-context-resolver.mjs
          node scripts/test-news-primary-game-refiner.mjs
          node scripts/validate-news-module.mjs
          node scripts/validate-production-boundaries.mjs

      - name: Run all source groups without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEWS_PIPELINE_REPORT: tmp/news-pipeline-staging-report.json
          NEWS_EDITOR_REPORT: tmp/news-editor-report.json
          NEWS_LOCAL_TRANSLATION_RUNTIME: /tmp/igropoisk-news-translator-runtime
          NEWS_LOCAL_TRANSLATION_CACHE: /tmp/igropoisk-news-translation-models
          NEWS_EDITOR_QWEN_MAX_ITEMS: '0'
          NEWS_EDITOR_MIN_PUBLIC: '12'
        run: |
          node scripts/run-news-pipeline.mjs --force
          git diff --check

      - name: Require production-equivalent news integrity
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          node scripts/audit-news-game-hashtags.mjs --strict --allow-missing-pages --production-ref origin/main

      - name: Prepare the resulting external snapshot without switching the manifest
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: node scripts/publish-news-storage.mjs --dry-run

      - name: Verify generated paths are isolated
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const config = require('./config/news-pipeline.json');
          const allowed = config.publication.commit_paths;
          const allowedTmp = new Set([
            'tmp/news-pipeline-staging-report.json',
            'tmp/news-editor-report.json',
            'tmp/news-game-identity-verification.json',
            'tmp/news-game-hashtag-normalization.json',
            'tmp/news-game-hashtag-audit.json'
          ]);
          const changed = execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], { encoding: 'utf8' })
            .split('\n').filter(Boolean).map(line => line.slice(3));
          const foreign = changed.filter(file => !allowedTmp.has(file)
            && !allowed.some(prefix => file === prefix || file.startsWith(`${prefix}/`)));
          if (foreign.length) throw new Error(`Pipeline changed foreign paths:\n${foreign.join('\n')}`);
          console.log(`Pipeline changed only approved paths: ${changed.length}.`);
          NODE

      - name: Upload staging report and snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-pipeline-staging-${{ github.sha }}
          path: |
            tmp/news-pipeline-staging-report.json
            tmp/news-editor-report.json
            tmp/news-game-identity-verification.json
            tmp/news-game-hashtag-normalization.json
            tmp/news-game-hashtag-audit.json
            data/news.json
            data/publisher-news.json
            data/youtube-signals.json
            data/news-events.json
            data/news-home-ru.json
            data/news-pipeline-health.json
            assets/news
            assets/publisher-news
          if-no-files-found: warn
          retention-days: 7
