name: News pipeline staging network test

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'config/news-pipeline.json'
      - 'data/news-sources.json'
      - 'data/youtube-sources.json'
      - 'scripts/**news*.mjs'
      - 'scripts/lib/yandex-object-storage.mjs'
      - 'scripts/publish-news-storage.mjs'
      - 'features/news/**'
      - '.github/workflows/news-pipeline*.yml'
      - '.github/workflows/yandex-storage-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: news-pipeline-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout proposed pipeline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run contract tests
        run: |
          node --check scripts/verify-news-game-identities.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/test-news-content-api.mjs
          node scripts/test-news-storage-content-api.mjs
          node scripts/test-news-game-context-resolver.mjs
          node scripts/test-news-primary-game-refiner.mjs
          node scripts/test-news-publication-gate.mjs
          node scripts/test-news-game-registry-discovery.mjs
          node scripts/validate-news-module.mjs
          node scripts/validate-production-boundaries.mjs

      - name: Run all source groups and web-verify game identities without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
          NEWS_GAME_VERIFY_BATCH: '8'
          NEWS_PIPELINE_REPORT: tmp/news-pipeline-staging-report.json
        run: |
          node scripts/run-news-pipeline.mjs --force
          git diff --check

      - name: Prepare the resulting external snapshot without switching the manifest
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: node scripts/publish-news-storage.mjs --dry-run

      - name: Verify generated paths are isolated
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const config = require('./config/news-pipeline.json');
          const allowed = config.publication.commit_paths;
          const changed = execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], { encoding: 'utf8' })
            .split('\n').filter(Boolean).map(line => line.slice(3));
          const foreign = changed.filter(file => file !== 'tmp/news-pipeline-staging-report.json'
            && !allowed.some(prefix => file === prefix || file.startsWith(`${prefix}/`)));
          if (foreign.length) throw new Error(`Pipeline changed foreign paths:\n${foreign.join('\n')}`);
          console.log(`Pipeline changed only approved paths: ${changed.length}.`);
          NODE

      - name: Upload staging report and snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-pipeline-staging-${{ github.sha }}
          path: |
            tmp/news-pipeline-staging-report.json
            tmp/news-game-identity-verification.json
            tmp/news-game-hashtag-normalization.json
            data/news.json
            data/publisher-news.json
            data/youtube-signals.json
            data/news-events.json
            data/news-home-ru.json
            data/news-pipeline-health.json
            assets/news
            assets/publisher-news
          if-no-files-found: warn
          retention-days: 7
