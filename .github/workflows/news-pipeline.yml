name: Autonomous news pipeline

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run all source groups regardless of freshness
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        required: false
        type: boolean
        default: false
    secrets:
      YC_S3_ACCESS_KEY_ID:
        required: true
      YC_S3_SECRET_ACCESS_KEY:
        required: true
      YC_S3_BUCKET:
        required: true
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [staging]
    paths:
      - 'config/news-pipeline.json'
      - 'data/news-sources.json'
      - 'data/youtube-sources.json'
      - 'data/news-game-aliases.json'
      - 'data/news-game-overrides.json'
      - 'scripts/fetch-news.mjs'
      - 'scripts/collect-regional-news.mjs'
      - 'scripts/postprocess-industry-news.mjs'
      - 'scripts/fetch-publisher-news.mjs'
      - 'scripts/fetch-youtube-signals.mjs'
      - 'scripts/build-news-events.mjs'
      - 'scripts/build-home-news.mjs'
      - 'scripts/build-news-pipeline-health.mjs'
      - 'scripts/run-news-pipeline.mjs'
      - 'scripts/validate-news-pipeline.mjs'
      - 'scripts/test-news-pipeline.mjs'
      - 'scripts/test-news-pipeline-health.mjs'
      - 'scripts/test-news-content-api.mjs'
      - 'scripts/test-news-storage-content-api.mjs'
      - 'scripts/test-news-game-linker.mjs'
      - 'scripts/validate-news-module.mjs'
      - 'scripts/lib/news-game-linker.mjs'
      - 'scripts/lib/news-game-registry-adapter.mjs'
      - 'scripts/lib/yandex-object-storage.mjs'
      - 'scripts/publish-news-storage.mjs'
      - '.github/workflows/news-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-news-pipeline-object-storage
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current staging code and fallback snapshot
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pipeline and storage code before network work
        run: |
          node --check scripts/run-news-pipeline.mjs
          node --check scripts/build-news-pipeline-health.mjs
          node --check scripts/validate-news-pipeline.mjs
          node --check scripts/lib/yandex-object-storage.mjs
          node --check scripts/publish-news-storage.mjs
          node scripts/test-news-pipeline.mjs
          node scripts/test-news-pipeline-health.mjs
          node scripts/test-news-content-api.mjs
          node scripts/test-news-storage-content-api.mjs
          node scripts/test-news-game-linker.mjs

      - name: Collect validate and prepare one isolated snapshot
        env:
          PIPELINE_FORCE: ${{ inputs.force || github.event.inputs.force || false }}
          NEWS_PIPELINE_REPORT: tmp/news-pipeline-report.json
        run: |
          args=()
          if [ "$PIPELINE_FORCE" = "true" ]; then
            args+=(--force)
          fi
          node scripts/run-news-pipeline.mjs "${args[@]}"
          git diff --check

      - name: Detect whether publication is required
        id: pipeline
        run: |
          status=$(node -e "const r=require('./tmp/news-pipeline-report.json'); process.stdout.write(r.status)")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Pipeline status: $status"

      - name: Publish immutable news snapshot and switch manifest
        if: steps.pipeline.outputs.status == 'success'
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_REGION: ru-central1
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: node scripts/publish-news-storage.mjs

      - name: Prove that the pipeline did not write to GitHub
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
          test -z "$(git status --porcelain --untracked-files=no | grep -E '^.. (features|index\.html|news/|game/|calendar/)' || true)"

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-pipeline-report-${{ github.run_id }}
          path: |
            tmp/news-pipeline-report.json
            data/news-pipeline-health.json
          if-no-files-found: warn
          retention-days: 14
