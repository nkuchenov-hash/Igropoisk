name: Review publication audit

on:
  workflow_dispatch:
  pull_request:
    branches: [staging, main]
    paths:
      - 'data/catalog-visible.json'
      - 'data/drafts/**'
      - 'data/articles/**'
      - 'data/reviews/**'
      - 'data/review-bootstrap/**'
      - 'game/**'
      - 'article/**'
      - 'scripts/audit-review-publication.mjs'
      - 'scripts/materialize-review-publication-feed.mjs'
      - 'scripts/test-game-page-bootstrap-review-publication.mjs'
      - '.github/workflows/review-publication-audit.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit and repair code
        run: |
          node --check scripts/audit-review-publication.mjs
          node --check scripts/materialize-review-publication-feed.mjs
          node --check scripts/test-game-page-bootstrap-review-publication.mjs
          node --check game/_shared/game-page-review-publication-control.js
      - name: Verify game pages expose green bootstrap reviews
        run: node scripts/test-game-page-bootstrap-review-publication.mjs
      - name: Audit actual user-visible review publication
        run: node scripts/audit-review-publication.mjs
      - name: Measure identity-safe feed repairs without changing repository files
        run: node scripts/materialize-review-publication-feed.mjs --dry-run
      - name: Upload review publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-publication-audit-${{ github.run_id }}
          path: |
            data/audits/review-publication.json
            data/audits/review-feed-materialization.json
          if-no-files-found: error
          retention-days: 14
