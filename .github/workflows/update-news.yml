name: Update global gaming news ranking

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    paths:
      - 'scripts/fetch-news.mjs'
      - 'scripts/postprocess-industry-news.mjs'
      - 'scripts/build-news-events.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: update-global-gaming-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build daily global gaming-news ranking
        run: node scripts/fetch-news.mjs

      - name: Localize and classify ranked news
        run: node scripts/postprocess-industry-news.mjs

      - name: Rebuild unified news events
        run: node scripts/build-news-events.mjs

      - name: Commit ranked feed images and events
        run: |
          if git diff --quiet -- data/news.json data/news-events.json assets/news; then
            echo "Ranked feed and event index are current"
            exit 0
          fi
          git config user.name "igropoisk-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add data/news.json data/news-events.json assets/news
          git commit -m "Update daily global gaming news events"
          git push
