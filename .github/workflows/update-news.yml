name: Update gaming news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    paths:
      - 'scripts/fetch-news.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: update-gaming-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build daily global gaming-news ranking
        run: node scripts/fetch-news.mjs

      - name: Commit updated feed and images
        run: |
          if git diff --quiet -- data/news.json assets/news; then
            echo "News feed and images are already current"
            exit 0
          fi
          git config user.name "igropoisk-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json assets/news
          git commit -m "Update daily global gaming news ranking"
          git push
