name: Temporary short description readability patch

on:
  push:
    branches: [fix/short-description-readability-20260904]
    paths:
      - '.github/workflows/tmp-short-description-readability-patch.yml'
      - 'scripts/tmp-patch-short-description-readability.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-description-readability-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply readability-first short description contract
        run: node scripts/tmp-patch-short-description-readability.mjs
      - name: Verify JavaScript syntax
        run: node --check scripts/build-game-page.mjs
      - name: Commit production contract change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-game-page.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Make short game descriptions readability-first"
          git push origin HEAD:fix/short-description-readability-20260904
