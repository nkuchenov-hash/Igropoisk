name: Publish five-game editorial benchmark texts

on:
  push:
    branches: [benchmark/five-games-editorial-20260904]
    paths: ['.github/workflows/publish-five-game-editorial-benchmark.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark/five-games-editorial-20260904
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: nkuchenov-hash/Igropoisk
          run-id: 33856934139
          pattern: editorial-result-*
          path: benchmark-results-all
      - name: Build browser-readable benchmark pages
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='benchmark-results-all';
          const out='benchmarks/editorial-five-games/results';
          fs.rmSync(out,{recursive:true,force:true});
          fs.mkdirSync(out,{recursive:true});
          const files=[];
          const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?walk(p):e.name==='result.json'&&files.push(p)}};
          walk(root);
          const latest=new Map();
          for(const f of files){
            let r; try{r=JSON.parse(fs.readFileSync(f,'utf8'))}catch{continue}
            const key=`${r.game_slug}::${r.id}`;
            const prev=latest.get(key);
            if(!prev || String(r.completed_at||'') > String(prev.completed_at||'')) latest.set(key,r);
          }
          const rows=[...latest.values()].sort((a,b)=>String(a.game_title).localeCompare(String(b.game_title))||String(a.label).localeCompare(String(b.label)));
          const games=new Map();
          for(const r of rows){const a=games.get(r.game_slug)||[];a.push(r);games.set(r.game_slug,a)}
          const esc=s=>String(s??'').replaceAll('|','\\|');
          let index='# Игропоиск — живые результаты benchmark\n\n';
          index+='Один и тот же frozen evidence pack и редакционный контракт. Здесь опубликованы реальные ответы моделей из GitHub Actions run `33856934139`.\n\n';
          for(const [slug,rs] of games){
            const title=rs[0]?.game_title||slug;
            index+=`## [${title}](./${slug}/README.md)\n\n`;
            index+='| Модель | Статус | Слов | Разделов | Текст |\n|---|---|---:|---:|---|\n';
            fs.mkdirSync(path.join(out,slug),{recursive:true});
            let game=`# ${title}\n\n[← Все игры](../README.md)\n\n| Модель | Статус | Слов | Разделов | Результат |\n|---|---|---:|---:|---|\n`;
            for(const r of rs){
              const fn=`${r.id}.md`;
              const hasText=Boolean((r.short_description||'').trim() || (r.review||'').trim());
              const link=hasText?`[открыть](./${fn})`:'—';
              index+=`| ${esc(r.label)} | ${esc(r.status)} | ${r.review_words||0} | ${r.review_sections||0} | ${link.replace('./','./'+slug+'/')} |\n`;
              game+=`| ${esc(r.label)} | ${esc(r.status)} | ${r.review_words||0} | ${r.review_sections||0} | ${link} |\n`;
              if(hasText){
                let md=`# ${title} — ${r.label}\n\n[← ${title}](./README.md) · [← Все игры](../README.md)\n\n`;
                md+=`**Provider:** ${r.provider}  \n**Model:** \`${r.model}\`  \n**Status:** ${r.status}  \n**Review:** ${r.review_words||0} слов, ${r.review_sections||0} разделов  \n**Latency:** ${((r.elapsed_ms||0)/1000).toFixed(1)} s\n\n`;
                md+='## Короткое описание\n\n'+(r.short_description||'_нет_')+'\n\n## Полный обзор\n\n'+(r.review||'_нет_')+'\n';
                fs.writeFileSync(path.join(out,slug,fn),md);
              }
            }
            fs.writeFileSync(path.join(out,slug,'README.md'),game);
            index+='\n';
          }
          fs.writeFileSync(path.join(out,'README.md'),index);
          console.log(`Published ${rows.length} model/game rows across ${games.size} games`);
          NODE
      - name: Commit browser-readable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/editorial-five-games/results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish five-game benchmark texts"
          git push origin HEAD:benchmark/five-games-editorial-20260904
