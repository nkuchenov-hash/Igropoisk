name: Build publisher sitemap discovery
on:
  push:
    branches: [fix/review-publisher-sitemap-discovery]
    paths: [.github/workflows/_build-publisher-sitemap-discovery.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-publisher-sitemap-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire publisher sitemaps into unified registry and v8 discovery
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          registry_path=Path('config/parsers/review-source-registry.json')
          registry=json.loads(registry_path.read_text())
          for source_id,index in [('pc-gamer','https://www.pcgamer.com/sitemap.xml'),('gamesradar','https://www.gamesradar.com/sitemap.xml')]:
              source=next((x for x in registry['sources'] if x.get('id')==source_id),None)
              if not source or not source.get('review'): raise RuntimeError(f'Missing editorial source {source_id}')
              source['review']['sitemap_index']=index
              source['review']['sitemap_year_offsets']=[0,1]
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n')

          discovery_path=Path('scripts/discover-review-sources-web-v8.mjs')
          discovery=discovery_path.read_text()
          import_needle="import {isTrustedEditorialScore} from './lib/review-score-extractor.mjs';"
          if 'review-publisher-sitemap.mjs' not in discovery:
              discovery=discovery.replace(import_needle,import_needle+"\nimport {publisherSitemapCandidates} from './lib/review-publisher-sitemap.mjs';")
          search_rx=re.compile(r'async function search\(def\)\{[^\n]*\}\n\nconst accepted=')
          new_search=r'''async function search(def){
  const source=registry.sources.find(item=>item.id===def.id),domain=(source?.domains||[])[0];
  if(!domain)return{def,reachable:false,items:[]};
  const sitemap=def.sitemap_index&&year?await publisherSitemapCandidates({sourceId:def.id,indexUrl:def.sitemap_index,title,year,yearOffsets:def.sitemap_year_offsets,limit:12}):{reachable:false,items:[]};
  const requests=[];
  for(const query of queryVariants(def,domain)){requests.push(get(`https://www.bing.com/search?count=12&q=${encodeURIComponent(query)}`,SEARCH_TIMEOUT));requests.push(get(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`,SEARCH_TIMEOUT))}
  const responses=await Promise.all(requests),items=[];
  const add=item=>{const url=canon(item.url);if(!url||items.some(found=>found.url===url))return;items.push({...item,url})};
  for(const item of sitemap.items||[])add({...item,discovery_method:'publisher_sitemap'});
  for(const response of responses)if(response.ok)for(const item of searchResults(response.body))if(host(item.url)===domain||host(item.url).endsWith('.'+domain))add({...item,discovery_method:'external_search'});
  return{def,reachable:Boolean(sitemap.reachable)||responses.some(response=>response.ok),items:items.slice(0,16)};
}'''
          if not search_rx.search(discovery): raise RuntimeError('Unable to locate v8 search function')
          discovery=search_rx.sub(lambda _:new_search+'\n\nconst accepted=',discovery,1)
          discovery_path.write_text(discovery)

          workflow_path=Path('.github/workflows/review-score-contract.yml')
          workflow=workflow_path.read_text()
          path_needle="      - 'scripts/lib/review-score-extractor.mjs'"
          addition=path_needle+"\n      - 'scripts/lib/review-publisher-sitemap.mjs'\n      - 'scripts/test-review-publisher-sitemap.mjs'"
          if "scripts/lib/review-publisher-sitemap.mjs'" not in workflow: workflow=workflow.replace(path_needle,addition)
          check_needle='          node --check scripts/lib/review-score-extractor.mjs'
          if 'node --check scripts/lib/review-publisher-sitemap.mjs' not in workflow:
              workflow=workflow.replace(check_needle,check_needle+'\n          node --check scripts/lib/review-publisher-sitemap.mjs\n          node --check scripts/test-review-publisher-sitemap.mjs')
          test_needle='      - name: Validate unified source registry'
          if 'Validate publisher sitemap discovery' not in workflow:
              workflow=workflow.replace(test_needle,'      - name: Validate publisher sitemap discovery\n        run: node scripts/test-review-publisher-sitemap.mjs\n'+test_needle)
          workflow_path.write_text(workflow)
          PY
          node --check scripts/lib/review-publisher-sitemap.mjs
          node --check scripts/discover-review-sources-web-v8.mjs
          node --check scripts/test-review-publisher-sitemap.mjs
          node scripts/test-review-publisher-sitemap.mjs
          node scripts/test-review-source-score-adapters.mjs
          node scripts/validate-review-source-registry.mjs
          git diff --check
          git config user.name "igropoisk-tools[bot]"
          git config user.email "igropoisk-tools[bot]@users.noreply.github.com"
          git add config/parsers/review-source-registry.json scripts/lib/review-publisher-sitemap.mjs scripts/lib/review-source-registry.mjs scripts/discover-review-sources-web-v8.mjs scripts/test-review-publisher-sitemap.mjs .github/workflows/review-score-contract.yml
          git commit -m "Discover registered reviews through publisher sitemaps"
          git push origin HEAD:fix/review-publisher-sitemap-discovery
