name: Emergency Pages publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-pages-publish.yml'
      - 'game/**'
      - 'data/reviews/**'
      - 'data/ratings/**'
      - 'data/articles/**'
      - 'data/drafts/**'
      - 'data/game-content/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
