name: Qwen news editor experiment

on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/lib/news-editor-qwen.mjs'
      - 'scripts/test-news-editor-qwen-live.mjs'
      - '.github/workflows/news-editor-qwen-test.yml'
  push:
    branches:
      - experiment/news-qwen-editor-20260826
      - experiment/news-qwen-editor-q8-benchmark-20260828
    paths:
      - 'scripts/lib/news-editor-qwen.mjs'
      - 'scripts/test-news-editor-qwen-live.mjs'
      - '.github/workflows/news-editor-qwen-test.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Qwen runtime and model cache
        id: qwen_cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/igropoisk-news-editor-runtime
            /tmp/igropoisk-news-editor-models
          key: news-editor-${{ runner.os }}-node22-hf-4.2.0-qwen3-4b-instruct-2507-q4f16-v1

      - name: Install Transformers.js runtime
        if: steps.qwen_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/igropoisk-news-editor-runtime
          npm install --prefix /tmp/igropoisk-news-editor-runtime --no-save --no-audit --no-fund @huggingface/transformers@4.2.0

      - name: Syntax check experiment
        run: |
          node --check scripts/lib/news-editor-qwen.mjs
          node --check scripts/test-news-editor-qwen-live.mjs

      - name: Run Qwen editorial benchmark on real news
        env:
          NEWS_EDITOR_MODEL: onnx-community/Qwen3-4B-Instruct-2507-ONNX
          NEWS_EDITOR_DTYPE: q4f16
          NEWS_EDITOR_RUNTIME: /tmp/igropoisk-news-editor-runtime
          NEWS_EDITOR_CACHE: /tmp/igropoisk-news-editor-models
          NEWS_EDITOR_BENCHMARK_LIMIT: '3'
        run: node scripts/test-news-editor-qwen-live.mjs

      - name: Upload editorial benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-news-editor-benchmark-q4f16-${{ github.run_id }}
          path: tmp/news-qwen-editor-benchmark.json
          if-no-files-found: warn
          retention-days: 14
