name: Home feeds check

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'assets/popular-home.js'
      - 'assets/home-releases/index.js'
      - 'features/home-releases/rules.json'
      - 'config/home-feeds-quality.json'
      - 'config/parsers/schedule.json'
      - 'config/parsers/releases.json'
      - 'config/parsers/popular.json'
      - 'scripts/curate-home-feeds.mjs'
      - 'scripts/lib/home-feed-identity.mjs'
      - 'scripts/lib/home-release-quality.mjs'
      - 'scripts/lib/popular-entity-resolution.mjs'
      - 'scripts/test-home-feed-quality.mjs'
      - 'scripts/parse-popular.mjs'
      - 'scripts/enrich-global-popular-youtube.mjs'
      - 'scripts/filter-popular.mjs'
      - 'scripts/resolve-popular-covers.mjs'
      - 'scripts/parse-releases.mjs'
      - 'scripts/run-scheduled-parsers.mjs'
      - 'scripts/validate-home-feeds.mjs'
      - 'scripts/smoke-home-feeds-browser.mjs'
      - 'tests/popular-entity-resolution.mjs'
      - '.github/workflows/parser-scheduler.yml'
      - '.github/workflows/home-feeds-check.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [staging]
    paths:
      - 'assets/popular-home.js'
      - 'assets/home-releases/index.js'
      - 'features/home-releases/rules.json'
      - 'config/home-feeds-quality.json'
      - 'config/parsers/schedule.json'
      - 'config/parsers/releases.json'
      - 'config/parsers/popular.json'
      - 'scripts/curate-home-feeds.mjs'
      - 'scripts/lib/home-feed-identity.mjs'
      - 'scripts/lib/home-release-quality.mjs'
      - 'scripts/lib/popular-entity-resolution.mjs'
      - 'scripts/test-home-feed-quality.mjs'
      - 'scripts/parse-popular.mjs'
      - 'scripts/enrich-global-popular-youtube.mjs'
      - 'scripts/filter-popular.mjs'
      - 'scripts/resolve-popular-covers.mjs'
      - 'scripts/parse-releases.mjs'
      - 'scripts/run-scheduled-parsers.mjs'
      - 'scripts/validate-home-feeds.mjs'
      - 'scripts/smoke-home-feeds-browser.mjs'
      - 'tests/popular-entity-resolution.mjs'
      - '.github/workflows/parser-scheduler.yml'
      - '.github/workflows/home-feeds-check.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --no-save --ignore-scripts image-size@2 puppeteer-core@24.16.0

      - name: Verify parser and browser code
        run: |
          node --check scripts/run-scheduled-parsers.mjs
          node --check scripts/curate-home-feeds.mjs
          node --check scripts/lib/home-feed-identity.mjs
          node --check scripts/lib/home-release-quality.mjs
          node --check scripts/lib/popular-entity-resolution.mjs
          node --check scripts/test-home-feed-quality.mjs
          node --check scripts/parse-popular.mjs
          node --check scripts/enrich-global-popular-youtube.mjs
          node --check tests/popular-entity-resolution.mjs
          node --check scripts/validate-home-feeds.mjs
          node --check scripts/smoke-home-feeds-browser.mjs
          node --check assets/home-releases/index.js
          node scripts/test-home-feed-quality.mjs
          node tests/popular-entity-resolution.mjs

      - name: Verify published data contracts
        run: node scripts/validate-home-feeds.mjs

      - name: Verify homepage rendering
        run: node scripts/smoke-home-feeds-browser.mjs

      - name: Reject malformed patches
        run: git diff --check