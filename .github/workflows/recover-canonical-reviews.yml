name: Recover canonical review seed

on:
  push:
    branches: [staging]
    paths:
      - 'scripts/discover-review-sources-web.mjs'
      - 'scripts/enrich-review-explicit-scores.mjs'
      - 'scripts/rebind-existing-review.mjs'
      - 'scripts/synthesize-review-local.mjs'
      - 'scripts/enrich-review-media-local.mjs'
      - 'scripts/audit-review-language-local.mjs'
      - 'scripts/lib/local-editorial-model.mjs'
      - 'scripts/quality-control-loop-v4.mjs'
      - 'scripts/quality-control-loop.mjs'
      - 'scripts/validate-top-250.mjs'
      - '.github/workflows/recover-canonical-reviews.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canonical-review-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LOCAL_EDITORIAL_MODEL: qwen3-vl:4b
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore local editorial model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-vl-4b-v1
      - name: Start local editorial model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama list | grep -q '^qwen3-vl:4b' || ollama pull qwen3-vl:4b
          ollama list
      - name: Validate recovery scripts
        run: |
          node --check scripts/discover-review-sources-web.mjs
          node --check scripts/enrich-review-explicit-scores.mjs
          node --check scripts/rebind-existing-review.mjs
          node --check scripts/synthesize-review-local.mjs
          node --check scripts/enrich-review-media-local.mjs
          node --check scripts/audit-review-language-local.mjs
          node --check scripts/quality-control-loop-v4.mjs
          node --check scripts/validate-top-250.mjs
      - name: Revalidate strongest existing professional corpora
        run: |
          set -uo pipefail
          slugs=(
            elden-ring
            the-witcher-3-wild-hunt
            red-dead-redemption-2
            god-of-war
            hades
            cyberpunk-2077
          )
          for slug in "${slugs[@]}"; do
            echo "=== $slug ==="
            node scripts/quality-control-loop.mjs review "$slug" || true
          done
      - name: Rebuild canonical publication feed and Top-250
        run: |
          node scripts/materialize-review-publication-feed.mjs
          node scripts/validate-top-250.mjs
          node scripts/audit-review-publication.mjs
          node - <<'NODE'
          const fs=require('fs');
          const top=JSON.parse(fs.readFileSync('data/top-250/current.json','utf8'));
          console.log(`Recovered canonical Top-250 entries: ${top.count}`);
          if(Number(top.count)<5) process.exit(2);
          NODE
      - name: Publish recovered canonical state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A -- data/reviews data/research data/parser-runs data/quality-control data/articles data/article-drafts data/article-media data/media-candidates data/top-250 article
          if git diff --cached --quiet; then
            echo 'No recovery changes.'
            exit 0
          fi
          node scripts/validate-top-250.mjs
          git diff --check
          branch="automation/recover-canonical-reviews-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "igropoisk-content[bot]"
          git config user.email "igropoisk-content[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Recover canonical professional review seed"
          git push origin "$branch"
          pr_url="$(gh pr create --base staging --head "$branch" --title "Recover canonical reviews ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --body "Revalidates existing professional publisher corpora under the canonical review-score contract and rebuilds Top-250 only from green published reviews. Editorial synthesis, visual audit and Russian-language audit use the local qwen3-vl model when external paid AI is unavailable.")"
          gh pr merge "$pr_url" --merge --delete-branch
