name: Centralize news components

on:
  push:
    branches: [phase-b1-news-isolation]
    paths:
      - 'scripts/centralize-news-components.mjs'
      - '.github/workflows/centralize-news-components.yml'

permissions:
  contents: write

concurrency:
  group: centralize-news-components
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-b1-news-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Move all component styling into the central design system
        run: node scripts/centralize-news-components.mjs
      - name: Validate the central component policy
        run: |
          node --check scripts/centralize-news-components.mjs
          node --check scripts/validate-central-design-system.mjs
          find features/news -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/validate-news-module.mjs
          node scripts/validate-central-design-system.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
          node scripts/smoke-news-browser.mjs
          python3 scripts/enforce_layout_contract.py --check
          node scripts/validate-game-v3.mjs
          node scripts/validate-editorial-pipeline.mjs
          git diff --check
      - name: Commit the migration
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Central component migration is already materialized"
            exit 0
          fi
          git restore --source=HEAD -- .github/workflows/news-module-check.yml .github/workflows/design-system-check.yml
          git config user.name "igropoisk-design-system[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/design-system.css DESIGN_SYSTEM.md PROJECT_RULES.md index.html features/news scripts/validate-news-module.mjs scripts/validate-central-design-system.mjs
          git commit -m "Phase B1: use only central design-system components"
          git pull --rebase origin phase-b1-news-isolation
          git push origin HEAD:phase-b1-news-isolation
