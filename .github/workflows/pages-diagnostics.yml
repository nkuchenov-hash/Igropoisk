name: Pages deployment diagnostics

on:
  workflow_run:
    workflows: ["Deploy Igropoisk to GitHub Pages"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let jobs = [];
            if (run.status === 'completed') {
              jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
            }

            const jobLines = jobs.length
              ? jobs.flatMap(job => {
                  const lines = [`- **${job.name}**: ${job.conclusion || job.status}`];
                  for (const step of job.steps || []) {
                    lines.push(`  - ${step.name}: ${step.conclusion || step.status}`);
                  }
                  return lines;
                }).join('\n')
              : '- Jobs are not available yet.';

            const marker = '<!-- igropoisk-pages-diagnostics -->';
            const body = `${marker}
            # GitHub Pages deployment status

            - Run: [#${run.run_number}](${run.html_url})
            - Run ID: \`${run.id}\`
            - Status: **${run.status}**
            - Conclusion: **${run.conclusion || 'pending'}**
            - Commit: \`${run.head_sha}\`
            - Event: \`${run.event}\`
            - Updated: \`${new Date().toISOString()}\`

            ## Jobs and steps

            ${jobLines}
            `;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.body && issue.body.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `Pages deployment: ${run.conclusion || run.status}`,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Pages deployment: ${run.conclusion || run.status}`,
                body,
              });
            }
