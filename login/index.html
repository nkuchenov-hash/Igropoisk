<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Вход в личный кабинет Игропоиска.">
  <title>Вход — Игропоиск</title>
  <link rel="stylesheet" href="../assets/design-system.css?v=20260804-1">
  <link rel="stylesheet" href="../assets/account.css?v=20260804-1">
  <link rel="stylesheet" href="../assets/account-user.css?v=20260804-1">
  <link rel="stylesheet" href="/Igropoisk/assets/site-header.css?v=20260803-2" data-ig-shared-header="style">
  <link rel="stylesheet" href="/Igropoisk/assets/layout-contract.css?v=20260803-1" data-ig-layout-contract="style">
</head>
<body>
<header class="ig-site-header"></header>
<main class="auth-page">
  <div class="ig-container auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="auth-card__brand">
        <div class="auth-card__mark" aria-hidden="true">ИП</div>
        <div><h1 id="loginTitle">Вход</h1><p>Личный кабинет Игропоиска</p></div>
      </div>
      <p class="auth-card__intro">Войдите по имени пользователя или email.</p>
      <form class="auth-form" id="loginForm">
        <label class="auth-field"><span>Имя пользователя или email</span><input id="loginUsername" name="username" autocomplete="username" required></label>
        <label class="auth-field"><span>Пароль</span><div class="auth-password"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button id="passwordToggle" type="button" aria-label="Показать пароль">Показать</button></div></label>
        <label class="auth-check"><input id="loginRemember" type="checkbox"><span>Оставаться в системе на этом устройстве</span></label>
        <p class="auth-error" id="loginError" role="alert" aria-live="polite"></p>
        <button class="auth-submit" id="loginSubmit" type="submit">Войти</button>
      </form>
      <div class="auth-switch"><span>Нет аккаунта?</span><a href="../register/">Зарегистрироваться</a></div>
      <p class="auth-note">Пока аккаунты сохраняются локально в этом браузере. После подключения сервера они будут доступны на всех устройствах.</p>
    </section>
  </div>
</main>
<script src="../assets/auth.js?v=20260804-6"></script>
<script src="../assets/login-page.js?v=20260804-1"></script>
  <script src="/Igropoisk/assets/site-header.js?v=20260803-2" data-ig-shared-header="script" defer></script>
  <script src="/Igropoisk/assets/layout-contract.js?v=20260803-1" data-ig-layout-contract="script" defer></script>
</body>
</html>
