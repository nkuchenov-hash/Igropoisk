<svg xmlns="http://www.w3.org/2000/svg" width="460" height="510" viewBox="0 0 460 510"><style>.h{font:800 18px Arial,sans-serif;fill:#9fe000;letter-spacing:.7px}.t{font:700 17px Arial,sans-serif;fill:#f4f6f7}.p{font:400 15px Arial,sans-serif;fill:#aab6bf}.n{font:800 15px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style><text x="28" y="34" class="h">КАК ЭТО РАБОТАЕТ</text><g transform="translate(28 68)"><rect width="34" height="34" rx="10" fill="#83cf00"/><text x="17" y="18" class="n">1</text><text x="52" y="14" class="t">Расскажи о себе</text><text x="52" y="37" class="p">Опиши настроение, время, жанры</text><text x="52" y="57" class="p">и платформы.</text></g><g transform="translate(28 155)"><rect width="34" height="34" rx="10" fill="#83cf00"/><text x="17" y="18" class="n">2</text><text x="52" y="14" class="t">Получи уточняющие вопросы</text><text x="52" y="37" class="p">Ответь на 2–4 коротких вопроса,</text><text x="52" y="57" class="p">чтобы сузить подбор.</text></g><g transform="translate(28 242)"><rect width="34" height="34" rx="10" fill="#83cf00"/><text x="17" y="18" class="n">3</text><text x="52" y="14" class="t">Смотри лучшие варианты</text><text x="52" y="37" class="p">Получай 5–10 игр с объяснением,</text><text x="52" y="57" class="p">почему они тебе подойдут.</text></g><g transform="translate(28 329)"><rect width="34" height="34" rx="10" fill="#83cf00"/><text x="17" y="18" class="n">4</text><text x="52" y="14" class="t">Уточняй и исключай</text><text x="52" y="37" class="p">Исключай то, что не нравится,</text><text x="52" y="57" class="p">и находи более точные игры.</text></g><g transform="translate(28 416)"><rect width="34" height="34" rx="10" fill="#83cf00"/><text x="17" y="18" class="n">5</text><text x="52" y="14" class="t">Мы запоминаем твой вкус</text><text x="52" y="37" class="p">С каждым подбором рекомендации</text><text x="52" y="57" class="p">становятся лучше.</text></g></svg>